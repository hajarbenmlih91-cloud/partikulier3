; Partikulier local settings (dev only)
memory_limit = 512M
upload_max_filesize = 12M
post_max_size = 160M
max_execution_time = 120
; Rate limiter, search cache version and contract suites rely on APCu,
; including from the CLI (php tests/*.php, wp eval).
apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 64M
expose_php = Off
display_errors = Off
log_errors = On
