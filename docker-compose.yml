# Local test stack for Partikulier — mirrors .github/workflows/contrats-recette.yml
#   powershell -ExecutionPolicy Bypass -File .\docker\setup-local.ps1
name: partikulier

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${PK_DB_NAME:-partikulier}
      MYSQL_USER: ${PK_DB_USER:-partikulier}
      MYSQL_PASSWORD: ${PK_DB_PASSWORD:?set PK_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${PK_DB_ROOT_PASSWORD:?set PK_DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        WP_IMAGE_TAG: ${PK_WP_IMAGE_TAG:-6.6-php8.3-apache}
        WITH_AVIF_TOOLS: ${PK_WITH_AVIF_TOOLS:-0}
    image: partikulier-wordpress:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      n8n-proxy:
        condition: service_started
    ports:
      - "127.0.0.1:8099:8099"   # loopback only: never expose the test site on the LAN
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${PK_DB_NAME:-partikulier}
      WORDPRESS_DB_USER: ${PK_DB_USER:-partikulier}
      WORDPRESS_DB_PASSWORD: ${PK_DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('PARTIKULIER_ENABLE_AVIF_DELIVERY', false);
      PK_SITE_URL: http://localhost:8099
      PK_ADMIN_USER: ${PK_ADMIN_USER:-admin}
      PK_ADMIN_PASSWORD: ${PK_ADMIN_PASSWORD:?set PK_ADMIN_PASSWORD in .env}
      PK_ADMIN_EMAIL: ${PK_ADMIN_EMAIL:-admin@example.test}
      PK_WITH_POLYLANG: ${PK_WITH_POLYLANG:-0}
      # Optional n8n bridge (leave empty to keep automation routes closed).
      PARTIKULIER_N8N_SECRET: ${PARTIKULIER_N8N_SECRET:-}
      PARTIKULIER_N8N_WEBHOOK_URL: ${PARTIKULIER_N8N_WEBHOOK_URL:-}
      PK_LOCAL_N8N_CA_FILE: /local-caddy/caddy/pki/authorities/local/root.crt
      # Contract suites (php wp-content/plugins/partikulier-core/tests/*.php)
      PK_WP_DIR: /var/www/html
      PK_REPO_DIR: /repo
      PK_THEME_DIR: /var/www/html/wp-content/themes/partikulier
      PK_VERSION: "2.10.16"
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_core:/var/www/html
      - ./plugin/partikulier-core:/var/www/html/wp-content/plugins/partikulier-core
      - ./theme/partikulier:/var/www/html/wp-content/themes/partikulier
      - ./docker/mu-plugins/pk-dev-mailpit.php:/var/www/html/wp-content/mu-plugins/pk-dev-mailpit.php:ro
      - ./docker/mu-plugins/pk-dev-n8n.php:/var/www/html/wp-content/mu-plugins/pk-dev-n8n.php:ro
      - caddy_data:/local-caddy:ro
      - .:/repo:ro

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web UI for captured e-mails

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Africa/Casablanca
      GENERIC_TIMEZONE: Africa/Casablanca
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run docker/setup-local.ps1 first}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      WEBHOOK_URL: ${N8N_PUBLIC_WEBHOOK_URL:-https://n8n-proxy/}
      N8N_PROXY_HOPS: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      PARTIKULIER_N8N_SECRET: ${PARTIKULIER_N8N_SECRET:?run docker/setup-local.ps1 first}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "none"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  n8n-proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      - ./docker/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  wp_core:
  n8n_data:
    external: true
    name: ${PK_N8N_VOLUME:-partikulier_n8n_data}
  caddy_data:
  caddy_config:
