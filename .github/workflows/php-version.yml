name: Contrôle PHP et audit manuel du staging UAT

# Par défaut, lecture seule : version PHP uniquement. L'option d'audit UAT
# appelle un workflow de recette isolé : pas de déploiement, compte temporaire
# supprimé après le parcours, charge appliquée uniquement au staging confirmé.
# Aucun secret n'est imprimé.

on:
  workflow_dispatch:
    inputs:
      run_uat_audit:
        description: Lancer l'audit public UAT (sans secrets ni connexion propriétaire)
        required: true
        default: false
        type: boolean
      run_connected_uat_audit:
        description: Audit complet UAT avec accès protégé aux secrets et compte propriétaire temporaire
        required: true
        default: false
        type: boolean
      run_uat_load_test:
        description: Ajouter un test de charge UAT (10 puis 100 req/s si la sonde tient); nécessite un audit public ou connecté
        required: true
        default: false
        type: boolean
      summarize_uat_run_id:
        description: Analyser un artefact UAT existant sans refaire de tests live (run ID numérique)
        required: false
        default: ''
        type: string
      summarize_connected_uat_run_id:
        description: Ajouter un artefact d'audit connecté déjà existant (run ID numérique, facultatif)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate-dispatch:
    name: Valider le mode de lancement avant tout accès externe
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que les options sont exclusives et cohérentes
        env:
          RUN_PUBLIC: ${{ inputs.run_uat_audit }}
          RUN_CONNECTED: ${{ inputs.run_connected_uat_audit }}
          RUN_LOAD: ${{ inputs.run_uat_load_test }}
          PUBLIC_RUN_ID: ${{ inputs.summarize_uat_run_id }}
          CONNECTED_RUN_ID: ${{ inputs.summarize_connected_uat_run_id }}
        run: |
          set -euo pipefail
          if [[ "$RUN_LOAD" == true && "$RUN_PUBLIC" != true && "$RUN_CONNECTED" != true ]]; then
            echo 'Le test de charge nécessite un audit public ou connecté.' >&2; exit 2
          fi
          if [[ "$RUN_PUBLIC" == true ]]; then
            if [[ "$RUN_CONNECTED" == true || -n "$PUBLIC_RUN_ID" || -n "$CONNECTED_RUN_ID" ]]; then
              echo 'Audit public, audit connecté et analyse d’artefact sont mutuellement exclusifs.' >&2; exit 2
            fi
          elif [[ "$RUN_CONNECTED" == true ]]; then
            if [[ -n "$PUBLIC_RUN_ID" || -n "$CONNECTED_RUN_ID" ]]; then
              echo 'Audit connecté et analyse d’artefact sont mutuellement exclusifs.' >&2; exit 2
            fi
          elif [[ -n "$PUBLIC_RUN_ID" ]]; then
            : # Rapport public; l’artefact connecté est facultatif.
          elif [[ -n "$CONNECTED_RUN_ID" ]]; then
            echo 'Un run connecté ne peut être analysé sans son run public associé.' >&2; exit 2
          fi
          echo 'Options cohérentes; aucun secret ni appel externe dans cette validation.'

  php-version:
    name: Version PHP du serveur
    needs: validate-dispatch
    if: ${{ !inputs.run_uat_audit && !inputs.run_connected_uat_audit && !inputs.run_uat_load_test && inputs.summarize_uat_run_id == '' && inputs.summarize_connected_uat_run_id == '' }}
    runs-on: ubuntu-latest
    environment: uat
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      WP_PATH: ${{ secrets.WP_PATH }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Lire la version et la date de compilation
        run: |
          set -euo pipefail
          : "${SSH_HOST:?secret SSH_HOST manquant}"
          : "${SSH_PORT:?secret SSH_PORT manquant}"
          : "${SSH_USER:?secret SSH_USER manquant}"
          : "${SSH_PRIVATE_KEY:?secret SSH_PRIVATE_KEY manquant}"
          : "${SSH_KNOWN_HOSTS:?secret SSH_KNOWN_HOSTS manquant}"
          : "${WP_PATH:?secret WP_PATH manquant}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          {
            echo "Host partikulier-hostinger"
            echo "  HostName $SSH_HOST"
            echo "  Port $SSH_PORT"
            echo "  User $SSH_USER"
            echo "  IdentityFile $HOME/.ssh/id_ed25519"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  ConnectionAttempts 4"
            echo "  ConnectTimeout 20"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh partikulier-hostinger 'bash -s' -- "$WP_PATH" <<'REMOTE'
          set -euo pipefail
          WP_PATH="$1"
          report() {
            bin="$1"
            if [ -x "$bin" ]; then
              "$bin" -v 2>/dev/null | head -n 1
            fi
          }
          echo "WEB_HEADER_EXPECTED=8.5"
          report "$(command -v php || true)"
          if [ -d /opt/alt ]; then
            for bin in /opt/alt/php85/usr/bin/php /opt/alt/php84/usr/bin/php /opt/alt/php83/usr/bin/php /opt/alt/php82/usr/bin/php; do
              report "$bin"
            done
          fi
          if [ -f "$HOME/.cl.selector/defaults.cfg" ]; then
            awk -F= 'tolower($1) ~ /php/ {print "SELECTOR " $0}' "$HOME/.cl.selector/defaults.cfg"
          fi
          REMOTE

      - name: Nettoyer la clé SSH
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

  audit-uat-public:
    name: Audit public du staging (sans secrets ni déploiement)
    needs: validate-dispatch
    if: ${{ inputs.run_uat_audit && !inputs.run_connected_uat_audit && inputs.summarize_uat_run_id == '' && inputs.summarize_connected_uat_run_id == '' }}
    uses: ./.github/workflows/audit-uat-public.yml
    with:
      load_test: ${{ inputs.run_uat_load_test }}

  audit-uat-connected:
    name: Audit complet protégé UAT (compte temporaire, sans déploiement)
    needs: validate-dispatch
    if: ${{ inputs.run_connected_uat_audit && inputs.summarize_uat_run_id == '' && inputs.summarize_connected_uat_run_id == '' }}
    uses: ./.github/workflows/audit-uat.yml
    with:
      load_test: ${{ inputs.run_uat_load_test }}
    secrets: inherit

  audit-report:
    name: Analyser l'artefact existant sans nouvel appel au staging
    needs: validate-dispatch
    if: ${{ inputs.summarize_uat_run_id != '' && !inputs.run_uat_audit && !inputs.run_connected_uat_audit && !inputs.run_uat_load_test }}
    uses: ./.github/workflows/audit-uat-report.yml
    with:
      run_id: ${{ inputs.summarize_uat_run_id }}
      connected_run_id: ${{ inputs.summarize_connected_uat_run_id }}
