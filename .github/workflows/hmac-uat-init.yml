name: Initialisation HMAC UAT

# Pose une clé initiale sur l'UAT Hostinger provisoire.
# N'affiche pas le secret, ne déploie pas le code, ne touche pas la production.
# S'arrête si une clé existe déjà : ce n'est pas une rotation.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hmac-uat-init
  cancel-in-progress: false

jobs:
  init:
    name: Poser la clé initiale UAT
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: uat
      url: https://darkcyan-yak-151002.hostingersite.com
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      WP_PATH: ${{ secrets.WP_PATH }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configurer SSH strict vers l'UAT
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Secret SSH_HOST absent}"
          : "${SSH_PORT:?Secret SSH_PORT absent}"
          : "${SSH_USER:?Secret SSH_USER absent}"
          : "${SSH_PRIVATE_KEY:?Secret SSH_PRIVATE_KEY absent}"
          : "${SSH_KNOWN_HOSTS:?Secret SSH_KNOWN_HOSTS absent}"
          : "${WP_PATH:?Secret WP_PATH absent}"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo 'SSH_HOST refusé par la validation stricte' >&2; exit 2; }
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SSH_USER refusé par la validation stricte' >&2; exit 2; }
          [[ "$SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( SSH_PORT <= 65535 )) || { echo 'SSH_PORT doit être numérique (1..65535, sans zéro initial)' >&2; exit 2; }
          [[ "$WP_PATH" == /* && "$WP_PATH" != *$'\n'* ]] || { echo 'WP_PATH doit être un chemin absolu sur une ligne' >&2; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          {
            echo "Host partikulier-uat"
            echo "  HostName $SSH_HOST"
            echo "  Port $SSH_PORT"
            echo "  User $SSH_USER"
            echo "  IdentityFile $HOME/.ssh/id_ed25519"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  ConnectionAttempts 4"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 15"
            echo "  ServerAliveCountMax 3"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          echo "SSH configuré; aucun secret affiché."

      - name: Écrire la clé initiale sans l'afficher
        env:
          PK_SECRET: ${{ secrets.PARTIKULIER_N8N_SECRET }}
          PK_KEY_ID: uat-initial
        run: |
          set -euo pipefail
          : "${PK_SECRET:?Secret PARTIKULIER_N8N_SECRET absent}"
          [[ "$PK_KEY_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo 'Key ID refusé' >&2; exit 2; }
          printf '%s' "$PK_SECRET" | ssh -F "$HOME/.ssh/config" partikulier-uat 'umask 077; cat > "$HOME/.pk-uat-init-secret"; chmod 600 "$HOME/.pk-uat-init-secret"'
          set +e
          ssh -F "$HOME/.ssh/config" partikulier-uat 'bash -s' -- "$WP_PATH" "$PK_KEY_ID" <<'REMOTE'
          set -euo pipefail
          wp_path="$1"
          key_id="$2"
          secret_file="$HOME/.pk-uat-init-secret"
          backup="$HOME/.pk-wp-config-before-hmac-init"
          trap 'rm -f "$secret_file"' EXIT
          test -s "$secret_file" || { echo 'Fichier de secret vide ou absent' >&2; exit 1; }
          test -f "$wp_path/wp-config.php" || { echo 'wp-config.php absent' >&2; exit 1; }
          cd "$wp_path"
          command -v wp >/dev/null 2>&1 || { echo 'WP-CLI absent sur la cible SSH' >&2; exit 1; }
          command -v php >/dev/null 2>&1 || { echo 'PHP absent sur la cible SSH' >&2; exit 1; }
          expected='darkcyan-yak-151002.hostingersite.com'
          home="$(wp option get home --quiet)"
          siteurl="$(wp option get siteurl --quiet)"
          case "${home%/}" in
            "https://$expected") ;;
            *) echo 'WordPress home ne correspond pas à la cible UAT autorisée' >&2; exit 1 ;;
          esac
          case "${siteurl%/}" in
            "https://$expected"|"https://$expected/"*) ;;
            *) echo 'WordPress siteurl ne correspond pas à la cible UAT autorisée' >&2; exit 1 ;;
          esac
          case "$home$siteurl" in
            *pep.ma*) echo 'Cible production refusée' >&2; exit 1 ;;
          esac
          state="$(wp eval 'echo "pre_constant=" . ((defined("PARTIKULIER_N8N_SECRET") && PARTIKULIER_N8N_SECRET) ? "present" : "absent") . "\n"; $settings = \Partikulier\Core\Domain\Automation\AutomationService::settings(); echo "pre_option=" . (empty($settings["automation_api_secret"]) ? "absent" : "present") . "\n"; echo "pre_previous=" . ((empty($settings["previous_secret"]) && empty($settings["previous_key_id"])) ? "absent" : "present") . "\n"; $legacy = get_option("pk_theme_options", array()); echo "pre_legacy=" . ((is_array($legacy) && !empty($legacy["automation_api_secret"])) ? "present" : "absent") . "\n";' --quiet)"
          printf '%s\n' "$state"
          case "$state" in
            *'pre_constant=absent'*'pre_option=absent'*'pre_previous=absent'*'pre_legacy=absent'*) ;;
            *) echo 'État initial inattendu ou clé déjà présente; arrêt sans rotation.' >&2; exit 3 ;;
          esac
          set +e
          php - "$wp_path/wp-config.php" "$key_id" "$secret_file" "$backup" <<'PHP'
          <?php
          $configPath = $argv[1];
          $keyId = $argv[2];
          $secretPath = $argv[3];
          $backup = $argv[4];
          $secret = trim((string) file_get_contents($secretPath));
          if (!preg_match('/^[A-Za-z0-9_-]{1,64}$/', $keyId)) {
              fwrite(STDERR, "Key ID refusé\n");
              exit(2);
          }
          if (!preg_match('/^[A-Za-z0-9+\/=]{44,}$/', $secret)) {
              fwrite(STDERR, "Format de secret refusé\n");
              exit(2);
          }
          $config = file_get_contents($configPath);
          if ($config === false) {
              fwrite(STDERR, "wp-config illisible\n");
              exit(1);
          }
          if (strpos($config, 'PARTIKULIER_N8N_SECRET') !== false || strpos($config, 'PARTIKULIER_N8N_KEY_ID') !== false) {
              fwrite(STDERR, "Constante déjà présente; arrêt sans modification\n");
              exit(3);
          }
          $block = "define('PARTIKULIER_N8N_KEY_ID', '" . $keyId . "');\n"
              . "define('PARTIKULIER_N8N_SECRET', '" . $secret . "');\n\n";
          $marker = "/* That's all, stop editing!";
          $pos = strpos($config, $marker);
          if ($pos === false) {
              $marker = "require_once ABSPATH . 'wp-settings.php';";
              $pos = strpos($config, $marker);
          }
          if ($pos === false) {
              fwrite(STDERR, "Point d'insertion introuvable\n");
              exit(1);
          }
          $updated = substr($config, 0, $pos) . $block . substr($config, $pos);
          $tmp = sys_get_temp_dir() . '/pk-wp-config-init-' . getmypid();
          if (file_put_contents($tmp, $updated) === false) {
              fwrite(STDERR, "Écriture temporaire impossible\n");
              exit(4);
          }
          exec('php -l ' . escapeshellarg($tmp) . ' >/dev/null 2>&1', $unused, $lint);
          if ($lint !== 0) {
              @unlink($tmp);
              fwrite(STDERR, "Syntaxe refusée; wp-config inchangé\n");
              exit(1);
          }
          if (!@copy($configPath, $backup)) {
              @unlink($tmp);
              fwrite(STDERR, "Sauvegarde locale impossible; wp-config inchangé\n");
              exit(4);
          }
          if (!@rename($tmp, $configPath)) {
              if (!@copy($tmp, $configPath)) {
                  @unlink($tmp);
                  fwrite(STDERR, "wp-config non inscriptible\n");
                  exit(4);
              }
              @unlink($tmp);
          }
          echo "INIT_PATH=constant\n";
          PHP
          php_status=$?
          set -e
          if [ "$php_status" -eq 0 ]; then
            :
          elif [ "$php_status" -eq 4 ]; then
            echo 'wp-config non inscriptible; initialisation par option WordPress, sans clé précédente.'
            PK_SECRET_FILE="$secret_file" PK_KEY_ID="$key_id" wp eval 'if (defined("PARTIKULIER_N8N_SECRET") && PARTIKULIER_N8N_SECRET) { fwrite(STDERR, "Constante déjà active; arrêt sans rotation\n"); exit(3); } $settings = \Partikulier\Core\Domain\Automation\AutomationService::settings(); if (!empty($settings["automation_api_secret"]) || !empty($settings["previous_secret"]) || !empty($settings["previous_key_id"])) { fwrite(STDERR, "Option déjà occupée; arrêt sans rotation\n"); exit(3); } $secret = trim((string) file_get_contents(getenv("PK_SECRET_FILE"))); $keyId = (string) getenv("PK_KEY_ID"); if (!preg_match("/^[A-Za-z0-9_-]{1,64}$/", $keyId) || !preg_match("/^[A-Za-z0-9+\\/=]{44,}$/", $secret)) { fwrite(STDERR, "Format refusé\n"); exit(2); } $settings["active_key_id"] = $keyId; $settings["automation_api_secret"] = $secret; unset($settings["previous_secret"], $settings["previous_key_id"], $settings["previous_expires_at"], $settings["pending_environment_key_id"]); update_option("pk_n8n_settings", $settings, false); echo "INIT_PATH=option\n";' --quiet
          else
            exit "$php_status"
          fi
          verify="$(wp eval 'echo "active_id=" . (string) array_key_first(\Partikulier\Core\Domain\Automation\AutomationService::secret_keys()) . "\n"; $keys = \Partikulier\Core\Domain\Automation\AutomationService::secret_keys(); echo "key_count=" . count($keys) . "\n"; $settings = \Partikulier\Core\Domain\Automation\AutomationService::settings(); echo "previous=" . ((empty($settings["previous_secret"]) && empty($settings["previous_key_id"])) ? "absent" : "present") . "\n"; echo "constant=" . ((defined("PARTIKULIER_N8N_SECRET") && PARTIKULIER_N8N_SECRET) ? "present" : "absent") . "\n"; echo "key_id_constant=" . (defined("PARTIKULIER_N8N_KEY_ID") ? (string) PARTIKULIER_N8N_KEY_ID : "absent") . "\n";' --quiet)"
          printf '%s\n' "$verify"
          case "$verify" in
            *"active_id=${key_id}"*) ;;
            *)
              echo 'Vérification refusée; restauration si une sauvegarde existe.' >&2
              if [ -f "$backup" ]; then cp "$backup" "$wp_path/wp-config.php"; echo 'wp-config restauré.'; fi
              exit 1
              ;;
          esac
          case "$verify" in
            *'previous=present'*) echo 'Une clé précédente est présente; arrêt.' >&2; exit 1 ;;
          esac
          rm -f "$backup"
          echo 'Clé initiale active. Valeur non affichée.'
          REMOTE
          status=$?
          ssh -F "$HOME/.ssh/config" partikulier-uat 'rm -f "$HOME/.pk-uat-init-secret" "$HOME/.pk-wp-config-before-hmac-init"' || true
          exit "$status"
