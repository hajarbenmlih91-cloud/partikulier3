                ping_code="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["pingback"])' "$xmlrpc")"
                hello_fault="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["hello_fault"])' "$xmlrpc")"
                ping_fault="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["pingback_fault"])' "$xmlrpc")"
                method_list="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["methods"])' "$xmlrpc")"
                record xmlrpc-list 'POST /xmlrpc.php system.listMethods (SE-041 HTTP contract)' "$list_code" 'HTTP 200; exactly the three permitted system methods' "HTTP $list_code; methods=$method_list; $status"
                record xmlrpc-hello 'POST /xmlrpc.php demo.sayHello (SE-041 HTTP contract)' "$hello_code" 'HTTP 200; fault -32601; no Hello!' "HTTP $hello_code; fault=$hello_fault; $status"
                record xmlrpc-pingback 'POST /xmlrpc.php pingback.ping with .invalid URLs (SE-041 HTTP contract)' "$ping_code" 'HTTP 200; fault -32601; no third-party request' "HTTP $ping_code; fault=$ping_fault; $status"
              fi
            fi
            record "$id" "php /repo/$path" 'N/A' 'PASS' "$obtained"
            if [ "$suite" = 'automation-domain-contract' ]; then
              set +e
              contract_diagnostic="$(python3 - "$output" "$err" "$rc" "$RUNNER_TEMP/b4a011-observed.json" <<'PY' 2>"$RUNNER_TEMP/contract-diagnostic-parser.stderr"
          import json, pathlib, re, sys
          output_path, error_path = map(pathlib.Path, sys.argv[1:3])
          exit_code = sys.argv[3]
          observed_path = pathlib.Path(sys.argv[4])
          observed = {}
          try: observed = json.loads(observed_path.read_text())
          except Exception: pass
          detail = ''
          test_name = ''
          try:
              data = json.loads(output_path.read_text())
              results = data.get('results', [])
              failed = next((row for row in results if row.get('test_id') == 'B4A-011' and row.get('status') != 'PASS'), None)
              if failed is None: failed = next((row for row in results if row.get('status') != 'PASS'), None)
              if failed:
                  test_name = str(failed.get('test_id') or 'non mesuré')
                  detail = str(failed.get('detail') or '')
              elif exit_code != '0':
                  test_name = 'non mesuré'
          except Exception:
              test_name = 'non mesuré'
          if not detail and error_path.exists():
              detail = next((line.strip() for line in error_path.read_text(errors='replace').splitlines() if line.strip()), '')
          if any(marker in detail.lower() for marker in ('event_id', 'payload', 'whatsapp_status', 'ci_probe')) or ('{' in detail and '}' in detail): detail = '[request data redacted]'
          detail = re.sub(r'(?i)sha256=[a-f0-9]{64}', 'sha256=[redacted]', detail)
          detail = re.sub(r'(?i)(x-partikulier-(?:automation|signature|timestamp|key-id)\s*[:=]\s*)[^\s,;]+', r'\1[redacted]', detail)
          detail = re.sub(r'(?i)(authorization\s*[:=]\s*bearer\s+)[^\s,;]+', r'\1[redacted]', detail)
          detail = re.sub(r'(?is)\b(?:request body|body|payload|corps de requête|corps)\s*[:=].*', '[request data redacted]', detail)
          detail = re.sub(r'(?is)\{[^{}]*(?:event_id|payload|x-partikulier)[^{}]*\}', '[request data redacted]', detail)
          detail = re.sub(r'\b[A-Za-z0-9+/=_-]{40,}\b', '[redacted-token]', detail)
          detail = re.sub(r'(?<!\w)\+?\d[\d ()-]{7,}\d(?!\w)', '[number redacted]', detail)
          detail = ' '.join(detail.split())[:240] or ('non mesuré — aucune ligne d’erreur structurée' if exit_code != '0' else 'aucun échec signalé')
          test_name = ' '.join(test_name.split())[:80] or 'non mesuré'
          accepted = observed.get('request_accepted')
          accepted_text = str(accepted).lower() if isinstance(accepted, bool) else 'non mesuré'
          audit_present = observed.get('audit_row_present')
          audit_text = str(audit_present).lower() if isinstance(audit_present, bool) else 'non mesuré'
          reason = str(observed.get('last_reason') or 'non mesuré')
          if reason != 'non mesuré' and not re.fullmatch(r'[a-z0-9_-]{1,40}', reason, re.I): reason = 'redacted'
          count = observed.get('failure_count')
          count_text = str(count) if isinstance(count, int) and not isinstance(count, bool) else 'non mesuré'
          print(f'exit={exit_code}; test={test_name}; accepted={accepted_text}; audit_row_present={audit_text}; last_reason={reason}; failure_count={count_text}; error={detail}')
          PY
              )"
              contract_diagnostic_rc=$?
              set -e
              if [ "$contract_diagnostic_rc" -ne 0 ] || [ -z "$contract_diagnostic" ]; then
                contract_diagnostic="exit=$rc; test=non mesuré; accepted=non mesuré; audit_row=non mesuré; last_reason=non mesuré; failure_count=non mesuré; error=non mesuré — diagnostic parser exit=$contract_diagnostic_rc"
              fi
              record contract-automation-diagnostic 'Observe B4A-011 values during unchanged contract execution; publish only safe diagnostics' 'N/A' 'exit code; test; accepted; audit row; last_reason; failure_count; one safe error line' "$contract_diagnostic"
            fi
            if [ "$status" != PASS ] || [ "$rc" -ne 0 ]; then overall=1; fi
            rm -f "$output" "$err"
          done
          rm -f "$RUNNER_TEMP/b4a011-observer.php" "$RUNNER_TEMP/b4a011-observed.json" "$RUNNER_TEMP/contract-diagnostic-parser.stderr"
          touch "$RUNNER_TEMP/contracts-ran"
          if [ "$overall" -ne 0 ]; then exit 1; fi

      - name: Remove ephemeral secret material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/ephemeral-hmac-secret" "$RUNNER_TEMP/n8n-owner.json" "$RUNNER_TEMP/n8n-owner-response.json"

      - name: Lint every PHP file in theme and plugin
        if: always()
        shell: bash
        run: |
          set +e
          find theme/partikulier plugin/partikulier-core -type f -name '*.php' -print0 \
            | sort -z \
            | xargs -0 -n1 php -l > "$RUNNER_TEMP/php-lint.log" 2>&1
          rc=$?
          total=$(find theme/partikulier plugin/partikulier-core -type f -name '*.php' | wc -l | tr -d ' ')
          passed=$(grep -c '^No syntax errors detected in ' "$RUNNER_TEMP/php-lint.log" || true)
          actual="exit=$rc; $passed/$total files linted"
          python3 "$RUNNER_TEMP/evidence.py" "$RUNNER_TEMP/evidence.json" update php-lint 'php -l all PHP files in theme/partikulier and plugin/partikulier-core' 'N/A' 'all files have no syntax errors' "$actual"
          if [ "$rc" -ne 0 ] || [ "$passed" != "$total" ]; then exit 1; fi

      - name: Render markdown evidence artifact
        if: always()
        shell: bash
        run: python3 "$RUNNER_TEMP/evidence.py" "$RUNNER_TEMP/evidence.json" render "$RUNNER_TEMP/ephemeral-n8n-proof.md"

      - name: Publish evidence in the GitHub run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/ephemeral-n8n-proof.md" ]; then
            cat "$RUNNER_TEMP/ephemeral-n8n-proof.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Preuve WordPress/n8n éphémère indisponible — le fichier de preuve n’a pas été généré.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload markdown evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ephemeral-wordpress-n8n-proof
          path: ${{ runner.temp }}/ephemeral-n8n-proof.md
          if-no-files-found: warn
          retention-days: 14
