          if [ "$FAIL" -ne 0 ]; then exit 1; fi

      - name: Bounded load characterization (10 RPS for 30 seconds; disposable only)
        if: steps.integration.outcome == 'success'
        shell: bash
        env:
          WP_CONTAINER: ${{ job.services.wordpress.id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          secret="$(cat "$RUNNER_TEMP/ephemeral-hmac-secret")"
          echo "::add-mask::$secret"
          set +e
          load_result="$(PK_EPHEMERAL_SECRET="$secret" GITHUB_RUN_ID="$GITHUB_RUN_ID" python3 scripts/ephemeral-n8n-load.py --host 127.0.0.1 --port 8080 --rps 10 --duration 30 --p95-budget-ms 1000)"
          load_rc=$?
