          echo $count;
          ')"
          p95_ms="$(python3 -c "import json,sys; print(json.loads(sys.argv[1]).get('p95_ms', 0))" "$load_result")"
          achieved_rps="$(python3 -c "import json,sys; print(json.loads(sys.argv[1]).get('achieved_rps', 0))" "$load_result")"
