              text = re.sub(r'\b[A-Za-z0-9+/=_-]{40,}\b', '[redacted-token]', text)
              text = re.sub(r'(?<!\w)\+?\d[\d ()-]{7,}\d(?!\w)', '[number redacted]', text)
              return ' '.join(text.split())[:240]
          def message(error):
              if isinstance(error, str):
                  try:
                      parsed=json.loads(error)
                      if isinstance(parsed,(dict,list)): return message(parsed)
                  except Exception: pass
                  return error
              if isinstance(error, dict):
                  for key in ('message', 'description', 'cause', 'error', 'err', 'errors'):
                      if key in error:
                          found = message(error[key])
                          if found: return found
                  labels=[str(error[key]) for key in ('name','code','httpCode','statusCode','type') if error.get(key) is not None]
                  return ' '.join(labels)
              if isinstance(error, list):
                  for item in error:
                      found=message(item)
                      if found: return found
              return ''
          structured = []
          error_details = []
          named_lines = []
          generic_lines = []
          decoder = json.JSONDecoder()
          def walk(value, parent=''):
              if isinstance(value, dict):
                  node = value.get('node') or value.get('failedNode') or value.get('nodeName')
                  if isinstance(node, dict): node = node.get('name')
                  if not node and parent and parent not in ('data','resultData','runData','error','execution'): node = parent
                  error = value.get('error') or value.get('lastError') or value.get('err')
                  text = message(error) if error else ''
                  raw_message = value.get('message') or value.get('msg')
                  level = value.get('level')
                  is_error_level = str(level).lower() in ('error','fatal','50','60')
                  if not text and isinstance(raw_message, str) and (is_error_level or re.search(r'\b(error|failed|exception|cannot|could not)\b',raw_message,re.I)):
                      text = raw_message
                  if text and not any(x in text.lower() for x in ('api.n8n.io', 'telemetry', 'diagnostic')):
                      structured.append((str(node or ''), text))
                  for key, child in value.items(): walk(child, str(key))
              elif isinstance(value, list):
                  for child in value: walk(child, parent)
          def collect_error_fields(value, under_error=False):
              if isinstance(value, dict):
                  level=value.get('level')
                  is_error=under_error or str(level).lower() in ('error','fatal','50','60')
                  for key, child in value.items():
                      keylow=str(key).lower()
                      child_error=is_error or keylow in ('error','lasterror','err','cause','exception')
                      if child_error and keylow in ('message','msg','description','name','code','httpcode','statuscode') and isinstance(child,(str,int,float)):
                          safe=clean(child)
                          if safe and safe not in ('[structured request data redacted]','[request data redacted]'):
                              error_details.append((str(value.get('nodeName') or value.get('node') or ''),key+'='+safe))
                      collect_error_fields(child,child_error)
              elif isinstance(value,list):
                  for child in value: collect_error_fields(child,under_error)
          for source in (stdout, stderr):
              for index, char in enumerate(source):
                  if char != '{': continue
                  try: obj, _ = decoder.raw_decode(source[index:])
                  except Exception: continue
                  walk(obj)
                  collect_error_fields(obj)
          combined = stdout + '\n' + stderr
          for line in reversed(combined.splitlines()):
              lowered = line.lower()
              if any(x in lowered for x in ('api.n8n.io', 'telemetry', 'diagnostic', 'an error occurred while importing workflows. see log messages for details')): continue
              match = re.search(r'(?:error in node|failed node|node)\s+[\"\']([^\"\']+)[\"\']\s*[:：-]?\s*(.*)', line, re.I)
              if match: named_lines.append((match.group(1), match.group(2) or line))
              elif re.search(r'\b(error|failed|exception|timed? out|ECONN|HTTP [45]\d\d)\b', line, re.I): generic_lines.append(('', line))
          structured_named = [item for item in structured if item[0]]
          choices = structured_named or named_lines or structured or error_details or generic_lines
          node_name, error_line = choices[-1] if choices else ('', '')
          if not error_line and exit_code != '0':
              safe_lines = []
              for line in stderr.splitlines():
                  lowered = line.lower()
                  if any(x in lowered for x in ('api.n8n.io', 'telemetry', 'diagnostic', 'an error occurred while importing workflows')): continue
                  cleaned = clean(line)
                  if cleaned and cleaned != '[request data redacted]': safe_lines.append(cleaned)
              if not safe_lines:
                  for line in stdout.splitlines():
                      cleaned = clean(line)
                      if cleaned and cleaned != '[request data redacted]': safe_lines.append(cleaned)
              error_line = ' | '.join(safe_lines[-3:])
          node_name = clean(node_name) or 'non mesuré'
          if exit_code == '0': error_line = 'aucune erreur — exécution REST manuelle terminée'
          else: error_line = clean(error_line) or 'non mesuré — aucun message d’erreur exploitable'
          print(f'exit={exit_code}; node={node_name}; error={error_line}')
          PY
          )"
          n8n_diagnostic_rc=$?
          set -e
          if [ "$n8n_diagnostic_rc" -ne 0 ] || [ -z "$n8n_diagnostic" ]; then
            n8n_diagnostic="exit=$n8n_rc; node=non mesuré; error=non mesuré — CLI diagnostic parser exit=$n8n_diagnostic_rc"
          fi
          docker logs "$N8N_CONTAINER" > "$RUNNER_TEMP/n8n-container.log" 2>&1 || true
          service_diagnostic="$(python3 - "$RUNNER_TEMP/n8n-container.log" "$RUNNER_TEMP/ci-n8n-workflow.json" <<'PY'
          import json, pathlib, re, sys
          log_path, workflow_path = map(pathlib.Path, sys.argv[1:3])
          lines = log_path.read_text(errors='replace').splitlines() if log_path.exists() else []
          tokens=[]
          try:
              workflow=json.loads(workflow_path.read_text())
              for node in workflow.get('nodes', []):
                  params=node.get('parameters', {})
                  if isinstance(params.get('body'), str): tokens.append(params['body'])
                  for h in params.get('headerParameters', {}).get('parameters', []):
                      if h.get('name','').lower() in ('x-partikulier-automation','x-partikulier-signature'): tokens.append(str(h.get('value','')))
          except Exception: pass
          def clean(value):
              text=str(value or '')
              for token in sorted((t for t in tokens if t), key=len, reverse=True): text=text.replace(token,'[redacted]')
              text=re.sub(r'(?i)(x-partikulier-(?:automation|signature|timestamp|key-id)\s*[:=]\s*)[^\s,;]+',r'\1[redacted]',text)
              text=re.sub(r'(?i)\b(password|secret|token|credential|authorization|cookie)\b\s*[:=]\s*[^\s,;]+',r'\1=[redacted]',text)
              text=re.sub(r'(?i)sha256=[a-f0-9]{64}','sha256=[redacted]',text)
              text=re.sub(r'\b[A-Za-z0-9+/=_-]{40,}\b','[redacted-token]',text)
              text=re.sub(r'(?<!\w)\+?\d[\d ()-]{7,}\d(?!\w)','[number redacted]',text)
              text=re.sub(r'(?i)(event_id|ci_probe|payload)\s*[:=]\s*(?:"[^"]*"|\'[^\']*\'|[^,;\s}]+)',r'\1=[redacted]',text)
              if any(x in text.lower() for x in ('event_id','payload','ci_probe')):
                  text=re.sub(r'\s*\{.*',' [structured request data redacted]',text)
              return ' '.join(text.split())[:180]
          def messages(obj, under_error=False):
              found=[]
              if isinstance(obj,dict):
                  for key,value in obj.items():
                      keylow=str(key).lower()
                      nested=under_error or keylow in ('error','cause','innererror','lasterror','exception')
                      if isinstance(value,str) and (nested or keylow in ('errormessage','description')):
                          found.append(value)
                      elif isinstance(value,str) and keylow=='message' and re.search(r'error|failed|exception|cannot|could not',value,re.I):
                          found.append(value)
                      elif isinstance(value,(dict,list)): found.extend(messages(value,nested))
              elif isinstance(obj,list):
                  for value in obj: found.extend(messages(value,under_error))
              return found
          selected=[]
          context=set()
          for i,line in enumerate(lines):
              low=line.lower()
              if 'system task run failed' in low:
                  context.update(range(max(0,i-3),min(len(lines),i+5)))
          for i,line in enumerate(lines):
              low=line.lower()
              if 'api.n8n.io' in low or 'telemetry' in low: continue
              level=re.search(r'\|\s*(trace|debug|info|warn|error)\s*\|',line,re.I)
              relevant=bool(level and level.group(1).lower() in ('warn','error'))
              if not level and re.search(r'\b(error|failed|exception|ECONN|HTTP [45]\d\d|cannot|could not)\b',line,re.I): relevant=True
              if i in context and re.match(r'\s*at\s',line,re.I): relevant=True
              if not relevant: continue
              candidates=[]
              try:
                  start=line.find('{')
                  if start >= 0:
                      obj=json.loads(line[start:])
                      candidates=messages(obj)
                      if candidates: candidates.insert(0,line[:start])
              except Exception: pass
              if not candidates: candidates=[line]
              for item in candidates:
                  if 'api.n8n.io' in item.lower() or 'telemetry' in item.lower(): continue
                  safe=clean(item)
                  if safe and safe not in selected: selected.append(safe)
          print(' | '.join(selected[-10:])[:1200] or 'aucune erreur de service n8n hors télémétrie relevée')
          PY
          )"
          n8n_diagnostic="import_exit=$n8n_import_rc; $n8n_diagnostic; service=$service_diagnostic"
          if [ "$n8n_diagnostic_recorded" -eq 0 ]; then
            record n8n-diagnostic 'Parse private n8n REST/manual execution and service output; redact secrets/request data' 'N/A' 'import/manual-run exit codes; failed node; one safe execution and service error summary' "$n8n_diagnostic"
          fi
          fi

          EVENT_ID="$(cat "$RUNNER_TEMP/ci-n8n-event-id")"
          event_actual="$(docker exec -e PK_CI_EVENT_ID="$EVENT_ID" "$WP_CONTAINER" php -r '
          require "/var/www/html/wp-load.php"; global $wpdb;
          $table = $wpdb->prefix . "pk_automation_events";
          $row = $wpdb->get_row($wpdb->prepare("SELECT payload_hash FROM {$table} WHERE event_id = %s", getenv("PK_CI_EVENT_ID")), ARRAY_A);
          echo json_encode(["count" => $row ? 1 : 0, "hash_length" => $row ? strlen((string) $row["payload_hash"]) : 0]);
          ')"
          event_count="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["count"])' "$event_actual")"
