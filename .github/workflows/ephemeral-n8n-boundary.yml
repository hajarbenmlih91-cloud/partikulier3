name: Ephemeral WordPress and n8n boundary

on:
  workflow_dispatch:
    inputs:
      curl_probe:
        description: Run signed curl/replay from the ephemeral n8n container; skip PHP contracts
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  ephemeral-boundary:
    name: Disposable MariaDB + WordPress + n8n
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          MARIADB_DATABASE: partikulier
          MARIADB_USER: partikulier
          MARIADB_PASSWORD: ci-only-wordpress-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      wordpress:
        image: wordpress:6.6-php8.3-apache
        env:
          WORDPRESS_DB_HOST: mariadb:3306
          WORDPRESS_DB_NAME: partikulier
          WORDPRESS_DB_USER: partikulier
          WORDPRESS_DB_PASSWORD: ci-only-wordpress-password
          WORDPRESS_CONFIG_EXTRA: |
            define('WP_HOME', 'http://wordpress');
            define('WP_SITEURL', 'http://wordpress');
            define('DISALLOW_FILE_EDIT', true);
            define('WP_ENVIRONMENT_TYPE', getenv('PK_WP_ENVIRONMENT_TYPE') ?: 'local');
        ports:
          - 8080:80
        volumes:
          - ${{ github.workspace }}:/repo:ro
      n8n:
        image: n8nio/n8n:2.46.6
        env:
          N8N_DIAGNOSTICS_ENABLED: "false"
          N8N_PERSONALIZATION_ENABLED: "false"
          N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
          N8N_TEMPLATES_ENABLED: "false"
          N8N_SECURE_COOKIE: "false"
          N8N_DISABLED_MODULES: mcp-registry
          N8N_LOG_LEVEL: debug
        ports:
          - 5678:5678

    steps:
      - name: Checkout the tested branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP for repository-wide lint
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, dom, mbstring, mysqli, xml

      - name: Prepare private evidence recorder
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/evidence.py" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          rows = [
              ('wordpress', 'GET WordPress disposable /wp-login.php', '200', 'HTTP 200; WordPress responds'),
              ('plugin', 'PHP is_plugin_active(partikulier-core/partikulier-core.php)', 'active', 'Partikulier Core active'),
              ('health', 'GET /wp-json/partikulier/v1/health (anonymous)', '200; status=ok; database=ready; secret absent', 'HTTP 200; sanitized body; no secret bytes'),
              ('deny-automation', 'POST /wp-json/partikulier/v1/automation-event (no auth)', '401', 'HTTP 401'),
              ('deny-qualification', 'POST /wp-json/partikulier/v1/qualification (no auth)', '401', 'HTTP 401'),
              ('deny-erase', 'POST /wp-json/partikulier/v1/erase-lead (no auth)', '401', 'HTTP 401'),
              ('deny-export', 'GET /wp-json/partikulier/v1/export/interests (no admin)', '401', 'HTTP 401'),
              ('deny-status', 'POST /wp-json/partikulier/v1/lead/status (no admin)', '401', 'HTTP 401'),
              ('deny-false-secret', 'POST /wp-json/partikulier/v1/automation-event (wrong shared secret)', '401', 'HTTP 401'),
              ('n8n-owner', 'POST http://127.0.0.1:5678/rest/owner/setup with generated throwaway credentials', 'HTTP 200; owner created locally', 'non mesuré'),
              ('n8n-static', 'Inspect imported n8n workflow HTTP destinations', 'exactly two requests, same WordPress IP:80 endpoint only', 'No other URL; no WhatsApp, Meta, or Evolution node'),
              ('n8n-egress', 'DOCKER-USER egress rule for n8n container', 'allow only WordPress container IP:80; drop all other forwarded destinations', 'Only WordPress job service permitted'),
              ('n8n-first', 'n8n manual workflow execution: first signed POST /automation-event', 'HTTP 200; accepted=true; duplicate=false', 'non mesuré'),
              ('n8n-replay', 'n8n manual workflow execution: exact same signed POST replayed', 'HTTP 200; accepted=true; duplicate=true', 'non mesuré'),
              ('n8n-diagnostic', 'Sanitized n8n manual execution failure diagnostic', 'process exit code; failed node; one redacted error line', 'non mesuré'),
              ('n8n-row', 'Query pk_automation_events for the CI event_id', 'exactly one row; payload_hash is 64 hex chars', 'non mesuré'),
              ('xmlrpc-list', 'POST /xmlrpc.php system.listMethods', 'HTTP 200; exactly system.multicall, system.listMethods, system.getCapabilities', 'non mesuré'),
              ('xmlrpc-hello', 'POST /xmlrpc.php demo.sayHello', 'HTTP 200; XML-RPC fault -32601', 'non mesuré'),
              ('xmlrpc-pingback', 'POST /xmlrpc.php pingback.ping with .invalid URLs', 'HTTP 200; XML-RPC fault -32601; no third-party URL', 'non mesuré'),
              ('contract-automation', 'php plugin/partikulier-core/tests/automation-domain-contract.php in WP service', 'PASS', 'non mesuré'),
              ('contract-automation-runtime', 'php plugin/partikulier-core/tests/automation-runtime-boundary-contract.php in disposable WP service', 'PASS; concurrent idempotency and outbound SSRF/redirect boundaries', 'non mesuré'),
              ('contract-audit-redaction', 'php plugin/partikulier-core/tests/audit-logger-redaction-contract.php in disposable WP service', 'PASS; recursive nested secret-key removal', 'non mesuré'),
              ('contract-input-boundary', 'php plugin/partikulier-core/tests/automation-input-boundary-contract.php in disposable WP service', 'PASS; body above configured HMAC limit returns 413 before persistence', 'non mesuré'),
              ('load-smoke', 'Synthetic 10 RPS for 30 s against disposable WordPress loopback only', '300/300 unique; achieved >= 9.5 RPS; p95 <= 1000 ms; exactly 300 stored rows', 'non mesuré'),
              ('contract-automation-diagnostic', 'Sanitized automation-domain-contract.php failure diagnostic', 'process exit code; failing test; one redacted error line', 'non mesuré'),
              ('contract-erase', 'php plugin/partikulier-core/tests/lead-erase-security-contract.php in WP service', 'PASS', 'non mesuré'),
              ('contract-routes', 'php plugin/partikulier-core/tests/routes-collision.php in WP service', 'PASS', 'non mesuré'),
              ('contract-se022', 'php plugin/partikulier-core/tests/se022-idempotence-contract.php in WP service', 'PASS', 'non mesuré'),
              ('contract-se026', 'php plugin/partikulier-core/tests/se026-hmac-mode-contract.php in WP service', 'PASS', 'non mesuré'),
              ('contract-xmlrpc', 'php theme/partikulier/tests/se041-xmlrpc-contract.php in WP service', 'PASS; listMethods HTTP 200 exact; denied methods fault -32601', 'non mesuré'),
              ('php-lint', 'php -l all PHP files in theme/partikulier and plugin/partikulier-core', 'all files have no syntax errors', 'non mesuré'),
          ]
          operation = sys.argv[2] if len(sys.argv) > 2 else 'init'
          if operation == 'init':
              import os
              data = {
                  'sha': os.environ.get('GITHUB_SHA', 'non mesuré'),
                  'run_id': os.environ.get('GITHUB_RUN_ID', 'non mesuré'),
                  'rows': [dict(id=i, command=c, expected=e, actual=a, http='non mesuré') for i,c,e,a in rows],
              }
              path.write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
          elif operation == 'update':
              _, _, _, row_id, command, http, expected, actual = sys.argv
              data = json.loads(path.read_text(encoding='utf-8'))
              for row in data['rows']:
                  if row['id'] == row_id:
                      row.update(command=command, http=http, expected=expected, actual=actual)
                      break
              else:
                  raise SystemExit('unknown evidence row: ' + row_id)
              path.write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
          elif operation == 'render':
              import os
              data = json.loads(path.read_text(encoding='utf-8'))
              out = pathlib.Path(sys.argv[3])
              safe = lambda value: str(value).replace('|', '\\|').replace(chr(10), ' ')
              lines = [
                  '# Preuve — test n8n / WordPress éphémère', '',
                  f"SHA testé : `{data['sha']}`", f"Run : `{data['run_id']}`", '',
                  'Services Docker temporaires du job : MariaDB, WordPress et n8n. Ils cessent avec le job; ce workflow ne crée pas un hébergement persistant.',
                  'Aucun secret GitHub, secret UAT, identifiant WhatsApp/Meta/Evolution, message WhatsApp, appel staging, navigateur ou test de charge externe n’est utilisé.', '',
                  '| Vérification | Commande lancée | Code HTTP | Résultat attendu | Résultat obtenu |',
                  '|---|---|---:|---|---|',
              ]
              for row in data['rows']:
                  lines.append('| ' + ' | '.join(safe(row[key]) for key in ('id','command','http','expected','actual')) + ' |')
              out.write_text(chr(10).join(lines) + chr(10), encoding='utf-8')
          else:
              raise SystemExit('unknown evidence operation')
          PY
          python3 "$RUNNER_TEMP/evidence.py" "$RUNNER_TEMP/evidence.json" init

      - name: Initialize WordPress, assert boundaries, and execute the n8n replay workflow
        id: integration
        shell: bash
        env:
          WP_CONTAINER: ${{ job.services.wordpress.id }}
          N8N_CONTAINER: ${{ job.services.n8n.id }}
          CURL_PROBE_ONLY: ${{ github.event_name == 'push' || inputs.curl_probe }}
        run: |
          set -euo pipefail
          FAIL=0
          n8n_diagnostic_recorded=0
          WP_BASE='http://127.0.0.1:8080'
          N8N_BASE='http://127.0.0.1:5678'
          WP_CONTAINER_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$WP_CONTAINER")"
          N8N_CONTAINER_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$N8N_CONTAINER")"
          test -n "$WP_CONTAINER_IP"
          test -n "$N8N_CONTAINER_IP"

          record() {
            python3 "$RUNNER_TEMP/evidence.py" "$RUNNER_TEMP/evidence.json" update "$1" "$2" "$3" "$4" "$5"
            case "$1" in
              n8n-owner|n8n-egress|n8n-static|n8n-first|n8n-replay|n8n-row|n8n-diagnostic|load-smoke) printf '::notice title=%s::%s\n' "$1" "$5" ;;
            esac
          }

          # Enforce network-level egress: n8n may reach only this WordPress container on TCP/80.
          if ! sudo iptables -nL DOCKER-USER >/dev/null 2>&1; then
            record n8n-egress 'iptables DOCKER-USER n8n source allowlist' 'N/A' 'allow WP IP:80; drop every other n8n destination' 'non mesuré — DOCKER-USER chain unavailable'
            exit 1
          fi
          sudo iptables -w -I DOCKER-USER 1 -s "$N8N_CONTAINER_IP" -d "$WP_CONTAINER_IP" -p tcp --dport 80 -j ACCEPT
          sudo iptables -w -I DOCKER-USER 2 -s "$N8N_CONTAINER_IP" -j DROP
          sudo iptables -w -C DOCKER-USER -s "$N8N_CONTAINER_IP" -d "$WP_CONTAINER_IP" -p tcp --dport 80 -j ACCEPT
          sudo iptables -w -C DOCKER-USER -s "$N8N_CONTAINER_IP" -j DROP
          record n8n-egress "iptables allow $N8N_CONTAINER_IP -> $WP_CONTAINER_IP:80; drop all other forwarded n8n traffic" 'N/A' 'single permitted recipient: job WordPress' 'PASS; both ordered allow/drop rules verified'

          http_code() {
            local method="$1" url="$2" output="$3"; shift 3
            local code rc
            local -a host_header=()
            if [[ "$url" == "$WP_BASE"/* ]]; then host_header=(-H 'Host: wordpress'); fi
            set +e
            code="$(curl --silent --show-error --max-time 20 -X "$method" "${host_header[@]}" "$@" -o "$output" -w '%{http_code}' "$url")"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then code='000'; fi
            printf '%s' "$code"
          }

          # Wait only for the disposable Docker service. This is not a browser journey.
          WP_READY=0
          for attempt in $(seq 1 90); do
            status="$(http_code GET "$WP_BASE/wp-login.php" "$RUNNER_TEMP/wp-login.html")"
            if [ "$status" = '200' ] || [ "$status" = '302' ]; then WP_READY=1; break; fi
            sleep 2
          done
          if [ "$WP_READY" -ne 1 ]; then
            record wordpress 'GET http://127.0.0.1:8080/wp-login.php' "$status" 'HTTP 200 or 302 from disposable WordPress' 'non mesuré — WordPress service did not become ready'
            exit 1
          fi

          record wordpress 'GET http://127.0.0.1:8080/wp-login.php' "$status" 'HTTP 200 or 302 from disposable WordPress' "HTTP $status; WordPress service ready"

          # Copy only this checkout's plugin and theme into the disposable WordPress service.
          docker exec "$WP_CONTAINER" mkdir -p /var/www/html/wp-content/plugins/partikulier-core /var/www/html/wp-content/themes/partikulier /var/www/html/wp-content/uploads/partikulier-cache
          docker cp plugin/partikulier-core/. "$WP_CONTAINER:/var/www/html/wp-content/plugins/partikulier-core/"
          docker cp theme/partikulier/. "$WP_CONTAINER:/var/www/html/wp-content/themes/partikulier/"

          docker exec -i "$WP_CONTAINER" php <<'PHP'
          <?php
          define('WP_INSTALLING', true);
          require '/var/www/html/wp-load.php';
          require_once ABSPATH . 'wp-admin/includes/upgrade.php';
          require_once ABSPATH . 'wp-admin/includes/plugin.php';
          add_filter('pre_wp_mail', static fn() => true);
          if (!is_blog_installed()) {
              $password = bin2hex(random_bytes(24));
              wp_install('Partikulier disposable CI', 'ci-admin', 'ci-admin@example.invalid', false, '', $password);
          }
          $activation = activate_plugin('partikulier-core/partikulier-core.php');
          if (is_wp_error($activation)) { fwrite(STDERR, "Partikulier Core activation failed\n"); exit(1); }
          switch_theme('partikulier');
          echo "WordPress installed; branch plugin and theme activated\n";
          PHP

          # Readiness and plugin assertion, with no credentials or secret in output.
          WP_ACTIVE="$(docker exec "$WP_CONTAINER" php -r 'require "/var/www/html/wp-load.php"; require_once ABSPATH."wp-admin/includes/plugin.php"; exit(is_plugin_active("partikulier-core/partikulier-core.php") ? 0 : 1);' >/dev/null 2>&1 && echo active || echo inactive)"
          record plugin 'php -r is_plugin_active(partikulier-core/partikulier-core.php)' 'N/A' 'active' "$WP_ACTIVE"
          if [ "$WP_ACTIVE" != active ]; then FAIL=1; fi

          # A job-only random secret; mask it in logs, keep it only in this step and disposable service data.
          EPHEMERAL_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$EPHEMERAL_SECRET"
          export PK_EPHEMERAL_SECRET="$EPHEMERAL_SECRET"
          printf '%s' "$EPHEMERAL_SECRET" > "$RUNNER_TEMP/ephemeral-hmac-secret"
          chmod 600 "$RUNNER_TEMP/ephemeral-hmac-secret"
          # Keep the ephemeral active key on the ID used by B4A-011 so its prior failures share the same hourly audit counter.
          docker exec -e PK_EPHEMERAL_SECRET="$EPHEMERAL_SECRET" "$WP_CONTAINER" php -r '
          require "/var/www/html/wp-load.php";
          update_option("pk_n8n_settings", [
              "automation_api_secret" => getenv("PK_EPHEMERAL_SECRET"),
              "active_key_id" => "N",
              "hmac_mode" => "enforce",
          ], false);
          '

          # Seed only two synthetic prior rows required by the already-versioned automation contract.
          docker exec "$WP_CONTAINER" php -r '
          require "/var/www/html/wp-load.php";
          global $wpdb;
          $audit = new \Partikulier\Core\AuditLogger();
          $rows = (array) $wpdb->get_results($wpdb->prepare("SELECT metadata_json FROM {$wpdb->prefix}pk_audit_log WHERE action = %s", "domain_adopted"));
          $found = false;
          foreach ($rows as $row) { $meta = json_decode((string) $row->metadata_json, true); if (($meta["lot"] ?? "") === "B4" && ($meta["domain"] ?? "") === "automation") { $found = true; break; } }
          if (!$found) $audit->record("domain_adopted", "schema", null, ["lot" => "B4", "domain" => "automation"]);
          $table = $wpdb->prefix . "pk_automation_events";
          $count = (int) $wpdb->get_var("SELECT COUNT(*) FROM {$table}");
          for ($i = $count; $i < 2; $i++) { $now = gmdate("Y-m-d H:i:s"); $id = "ci-historical-event-" . ($i + 1); $wpdb->insert($table, ["event_id" => $id, "event_type" => "fixture", "source" => "ci", "payload_hash" => hash("sha256", $id), "status" => "received", "received_at" => $now], ["%s", "%s", "%s", "%s", "%s", "%s"]); }
          ' >/dev/null
          touch "$RUNNER_TEMP/wp-ready-for-contracts"

          # Public health response must remain sanitized even though a random secret now exists in the job-local DB.
          health_code="$(http_code GET "$WP_BASE/wp-json/partikulier/v1/health" "$RUNNER_TEMP/health.json")"
          health_actual="HTTP $health_code; sanitized health body"
          health_ok=0
          if [ "$health_code" = 200 ] && PK_EPHEMERAL_SECRET="$EPHEMERAL_SECRET" python3 - "$RUNNER_TEMP/health.json" <<'PY'
          import json, os, pathlib, sys
          body = pathlib.Path(sys.argv[1]).read_text()
          data = json.loads(body)
          secret = os.environ['PK_EPHEMERAL_SECRET']
          assert secret not in body
          assert data.get('status') == 'ok' and data.get('database') == 'ready'
          PY
          then health_ok=1; health_actual='HTTP 200; status=ok; database=ready; no secret bytes'
          else FAIL=1; health_actual="HTTP $health_code; invalid/unavailable sanitized health result"; fi
          record health 'GET /wp-json/partikulier/v1/health (anonymous)' "$health_code" '200; status=ok; database=ready; secret absent' "$health_actual"

          check_unauthorized() {
            local id="$1" method="$2" path="$3" data="${4:-}"; local code
            if [ "$method" = GET ]; then
              code="$(http_code GET "$WP_BASE$path" "$RUNNER_TEMP/$id.json")"
            else
              code="$(http_code POST "$WP_BASE$path" "$RUNNER_TEMP/$id.json" -H 'Content-Type: application/json' --data "$data")"
            fi
            record "$id" "$method $path" "$code" '401' "HTTP $code"
            if [ "$code" != 401 ]; then FAIL=1; fi
          }
          check_unauthorized deny-automation POST /wp-json/partikulier/v1/automation-event '{}'
          check_unauthorized deny-qualification POST /wp-json/partikulier/v1/qualification '{}'
          check_unauthorized deny-erase POST /wp-json/partikulier/v1/erase-lead '{}'
          check_unauthorized deny-export GET /wp-json/partikulier/v1/export/interests
          check_unauthorized deny-status POST /wp-json/partikulier/v1/lead/status '{}'

          false_code="$(http_code POST "$WP_BASE/wp-json/partikulier/v1/automation-event" "$RUNNER_TEMP/false-secret.json" -H 'Content-Type: application/json' -H 'X-Partikulier-Automation: definitely-not-the-job-secret' --data '{}')"
          record deny-false-secret 'POST /wp-json/partikulier/v1/automation-event (wrong shared secret)' "$false_code" '401' "HTTP $false_code"
          if [ "$false_code" != 401 ]; then FAIL=1; fi

          # Owner setup is local to this n8n service and uses a random throwaway password; no external credentials are configured.
          for attempt in $(seq 1 60); do
            n8n_code="$(http_code GET "$N8N_BASE/healthz" "$RUNNER_TEMP/n8n-health.txt")"
            if [ "$n8n_code" = 200 ]; then break; fi
            sleep 2
          done
          if [ "$n8n_code" != 200 ]; then
            record n8n-owner 'POST http://127.0.0.1:5678/rest/owner/setup' "$n8n_code" 'HTTP 200; throwaway local owner created' 'non mesuré — n8n service not ready'
            exit 1
          fi
          N8N_OWNER_PASSWORD="Ci-$(openssl rand -hex 24)!9A"
          echo "::add-mask::$N8N_OWNER_PASSWORD"
          N8N_OWNER_PASSWORD="$N8N_OWNER_PASSWORD" python3 - <<'PY' > "$RUNNER_TEMP/n8n-owner.json"
          import json, os
          print(json.dumps({"email":"ci-owner@example.invalid","firstName":"CI","lastName":"Ephemeral","password":os.environ["N8N_OWNER_PASSWORD"]}))
          PY
          owner_code="$(http_code POST "$N8N_BASE/rest/owner/setup" "$RUNNER_TEMP/n8n-owner-response.json" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/n8n-owner.json")"
          record n8n-owner 'POST http://127.0.0.1:5678/rest/owner/setup' "$owner_code" 'HTTP 200; throwaway local owner created' "HTTP $owner_code; response body suppressed"
          if [ "$owner_code" != 200 ]; then FAIL=1; exit 1; fi

          # Sign one deterministic, non-personal test event with the generated secret.
          # The imported n8n workflow has exactly two HTTP Request nodes, both pinned to this WordPress service.
          PK_EPHEMERAL_SECRET="$EPHEMERAL_SECRET" WP_SERVICE_IP="$WP_CONTAINER_IP" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" python3 - <<'PY'
          import base64, hashlib, hmac, json, os, pathlib, uuid
          secret = os.environ['PK_EPHEMERAL_SECRET']
          wp_ip = os.environ['WP_SERVICE_IP']
          run_id = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          event_id = f'n8n-ci-{run_id}-{attempt}'
          body = json.dumps({"event_id":event_id,"event_type":"whatsapp_status","source":"n8n","payload":{"ci_probe":True,"run_id":run_id}}, separators=(',', ':'), ensure_ascii=False)
          timestamp = str(int(__import__('time').time()))
          key = base64.b64decode(secret, validate=True)
          canonical = f'POST\n/partikulier/v1/automation-event\n{timestamp}\n{body}'.encode()
          signature = 'sha256=' + hmac.new(key, canonical, hashlib.sha256).hexdigest()
          # Mirror the ephemeral active key ID written into WordPress above.
          headers = [
            {"name":"Content-Type","value":"application/json"},
            {"name":"Host","value":"wordpress"},
            {"name":"X-Partikulier-Automation","value":secret},
            {"name":"X-Partikulier-Timestamp","value":timestamp},
            {"name":"X-Partikulier-Key-Id","value":"N"},
            {"name":"X-Partikulier-Signature","value":signature},
          ]
          common = {
            "method":"POST",
            "url":f'http://{wp_ip}/wp-json/partikulier/v1/automation-event',
            "sendHeaders":True,
            "headerParameters":{"parameters":headers},
            "sendBody":True,
            "contentType":"raw",
            "rawContentType":"application/json",
            "body":body,
            "options":{"response":{"response":{"fullResponse":True,"responseFormat":"json"}}},
          }
          node_id = lambda: str(uuid.uuid4())
          manual_id, first_id, replay_id = (node_id() for _ in range(3))
          workflow_id = str(uuid.uuid4())
          workflow = {
            "id":workflow_id,
            "name":"Disposable WordPress signed event and idempotent replay",
            "active":False,
            "nodes":[
              {"id":manual_id,"name":"Manual Trigger","type":"n8n-nodes-base.manualTrigger","typeVersion":1,"position":[240,300],"parameters":{}},
              {"id":first_id,"name":"First signed POST","type":"n8n-nodes-base.httpRequest","typeVersion":4.2,"position":[480,300],"parameters":common},
              {"id":replay_id,"name":"Exact replay","type":"n8n-nodes-base.httpRequest","typeVersion":4.2,"position":[720,300],"parameters":common},
            ],
            "connections":{
              "Manual Trigger":{"main":[[{"node":"First signed POST","type":"main","index":0}]]},
              "First signed POST":{"main":[[{"node":"Exact replay","type":"main","index":0}]]},
            },
            "settings":{"executionOrder":"v1"},
            "staticData":None,
            "pinData":{},
            "tags":[],
          }
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-n8n-workflow.json'
          target.write_text(json.dumps(workflow, separators=(',', ':')), encoding='utf-8')
          target.chmod(0o600)
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-n8n-workflow-id').write_text(workflow_id)
