          actual="exit=$load_rc; scheduled=$scheduled; achieved=${achieved_rps} RPS; p95=${p95_ms} ms; database rows=$row_count"
          if [ "$load_rc" -eq 0 ] && [ "$row_count" = 300 ]; then actual="PASS; 10 RPS target; achieved=${achieved_rps} RPS; 300/300 unique accepted; p95=${p95_ms} ms; database rows=$row_count"; fi
          python3 "$RUNNER_TEMP/evidence.py" "$RUNNER_TEMP/evidence.json" update load-smoke 'scripts/ephemeral-n8n-load.py --host 127.0.0.1 --port 8080 --rps 10 --duration 30' 'N/A' '300/300 unique; achieved >= 9.5 RPS; p95 <= 1000 ms; exactly 300 stored rows' "$actual"
