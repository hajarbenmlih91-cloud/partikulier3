name: Analyser le rapport d'audit UAT

on:
  workflow_call:
    inputs:
      run_id:
        description: Identifiant du run UAT public à analyser (aucun nouvel appel au site)
        required: true
        type: string
      connected_run_id:
        description: Identifiant optionnel du run protégé (HMAC et parcours connecté)
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

jobs:
  summarize:
    name: Extraire les constats détaillés de l'artefact existant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Valider le run et retrouver son artefact
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          CONNECTED_RUN_ID: ${{ inputs.connected_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'run_id doit être numérique' >&2; exit 2; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          run_number="$(python -c 'import json,sys; print(json.load(sys.stdin)["run_number"])' <<<"$run_json")"
          run_sha="$(python -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<<"$run_json")"
          run_branch="$(python -c 'import json,sys; print(json.load(sys.stdin)["head_branch"])' <<<"$run_json")"
          [[ "$run_branch" == 'arena/0e605e79-partikulier3' ]] || { echo "Run branch refusée: $run_branch" >&2; exit 2; }
          artifact="audit-uat-public-$run_number"
          echo "run_number=$run_number" >> "$GITHUB_OUTPUT"
          echo "run_sha=$run_sha" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "Run $RUN_ID · $artifact · commit $run_sha"
          if [ -n "$CONNECTED_RUN_ID" ]; then
            [[ "$CONNECTED_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'connected_run_id doit être numérique' >&2; exit 2; }
            connected_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONNECTED_RUN_ID")"
            connected_number="$(python -c 'import json,sys; print(json.load(sys.stdin)["run_number"])' <<<"$connected_json")"
            connected_sha="$(python -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<<"$connected_json")"
            connected_branch="$(python -c 'import json,sys; print(json.load(sys.stdin)["head_branch"])' <<<"$connected_json")"
            [[ "$connected_branch" == 'arena/0e605e79-partikulier3' ]] || { echo "Connected run branch refusée: $connected_branch" >&2; exit 2; }
            echo "connected_number=$connected_number" >> "$GITHUB_OUTPUT"
            echo "connected_sha=$connected_sha" >> "$GITHUB_OUTPUT"
            echo "connected_artifact=audit-uat-$connected_number" >> "$GITHUB_OUTPUT"
            echo "Connected run $CONNECTED_RUN_ID · audit-uat-$connected_number · commit $connected_sha"
          fi

      - name: Télécharger l'artefact public déjà produit
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: uat-audit-source

      - name: Télécharger l'artefact authentifié existant
        if: ${{ inputs.connected_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.meta.outputs.connected_artifact }}
          run-id: ${{ inputs.connected_run_id }}
          github-token: ${{ github.token }}
          path: uat-audit-source-connected

      - name: Résumer échecs, avertissements, métriques et captures
        id: report
        env:
          SOURCE_DIR: uat-audit-source
          CONNECTED_DIR: uat-audit-source-connected
          REPORT_RUN_ID: ${{ inputs.run_id }}
          REPORT_SHA: ${{ steps.meta.outputs.run_sha }}
          CONNECTED_RUN_ID: ${{ inputs.connected_run_id }}
          CONNECTED_SHA: ${{ steps.meta.outputs.connected_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['SOURCE_DIR'])
          lines = [
              '# Analyse détaillée de l’audit UAT', '',
              f"Run public source : {os.environ['REPORT_RUN_ID']}",
              f"Commit testé : `{os.environ['REPORT_SHA']}`", '',
              'Cette analyse lit uniquement les artefacts existants; elle ne fait aucun appel au staging.', ''
          ]
          if os.environ.get('CONNECTED_RUN_ID'):
              lines += [f"Run connecté source : {os.environ['CONNECTED_RUN_ID']}", f"Commit connecté testé : `{os.environ.get('CONNECTED_SHA', '')}`", '']
          annotations = []

          def annotate(level, title, message):
              msg = str(message).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              title = str(title).replace('%', '%25').replace('\r', '%0D').replace('\n', ' ')
              annotations.append(f'::{level} title={title}::{msg}')

          # Résultats des scripts PHP live : KO/ATT/SAUTÉS avec verbatim concis.
          for filename, label in [('security.txt', 'Sécurité live'), ('cache-ttfb.txt', 'Cache/TTFB'), ('auth-boundary.txt', 'Frontière auth')]:
              p = root / filename
              if not p.exists():
                  continue
              lines.extend([f'## {label}', ''])
              matches = [x.strip() for x in p.read_text(errors='replace').splitlines() if re.match(r'^\s*(KO|ATT|SAUTÉ|FAIL|WARN|SKIPPED)\b', x, re.I)]
              if matches:
                  for item in matches:
                      if re.match(r'^KO\b', item, re.I) and 'HTTP 404' in item and ('tests/' in item or 'sonde' in item):
                          note = f'FAUX POSITIF DU TEST — {item}; HTTP 404 signifie que la ressource est introuvable/non servie, résultat sûr. Corriger l’assertion pour accepter 404.'
                          lines.append(f'- **NOTE (test à corriger)** {note}')
                          annotate('notice', '404 sûr — assertion à corriger', note)
                      elif re.match(r'^KO\b', item, re.I) and 'GET /?pk_diag=1' in item and 'HTTP 302' in item:
                          note = f'INCONCLUSIF — {item}; la sonde n’a pas suivi la redirection de localisation. Vérifier la destination finale avant de conclure.'
                          lines.append(f'- **À vérifier** {note}')
                          annotate('warning', 'Diagnostic redirigé', note)
                      else:
                          lines.append(f'- {item}')
                          level = 'error' if re.match(r'^(KO|FAIL)\b', item, re.I) else 'warning'
                          annotate(level, label, item)
              else:
                  lines.append('Aucune ligne KO/ATT/SAUTÉ trouvée; consulter le log brut ci-dessous.')
              lines.append('')

          # Browser/SEO/a11y/XSS: conserver les IDs et détails, pas seulement le statut global.
          p = root / 'browser-audit.json'
          if p.exists():
              data = json.loads(p.read_text())
              failed = [r for r in data.get('results', []) if r.get('status') == 'FAIL']
              lines += ['## Chromium, responsive, SEO, Axe, JavaScript et XSS', '',
                        f"Statut : **{data.get('status')}** · {data.get('total_checks')} contrôles · {data.get('failed_checks')} échec(s) enregistrés.", '']
              for row in failed:
                  detail = f"{row.get('category')} — {row.get('check')}: {row.get('detail')}"
                  lines.append(f'- **{row.get("severity", "error").upper()}** {detail}')
                  annotate('error' if row.get('severity') == 'error' else 'warning', row.get('check', 'Browser finding'), detail)
              if not failed: lines.append('Aucun contrôle browser en statut FAIL.')
              lines.append('')

          # Interactions, captures et Web Vitals de laboratoire.
          p = root / 'interaction-web-vitals.json'
          if p.exists():
              data = json.loads(p.read_text())
              lines += ['## Interactions JavaScript et Web Vitals', '',
                        f"Statut fonctionnel : **{data.get('status')}** · INP lab proxy max : **{data.get('interaction_inp_lab_max_ms') if data.get('interaction_inp_lab_max_ms') is not None else 'n/a'} ms**.", '',
                        '| Écran | Largeur | LCP lab (ms) | CLS lab |', '|---|---:|---:|---:|']
              for m in data.get('metrics', []):
                  lcp = m.get('lcp_ms') if m.get('lcp_ms') is not None else 'n/a'
                  cls = m.get('cls') if m.get('cls') is not None else 'n/a'
                  lines.append(f"| {m.get('label')} | {m.get('width')} | {lcp} | {cls} |")
                  nav = m.get('navigation') or {}
                  metric_note = f"{m.get('label')}: LCP={lcp} ms, CLS={cls}, TTFB navigateur={round(nav.get('ttfb', 0)) if nav.get('ttfb') else 'n/a'} ms, DCL={round(nav.get('domContentLoaded', 0)) if nav.get('domContentLoaded') else 'n/a'} ms"
                  annotate('notice', f"Web Vitals {m.get('label')}", metric_note)
              inp = data.get('interaction_inp_lab_max_ms')
              if inp is not None: annotate('notice', 'INP laboratoire proxy', f"Max PerformanceEventTiming sur interactions simulées: {inp} ms; ne pas assimiler à l’INP p98 terrain.")
              lines += ['', '### Interactions testées', '']
              for item in data.get('checks', []):
                  if item.get('category') == 'interaction':
                      text = f"{item.get('status')} — {item.get('check')}: {item.get('detail')}"
                      lines.append(f'- {text}')
                      if item.get('status') == 'FAIL': annotate('error', item.get('check', 'Interaction'), item.get('detail', ''))
              lines += ['', '**Interprétation :** LCP/CLS sont des mesures de laboratoire. L’INP de ce script est le maximum des durées `PerformanceEventTiming` des interactions simulées; ce n’est pas le p98 terrain CrUX/RUM.', '']

          # Lighthouse JSON, y compris scores et Core Web Vitals disponibles.
          p = root / 'lighthouse-summary.md'
          if p.exists():
              lighthouse_text = p.read_text(errors='replace')
              lines += ['## Lighthouse', '', lighthouse_text, '']
              for row in lighthouse_text.splitlines():
                  if row.startswith('| ') and any(label in row for label in ['fr-home-', 'en-home-', 'ar-home-', 'fr-listings-']):
                      annotate('notice', 'Lighthouse metrics', row)
          else:
              json_files = sorted(root.glob('lighthouse-*.json'))
              if json_files:
                  lines += ['## Lighthouse', '', '| Page | Perf | A11y | Best practices | SEO | LCP ms | INP ms | CLS | TBT ms |', '|---|---:|---:|---:|---:|---:|---:|---:|---:|']
                  for f in json_files:
                      data = json.loads(f.read_text()); cats = data.get('categories', {}); audits = data.get('audits', {})
                      def score(k): return round((cats.get(k, {}).get('score') or 0) * 100)
                      def metric(*keys):
                          for k in keys:
                              v = audits.get(k, {}).get('numericValue')
                              if v is not None: return round(v)
                          return 'n/a'
                      row = f"| {f.stem} | {score('performance')} | {score('accessibility')} | {score('best-practices')} | {score('seo')} | {metric('largest-contentful-paint')} | {metric('interaction-to-next-paint', 'experimental-interaction-to-next-paint')} | {metric('cumulative-layout-shift')} | {metric('total-blocking-time')} |"
                      lines.append(row)
                      annotate('notice', f'Lighthouse {f.stem}', row)
                  lines.append('')

          # Findings from the protected run: HMAC checks and the temporary-owner journey.
          connected_root = pathlib.Path(os.environ.get('CONNECTED_DIR', ''))
          if os.environ.get('CONNECTED_RUN_ID') and connected_root.is_dir():
              lines += ['## Résultats du run connecté protégé', '',
                        'Les lignes ci-dessous viennent de l’artefact connecté déjà existant; aucun parcours ni appel réseau n’a été relancé.', '']
              for filename, label in [('security.txt', 'Sécurité/HMAC connectée'), ('cache-ttfb.txt', 'Cache/TTFB connecté'), ('load-smoke.txt', 'Charge smoke'), ('load-full.txt', 'Charge complète')]:
                  f = connected_root / filename
                  if not f.exists():
                      continue
                  lines += [f'### {label}', '']
                  selected = [x.strip() for x in f.read_text(errors='replace').splitlines() if re.match(r'^\s*(OK|KO|ATT|SAUTÉ|FAIL|WARN|SKIPPED)\b', x, re.I)]
                  if not selected:
                      lines.append('Aucune ligne de résultat structurée trouvée; consulter le fichier brut de l’artefact.')
                  for item in selected:
                      if re.match(r'^KO\b', item, re.I) and 'HTTP 404' in item and ('tests/' in item or 'sonde' in item):
                          note = f'FAUX POSITIF DU TEST — {item}; HTTP 404 signifie que la ressource est introuvable/non servie, résultat sûr. Corriger l’assertion pour accepter 404.'
                          lines.append(f'- **NOTE (test à corriger)** {note}')
                          annotate('notice', '404 sûr — assertion à corriger', note)
                      elif re.match(r'^KO\b', item, re.I) and 'GET /?pk_diag=1' in item and 'HTTP 302' in item:
                          note = f'INCONCLUSIF — {item}; la sonde n’a pas suivi la redirection de localisation. Vérifier la destination finale avant de conclure.'
                          lines.append(f'- **À vérifier** {note}')
                          annotate('warning', 'Diagnostic redirigé', note)
                      else:
                          lines.append(f'- {item}')
                          if re.match(r'^(KO|FAIL)\b', item, re.I): annotate('error', label, item)
                          elif re.match(r'^(ATT|WARN|SAUTÉ|SKIPPED)\b', item, re.I): annotate('warning', label, item)
                          else: annotate('notice', label, item)
                  lines.append('')

              owner_file = connected_root / 'owner-journey.json'
              if owner_file.exists():
                  owner = json.loads(owner_file.read_text())
                  lines += ['### Parcours du compte propriétaire temporaire', '', f"Statut global : **{owner.get('status', 'inconnu')}** · {owner.get('authentication', 'information absente')}", '']
                  for item in owner.get('checks', []):
                      detail = f"{item.get('name')}: {item.get('detail', '')}"
                      lines.append(f"- **{item.get('status', 'inconnu')}** {detail}")
                      if item.get('status') == 'FAIL': annotate('error', item.get('name', 'Parcours propriétaire'), detail)
                  if not owner.get('checks'): lines.append('Aucun détail de contrôle dans owner-journey.json.')
                  lines.append('')
              elif (connected_root / 'owner-journey.txt').exists():
                  owner_text = (connected_root / 'owner-journey.txt').read_text(errors='replace')
                  lines += ['### Parcours du compte propriétaire temporaire', '', owner_text, '']

              connected_vitals = connected_root / 'interaction-web-vitals.json'
              if connected_vitals.exists():
                  vitals = json.loads(connected_vitals.read_text())
                  lines += ['### Web Vitals/interactions du run connecté', '',
                            f"INP laboratoire proxy max : **{vitals.get('interaction_inp_lab_max_ms', 'n/a')} ms**.", '',
                            '| Écran | Largeur | LCP lab (ms) | CLS lab |', '|---|---:|---:|---:|']
                  for m in vitals.get('metrics', []):
                      lcp = m.get('lcp_ms') if m.get('lcp_ms') is not None else 'n/a'
                      cls = m.get('cls') if m.get('cls') is not None else 'n/a'
                      lines.append(f"| {m.get('label')} | {m.get('width')} | {lcp} | {cls} |")
                      annotate('notice', f"Web Vitals connectés {m.get('label')}", f"LCP lab={lcp} ms, CLS={cls}")
                  for item in vitals.get('checks', []):
                      if item.get('category') == 'interaction' and item.get('status') == 'FAIL':
                          detail = f"{item.get('check')}: {item.get('detail')}"
                          lines.append(f'- **FAIL** {detail}')
                          annotate('error', item.get('check', 'Interaction connectée'), detail)
                  lines.append('')

              connected_lh = connected_root / 'lighthouse-summary.md'
              if connected_lh.exists():
                  lines += ['### Lighthouse du run connecté', '', connected_lh.read_text(errors='replace'), '']
                  for row in connected_lh.read_text(errors='replace').splitlines():
                      if row.startswith('| ') and any(label in row for label in ['fr-home-', 'en-home-', 'ar-home-', 'fr-listings-']):
                          annotate('notice', 'Lighthouse connecté', row)

          # Mobile screenshots shipped with the public and (when supplied) protected artifact.
          shots = []
          for source, prefix in [(root, 'public'), (connected_root, 'connecté')]:
              folder = source / 'screenshots'
              if folder.exists(): shots.extend((f, prefix) for f in sorted(folder.glob('*.png')))
          lines += ['## Captures', '']
          lines.extend(f'- `{prefix}/{f.name}` ({f.stat().st_size:,} octets)' for f, prefix in shots)
          if not shots: lines.append('Aucune capture trouvée dans les artefacts.')
          lines.append('')

          out = pathlib.Path('audit-uat-analysis.md')
          out.write_text('\n'.join(lines) + '\n')
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n')
          print('\n'.join(annotations[:45]))
          print(f"Analyse produite : {out}; {len(shots)} captures trouvées.")
          PY

      - name: Publier l'analyse détaillée
        uses: actions/upload-artifact@v4
        with:
          name: audit-uat-analysis-${{ inputs.run_id }}
          path: audit-uat-analysis.md
          if-no-files-found: error
          retention-days: 14
