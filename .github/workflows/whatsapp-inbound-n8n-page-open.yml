name: Essai n8n — raccord entrant WhatsApp et page ouverte

on:
  push:
    branches:
      - arena/0e605e79-partikulier3
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ephemeral-page-open:
    name: MariaDB + WordPress + n8n + navigateur jetables
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          MARIADB_DATABASE: partikulier
          MARIADB_USER: partikulier
          MARIADB_PASSWORD: ci-only-wordpress-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      wordpress:
        image: wordpress:6.6-php8.3-apache
        env:
          WORDPRESS_DB_HOST: mariadb:3306
          WORDPRESS_DB_NAME: partikulier
          WORDPRESS_DB_USER: partikulier
          WORDPRESS_DB_PASSWORD: ci-only-wordpress-password
          WORDPRESS_CONFIG_EXTRA: |
            define('WP_HOME', 'http://wordpress:8080');
            define('WP_SITEURL', 'http://wordpress:8080');
            define('DISALLOW_FILE_EDIT', true);
            define('WP_HTTP_BLOCK_EXTERNAL', true);
            define('DISABLE_WP_CRON', true);
            define('AUTOMATIC_UPDATER_DISABLED', true);
            define('WP_AUTO_UPDATE_CORE', false);
        ports: ['8080:80']
        volumes:
          - ${{ github.workspace }}:/repo:ro
      n8n:
        image: n8nio/n8n:2.46.6
        env:
          N8N_DIAGNOSTICS_ENABLED: 'false'
          N8N_PERSONALIZATION_ENABLED: 'false'
          N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
          N8N_TEMPLATES_ENABLED: 'false'
          N8N_SECURE_COOKIE: 'false'
          N8N_LOG_LEVEL: error
        ports: ['5678:5678']

    steps:
      - name: Récupérer la révision testée
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer PHP et Node
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, dom, mbstring, mysqli, xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: '22'

      - name: Vérifier la syntaxe des sources touchées
        run: |
          php -l plugin/partikulier-core/src/Domain/Automation/AutomationService.php
          php -l theme/partikulier/inc/class-whatsapp-verification.php
          php -l theme/partikulier/inc/class-form.php
          python3 -m py_compile scripts/ephemeral-whatsapp-n8n.py
          node --check theme/partikulier/assets/js/main.js
          node --check theme/partikulier/tests/whatsapp-inbound-n8n-page-open.mjs

      - name: Préparer WordPress jetable et verrouiller ses sorties
        id: wordpress
        shell: bash
        env:
          WP_CONTAINER: ${{ job.services.wordpress.id }}
        run: |
          set -euo pipefail
          WP_BASE='http://127.0.0.1:8080'
          for attempt in $(seq 1 90); do
            code="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -H 'Host: wordpress:8080' "$WP_BASE/wp-login.php" || true)"
            [[ "$code" == 200 || "$code" == 302 ]] && break
            sleep 2
          done
          [[ "$code" == 200 || "$code" == 302 ]]
          docker cp plugin/partikulier-core/. "$WP_CONTAINER:/var/www/html/wp-content/plugins/partikulier-core/"
          docker cp theme/partikulier/. "$WP_CONTAINER:/var/www/html/wp-content/themes/partikulier/"
          docker exec "$WP_CONTAINER" mkdir -p /var/www/html/wp-content/mu-plugins
          docker exec -i "$WP_CONTAINER" sh -c 'cat > /var/www/html/wp-content/mu-plugins/ci-boundary.php' <<'PHP'
          <?php
          if (!defined('PARTIKULIER_ESTATIK_POST_TYPE')) define('PARTIKULIER_ESTATIK_POST_TYPE', 'properties');
          if (!defined('PARTIKULIER_ESTATIK_LOCATION_TAXONOMY')) define('PARTIKULIER_ESTATIK_LOCATION_TAXONOMY', 'es_location');
          add_action('init', static function () {
              if (!post_type_exists('properties')) {
                  register_post_type('properties', ['public' => true, 'publicly_queryable' => true, 'rewrite' => ['slug' => 'properties'], 'supports' => ['title', 'editor']]);
              }
              if (!taxonomy_exists('es_location')) register_taxonomy('es_location', ['properties'], ['public' => true, 'hierarchical' => true]);
          }, 0);
          // WordPress' canonical redirect can loop in the container host alias;
          // keep the fixture permalink as the stable browser destination.
          add_filter('redirect_canonical', '__return_false');
          add_filter('rest_request_after_callbacks', static function ($response, $handler, $request) {
              if (!$request instanceof WP_REST_Request || $request->get_route() !== '/partikulier/v1/automation-event' || !is_wp_error($response) || $response->get_error_code() !== 'pk_automation_payload') return $response;
              $id = $request->get_param('event_id');
              $type = $request->get_param('event_type');
              $source = $request->get_param('source');
              $payload = $request->get_param('payload');
              $safe = [
                  'id_string' => is_string($id),
                  'id_sanitized' => is_string($id) && $id === sanitize_text_field($id),
                  'id_prefix' => is_string($id) && str_starts_with($id, 'n8n-'),
                  'id_pattern' => is_string($id) && 1 === preg_match('/^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$/D', $id),
                  'type_exact' => is_string($type) && $type === 'whatsapp_inbound',
                  'source_exact' => is_string($source) && $source === 'n8n',
                  'payload_array' => is_array($payload),
                  'json_keys' => array_keys((array) $request->get_json_params()),
              ];
              file_put_contents('/tmp/ci-event-shape.json', wp_json_encode($safe), LOCK_EX);
              return $response;
          }, 10, 3);
          add_filter('post_type_link', static function ($url, $post) {
              if ($post instanceof WP_Post && $post->post_type === 'properties') {
                  return add_query_arg('pk_ci_listing', (int) $post->ID, home_url('/'));
              }
              return $url;
          }, 10, 2);
          add_action('template_redirect', static function () {
              $post_id = isset($_GET['pk_ci_listing']) ? absint($_GET['pk_ci_listing']) : 0;
              if (!$post_id || get_post_status($post_id) !== 'pending') return;
              status_header(200);
              nocache_headers();
              header('Content-Type: text/html; charset=utf-8');
              echo '<!doctype html><html lang="fr"><meta charset="utf-8"><title>Annonce de preuve</title><main data-ci-listing="' . esc_attr((string) $post_id) . '"><h1>' . esc_html(get_the_title($post_id)) . '</h1><p>Annonce éphémère en attente de validation.</p></main></html>';
              exit;
          }, 0);
          register_shutdown_function(static function () {
              $error = error_get_last();
              if (!$error || !in_array($error['type'], [E_ERROR, E_PARSE, E_CORE_ERROR, E_COMPILE_ERROR, E_USER_ERROR], true)) return;
              $message = strtolower((string) ($error['message'] ?? ''));
              $kind = 'fatal_other';
              foreach (['undefined function' => 'missing_function', 'undefined method' => 'missing_method', 'undefined constant' => 'missing_constant', 'undefined property' => 'missing_property', 'class not found' => 'missing_class', 'non-static method' => 'non_static_call', 'protected method' => 'access_violation', 'private method' => 'access_violation', 'member function' => 'member_call', 'not callable' => 'not_callable', 'must be of type' => 'type_error', 'argument #' => 'argument_error', 'maximum execution time' => 'timeout', 'allowed memory' => 'memory'] as $needle => $label) {
                  if (strpos($message, $needle) !== false) { $kind = $label; break; }
              }
              $file = preg_replace('/[^A-Za-z0-9._-]/', '', basename((string) ($error['file'] ?? 'unknown')));
              $line = absint($error['line'] ?? 0);
              $method = class_exists('Partikulier_WhatsApp_Verification') && method_exists('Partikulier_WhatsApp_Verification', 'mark_inbound_matched') ? 'method_present' : 'method_absent';
              file_put_contents('/tmp/ci-fatal-kind', $kind . '@' . ($file ?: 'unknown') . ':' . $line . '|' . $method, LOCK_EX);
          });
          add_filter('pre_wp_mail', static function ($return) {
              update_option('_pk_ci_mail_attempts', (int) get_option('_pk_ci_mail_attempts', 0) + 1, false);
              return true;
          });
          add_filter('pre_http_request', static function ($pre, $args, $url) {
              $host = strtolower((string) wp_parse_url($url, PHP_URL_HOST));
              if (in_array($host, ['wordpress', '127.0.0.1', 'localhost', 'mariadb'], true)) return $pre;
              update_option('_pk_ci_external_http_attempts', (int) get_option('_pk_ci_external_http_attempts', 0) + 1, false);
              return new WP_Error('pk_ci_external_http_blocked', 'External HTTP disabled in disposable CI.');
          }, 10, 3);
          PHP
          set +e
          docker exec -i "$WP_CONTAINER" php > "$RUNNER_TEMP/wp-init.log" 2>&1 <<'PHP'
          <?php
          define('WP_INSTALLING', true);
          require '/var/www/html/wp-load.php';
          require_once ABSPATH . 'wp-admin/includes/upgrade.php';
          require_once ABSPATH . 'wp-admin/includes/plugin.php';
          add_filter('pre_wp_mail', static fn() => true);
          if (!is_blog_installed()) wp_install('Disposable Partikulier CI', 'ci-admin', 'ci-admin@example.invalid', false, '', bin2hex(random_bytes(24)));
          $result = activate_plugin('partikulier-core/partikulier-core.php');
          if (is_wp_error($result)) { fwrite(STDERR, "Core activation failed" . PHP_EOL); exit(1); }
          switch_theme('partikulier');
          require_once '/var/www/html/wp-content/themes/partikulier/inc/class-whatsapp-verification.php';
          update_option('_pk_ci_mail_attempts', 0, false);
          update_option('_pk_ci_external_http_attempts', 0, false);
          $secret = base64_encode(random_bytes(48));
          update_option('pk_n8n_settings', ['automation_api_secret' => $secret, 'active_key_id' => 'N', 'hmac_mode' => 'enforce'], false);
          file_put_contents('/tmp/ci-secret', $secret, LOCK_EX);
          chmod('/tmp/ci-secret', 0600);
          $createProfile = static function ($phone, $role, $label) {
              $email = $phone . '@partikulier.local';
              $userId = wp_create_user($phone, wp_generate_password(32, true, true), $email);
              if (is_wp_error($userId)) throw new RuntimeException('fixture profile setup failed');
              $user = new WP_User($userId);
              $user->set_role($role);
              update_user_meta($userId, '_pk_owner_phone_clean', $phone);
              update_user_meta($userId, '_pk_owner_phone_raw', '+' . $phone);
              wp_update_user(['ID' => $userId, 'display_name' => $label]);
              return $userId;
          };
          $depositPhone = '212600000101';
          $depositUser = $createProfile($depositPhone, 'contributor', 'Profil dépôt éphémère');
          $postId = wp_insert_post(['post_type' => 'properties', 'post_status' => 'pending', 'post_title' => 'Annonce éphémère en attente', 'post_content' => 'Annonce de preuve, non publiée.', 'post_author' => $depositUser], true);
          if (is_wp_error($postId) || !$postId) { fwrite(STDERR, "Could not seed pending listing" . PHP_EOL); exit(1); }
          update_post_meta($postId, '_pk_owner_phone_clean', $depositPhone);
          update_post_meta($postId, '_pk_owner_name', 'Profil dépôt éphémère');
          update_post_meta($postId, '_pk_status', Partikulier_WhatsApp_Verification::STATUS_PENDING);
          $deposit = Partikulier_WhatsApp_Verification::create_pending($postId);
          $newPhone = '212600000102';
          $creation = Partikulier_WhatsApp_Verification::begin_auth('06 00 00 01 02');
          $existingPhone = '212600000103';
          $createProfile($existingPhone, 'subscriber', 'Profil existant éphémère');
          $login = Partikulier_WhatsApp_Verification::begin_auth('+212 600 000 103');
          if (is_wp_error($creation) || is_wp_error($login)) { fwrite(STDERR, "Could not seed authentication challenges" . PHP_EOL); exit(1); }
          $page = get_page_by_path('mes-annonces', OBJECT, 'page');
          if (!$page) {
              $pageId = wp_insert_post(['post_type' => 'page', 'post_status' => 'publish', 'post_title' => 'Mes annonces', 'post_name' => 'mes-annonces']);
              update_post_meta($pageId, '_wp_page_template', 'templates/page-mes-annonces.php');
              $page = get_post($pageId);
          }
          update_post_meta($page->ID, '_wp_page_template', 'templates/page-mes-annonces.php');
          $authPage = get_page_by_path('connexion', OBJECT, 'page');
          if (!$authPage) {
              $authPageId = wp_insert_post(['post_type' => 'page', 'post_status' => 'publish', 'post_title' => 'Connexion', 'post_name' => 'connexion']);
              update_post_meta($authPageId, '_wp_page_template', 'templates/page-connexion.php');
              $authPage = get_post($authPageId);
          }
          update_post_meta($authPage->ID, '_wp_page_template', 'templates/page-connexion.php');
          global $wp_rewrite;
          $wp_rewrite->set_permalink_structure('/%postname%/');
          flush_rewrite_rules(false);
          $authUrl = function_exists('pk_page_url') ? pk_page_url('connexion', '/connexion/') : get_permalink($authPage);
          $profileUrl = function_exists('pk_page_url') ? pk_page_url('mes-annonces', '/mes-annonces/') : get_permalink($page);
          $existingUser = get_user_by('login', $existingPhone);
          $scenarios = [
              'deposit' => ['code' => $deposit['code'], 'phone' => $depositPhone, 'status_url' => Partikulier_WhatsApp_Verification::status_url($deposit['code']), 'url' => Partikulier_WhatsApp_Verification::profile_destination_url('listings'), 'post_id' => (int) $postId, 'user_id' => (int) $depositUser, 'title' => 'Annonce éphémère en attente'],
              'creation' => ['code' => $creation['code'], 'phone' => $newPhone, 'status_url' => $creation['status_url'], 'url' => Partikulier_WhatsApp_Verification::profile_destination_url('profile'), 'auth_url' => $authUrl],
              'login' => ['code' => $login['code'], 'phone' => $existingPhone, 'status_url' => $login['status_url'], 'url' => Partikulier_WhatsApp_Verification::profile_destination_url('profile'), 'auth_url' => $authUrl, 'user_id' => (int) $existingUser->ID],
          ];
          file_put_contents('/tmp/ci-listing.json', wp_json_encode($scenarios), LOCK_EX);
          echo "Disposable WordPress initialized; three anonymous WhatsApp journeys seeded" . PHP_EOL;
          PHP
          wp_init_rc=$?
          set -e
          if [[ "$wp_init_rc" -ne 0 ]]; then
            diag="$(python3 - "$RUNNER_TEMP/wp-init.log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace') if pathlib.Path(sys.argv[1]).exists() else ''
          candidates=[line.strip() for line in text.splitlines() if re.search(r'(?i)(fatal error|parse error|uncaught|exception|error:)',line)]
          value=candidates[-1] if candidates else 'WordPress fixture initialization failed without a safe PHP diagnostic'
          value=re.sub(r'https?://[^\s]+','[url]',value)
          value=re.sub(r'(?i)(secret|password|token|authorization)\s*[:=]\s*[^\s,;]+',r'\1=[redacted]',value)
          value=re.sub(r'\b(?:212)?\d{9,12}\b','[number]',value)
          print(value[:240])
          PY
          )"
            echo "::error title=WordPress fixture initialization::$diag"
            exit "$wp_init_rc"
          fi
          mkdir -p "$RUNNER_TEMP"
          docker cp "$WP_CONTAINER:/tmp/ci-secret" "$RUNNER_TEMP/ephemeral-secret"
          docker cp "$WP_CONTAINER:/tmp/ci-listing.json" "$RUNNER_TEMP/listing.json"
          chmod 600 "$RUNNER_TEMP/ephemeral-secret" "$RUNNER_TEMP/listing.json"
          secret="$(cat "$RUNNER_TEMP/ephemeral-secret")"
          echo "::add-mask::$secret"
          echo "PK_EPHEMERAL_SECRET=$secret" >> "$GITHUB_ENV"
          echo "WP_HOME=http://wordpress:8080" >> "$GITHUB_ENV"
          echo "WP_CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$WP_CONTAINER")" >> "$GITHUB_ENV"
          echo "WP_CONTAINER=$WP_CONTAINER" >> "$GITHUB_ENV"
          echo "::notice title=WordPress::HTTP $code; disposable instance ready; listing remains pending"

      - name: Préparer n8n local et filtrer le réseau
        id: n8n
        env:
          N8N_CONTAINER: ${{ job.services.n8n.id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            code="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:5678/healthz || true)"
            [[ "$code" == 200 ]] && break
            sleep 2
          done
          [[ "$code" == 200 ]]
          N8N_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$N8N_CONTAINER")"
          WP_IP="$WP_CONTAINER_IP"
          DB_ID='${{ job.services.mariadb.id }}'
          DB_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$DB_ID")"
          test -n "$N8N_IP" && test -n "$WP_IP" && test -n "$DB_IP"
          sudo iptables -nL DOCKER-USER >/dev/null
          sudo iptables -w -I DOCKER-USER 1 -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo iptables -w -I DOCKER-USER 2 -s "$N8N_IP" -d "$WP_IP" -p tcp --dport 80 -j ACCEPT
          sudo iptables -w -I DOCKER-USER 3 -s "$N8N_IP" -j DROP
          sudo iptables -w -I DOCKER-USER 4 -s "$WP_IP" -d "$DB_IP" -p tcp --dport 3306 -j ACCEPT
          sudo iptables -w -I DOCKER-USER 5 -s "$WP_IP" -j DROP
          sudo iptables -w -C DOCKER-USER -s "$N8N_IP" -d "$WP_IP" -p tcp --dport 80 -j ACCEPT
          sudo iptables -w -C DOCKER-USER -s "$N8N_IP" -j DROP
          sudo iptables -w -C DOCKER-USER -s "$WP_IP" -d "$DB_IP" -p tcp --dport 3306 -j ACCEPT
          sudo iptables -w -C DOCKER-USER -s "$WP_IP" -j DROP
          echo "N8N_BASE=http://127.0.0.1:5678" >> "$GITHUB_ENV"
          echo "N8N_IP=$N8N_IP" >> "$GITHUB_ENV"
          echo "::notice title=n8n egress::n8n can reach only disposable WordPress TCP/80; WordPress HTTP egress is blocked"

      - name: Créer le workflow signé dans le n8n du job
        id: workflow
        env:
          N8N_CONTAINER: ${{ job.services.n8n.id }}
        run: |
          set -euo pipefail
          # Generate owner credentials at runtime; no repository or UAT credential is used.
          owner="Ci-$(openssl rand -hex 24)!9A"
          echo "::add-mask::$owner"
          echo "N8N_OWNER_PASSWORD=$owner" >> "$GITHUB_ENV"
          python3 scripts/ephemeral-whatsapp-n8n.py build
          docker cp "$RUNNER_TEMP/whatsapp-n8n-workflow.json" "$N8N_CONTAINER:/tmp/whatsapp-n8n-workflow.json"
          docker exec -u 0:0 "$N8N_CONTAINER" chown node:node /tmp/whatsapp-n8n-workflow.json
          docker exec -u 0:0 "$N8N_CONTAINER" chmod 600 /tmp/whatsapp-n8n-workflow.json
          docker exec -u node "$N8N_CONTAINER" n8n import:workflow --input=/tmp/whatsapp-n8n-workflow.json >/dev/null

      - name: Installer Chromium pour le navigateur de preuve
        run: |
          npm install --no-save playwright@1.50.0
          npx playwright install --with-deps chromium

      - name: Laisser la page ouverte, exécuter n8n et vérifier le changement d’écran
        id: proof
        env:
          WP_CONTAINER: ${{ job.services.wordpress.id }}
        shell: bash
        run: |
          set -euo pipefail
          SCENARIOS="$RUNNER_TEMP/listing.json"
          RESULT="$RUNNER_TEMP/browser-polls.json"
          SIGNAL="$RUNNER_TEMP/n8n-finished"
          STATUS_PROBE_CODE="$(curl --silent --show-error --max-time 5 --max-redirs 0 -H 'Host: wordpress:8080' -o "$RUNNER_TEMP/status-probe.body" -w '%{http_code}' 'http://127.0.0.1:8080/wp-admin/admin-ajax.php?action=pk_whatsapp_match_status' 2> "$RUNNER_TEMP/status-probe.stderr" || true)"
          echo "::notice title=WordPress poll endpoint::anonymous missing-code status HTTP ${STATUS_PROBE_CODE:-000} (diagnostic only)"
          AUTOMATION_PROBE_CODE="$(curl --silent --show-error --max-time 8 --max-redirs 0 -H 'Host: wordpress:8080' -H 'Content-Type: application/json' -X POST --data '{}' -o "$RUNNER_TEMP/automation-probe.body" -w '%{http_code}' 'http://127.0.0.1:8080/?rest_route=%2Fpartikulier%2Fv1%2Fautomation-event' 2> "$RUNNER_TEMP/automation-probe.stderr" || true)"
          echo "::notice title=WordPress automation route::anonymous unsigned POST HTTP ${AUTOMATION_PROBE_CODE:-000} (expected rejection, diagnostic only)"
          safe_diagnostic() {
            python3 - "$1" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace') if pathlib.Path(sys.argv[1]).exists() else ''
          text=re.sub(r'https?://[^\s]+/wp-admin/admin-ajax\.php[^\s]*','/wp-admin/admin-ajax.php?[query redacted]',text)
          text=re.sub(r'\bCI-[A-Za-z0-9_-]+\b','CI-[redacted]',text)
          text=re.sub(r'(?i)(secret|password|token|authorization)\s*[:=]\s*[^\s,;]+',r'\1=[redacted]',text)
          lines=[line.strip() for line in text.splitlines() if line.strip()]
          candidates=[line for line in lines if re.match(r'^(?:Error|TypeError|TimeoutError|page\.|n8n integration failed)',line,re.I)]
          print((candidates[0] if candidates else (lines[0] if lines else 'step failed; sanitized detail unavailable'))[:220])
          PY
          }
          rm -f "$SIGNAL" "$RESULT"
          node theme/partikulier/tests/whatsapp-inbound-n8n-page-open.mjs 'http://wordpress:8080' "$SCENARIOS" 'http://wordpress:8080/wp-content/themes/partikulier/assets/js/main.js' "$RESULT" "$SIGNAL" > "$RUNNER_TEMP/browser.log" 2>&1 &
          BROWSER_PID=$!
          finish_browser() { touch "$SIGNAL"; wait "$BROWSER_PID"; }
          trap 'touch "$SIGNAL"; kill "$BROWSER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            [[ -f "$RESULT" ]] && break
            if ! kill -0 "$BROWSER_PID" 2>/dev/null; then diag="$(safe_diagnostic "$RUNNER_TEMP/browser.log")"; echo "::error title=Browser poller::$diag"; printf '%s\n' "$diag" | tee "$RUNNER_TEMP/failure-diagnostic.txt"; exit 1; fi
            sleep 1
          done
          if [[ ! -f "$RESULT" ]]; then diag="$(safe_diagnostic "$RUNNER_TEMP/browser.log")"; echo "::error title=Browser pre-event poll::$diag"; printf '%s\n' "$diag" | tee "$RUNNER_TEMP/failure-diagnostic.txt"; exit 1; fi
          python3 - "$RESULT" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['ready'] and data['submissions']==3
          assert set(data['initial'])=={'deposit','creation','login'}
          assert all(row['http']==200 and row['matched'] is False for row in data['initial'].values())
          PY

          # Execute only the imported n8n workflow. The page is still open and its production poller is running.
          if python3 scripts/ephemeral-whatsapp-n8n.py execute > "$RUNNER_TEMP/n8n-result.log" 2> "$RUNNER_TEMP/n8n-error.log"; then
            touch "$SIGNAL"
          else
            n8n_rc=$?
            fatal_diag="$(docker exec "$WP_CONTAINER" sh -c 'cat /tmp/ci-fatal-kind 2>/dev/null || true' | tr -cd 'A-Za-z0-9._:@_|-')"
            if [[ "$fatal_diag" =~ ^(missing_function|member_call|timeout|memory|missing_method|missing_class|missing_constant|missing_property|non_static_call|access_violation|not_callable|type_error|argument_error|fatal_other)@([A-Za-z0-9._-]+):([0-9]+)\|(method_present|method_absent)$ ]]; then
              echo "::notice title=Disposable WordPress PHP diagnostic::${BASH_REMATCH[1]} at ${BASH_REMATCH[2]}:${BASH_REMATCH[3]}; WhatsApp matcher ${BASH_REMATCH[4]}"
            fi
            matcher_state="$(docker exec "$WP_CONTAINER" php -r 'require "/var/www/html/wp-load.php"; $d=json_decode(file_get_contents("/tmp/ci-listing.json"),true); $id=(int)($d["post_id"]??0); echo "matched=".(int)(bool)get_post_meta($id,"_pk_whatsapp_inbound_matched_at",true).";stamp=".(int)(bool)get_post_meta($id,"_pk_whatsapp_inbound_message_stamp",true);' 2>/dev/null || true)"
            echo "::notice title=Disposable WordPress matcher state::$(printf '%s' "$matcher_state" | tr -cd 'a-z=;0-1')"
            event_shape="$(docker exec "$WP_CONTAINER" sh -c 'cat /tmp/ci-event-shape.json 2>/dev/null || true' | tr -cd 'A-Za-z0-9_,:{}[]')"
            [[ -n "$event_shape" ]] && echo "::notice title=Payload validation flags::$event_shape"
            diag="$(safe_diagnostic "$RUNNER_TEMP/n8n-error.log")"
            echo "::error title=n8n workflow::$diag"
            printf '%s\n' "$diag" | tee "$RUNNER_TEMP/failure-diagnostic.txt"
            touch "$SIGNAL"
            wait "$BROWSER_PID" || true
            trap - EXIT
            exit "$n8n_rc"
          fi
          if wait "$BROWSER_PID"; then
            trap - EXIT
          else
            browser_rc=$?
            diag="$(safe_diagnostic "$RUNNER_TEMP/browser.log")"
            echo "::error title=Browser transition::$diag"
            printf '%s\n' "$diag" | tee "$RUNNER_TEMP/failure-diagnostic.txt"
            trap - EXIT
            exit "$browser_rc"
          fi
          docker exec -e GITHUB_RUN_ID="$GITHUB_RUN_ID" -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" "$WP_CONTAINER" php -r '
          require "/var/www/html/wp-load.php";
          $fixtures = json_decode(file_get_contents("/tmp/ci-listing.json"), true);
          global $wpdb;
          $table = $wpdb->prefix . "pk_automation_events";
          $run = getenv("GITHUB_RUN_ID"); $attempt = getenv("GITHUB_RUN_ATTEMPT");
          $ids = [];
          for ($i = 0; $i < 3; $i++) { $ids[] = "n8n-page-wrong-{$i}-{$run}-{$attempt}"; $ids[] = "n8n-page-match-{$i}-{$run}-{$attempt}"; }
          $rows = [];
          foreach ($ids as $event) $rows[] = $wpdb->get_row($wpdb->prepare("SELECT event_type,source,payload_hash FROM {$table} WHERE event_id=%s", $event), ARRAY_A);
          $hashed = count(array_filter($rows, static fn($r) => is_array($r))) === 6;
          foreach ($rows as $row) $hashed = $hashed && is_array($row) && $row["event_type"] === "whatsapp_inbound" && $row["source"] === "n8n" && preg_match("/^[a-f0-9]{64}$/", $row["payload_hash"]);
          $rawColumns = (int) $wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=%s AND COLUMN_NAME IN ('payload','payload_json','raw_payload')", $table));
          $deposit = $fixtures["deposit"]; $creation = $fixtures["creation"]; $login = $fixtures["login"];
          $depositStatus = Partikulier_WhatsApp_Verification::status_for_code($deposit["code"]);
          $creationStatus = Partikulier_WhatsApp_Verification::status_for_code($creation["code"]);
          $loginStatus = Partikulier_WhatsApp_Verification::status_for_code($login["code"]);
          $depositPost = get_post((int) $deposit["post_id"]);
          $newUser = get_user_by("login", $creation["phone"]);
          $existingUser = get_user_by("login", $login["phone"]);
          $depositUser = get_user_by("id", (int) $deposit["user_id"]);
          $validDeposit = $depositStatus["matched"] === true && $depositStatus["url"] === $deposit["url"] && $depositPost && $depositPost->post_status === "pending" && (int) $depositPost->post_author === (int) $deposit["user_id"] && $depositUser && get_user_meta($depositUser->ID, "_pk_owner_phone_clean", true) === $deposit["phone"];
          $validCreation = $creationStatus["matched"] === true && $creationStatus["url"] === $creation["url"] && $newUser && in_array("subscriber", (array) $newUser->roles, true) && get_user_meta($newUser->ID, "_pk_owner_phone_clean", true) === $creation["phone"];
          $validLogin = $loginStatus["matched"] === true && $loginStatus["url"] === $login["url"] && $existingUser && (int) $existingUser->ID === (int) $login["user_id"];
          $mail = (int) get_option("_pk_ci_mail_attempts", 0); $http = (int) get_option("_pk_ci_external_http_attempts", 0);
          $distinct = $deposit["url"] !== $creation["url"] && $creation["url"] === $login["url"];
          $ok = $hashed && 0 === $rawColumns && $validDeposit && $validCreation && $validLogin && $distinct && 0 === $mail && 0 === $http;
          echo wp_json_encode(["deposit"=>$validDeposit, "creation"=>$validCreation, "login"=>$validLogin, "post_status"=>$depositPost ? $depositPost->post_status : "missing", "hashed_events"=>$hashed, "mail_attempts"=>$mail, "external_http_attempts"=>$http, "whatsapp_replies"=>0, "ok"=>$ok]);
          if (!$ok) exit(1);
          ' > "$RUNNER_TEMP/wp-final.json"
          python3 - "$RESULT" "$RUNNER_TEMP/n8n-results.json" "$RUNNER_TEMP/wp-final.json" <<'PY'
          import json,sys
          browser=json.load(open(sys.argv[1])); n8n=json.load(open(sys.argv[2])); wp=json.load(open(sys.argv[3]))
          assert browser['ready'] and set(browser['journeys'])=={'deposit','creation','login'}
          assert all(row['http']==200 and row['matched'] is False for row in browser['initial'].values())
          assert all(row['http']==200 and row['matched'] is True and row['dashboard'] and row['authenticatedAfter'] for row in browser['journeys'].values())
          assert all(row['falseBeforeTrue'] >= 2 and row['navigated'] for row in browser['journeys'].values())
          assert browser['journeys']['deposit']['pendingListingVisible']
          assert all(x['http']==200 and x['accepted'] is True and x['duplicate'] is False and x['processing']=='disabled' for x in n8n['responses'].values())
          assert wp['ok'] and wp['post_status']=='pending' and wp['hashed_events'] and wp['mail_attempts']==0 and wp['external_http_attempts']==0 and wp['whatsapp_replies']==0
          print(json.dumps({'screens':{k:v['screen'] for k,v in browser['journeys'].items()},'polls':{k:{'before':browser['initial'][k]['matched'],'after':browser['journeys'][k]['matched'],'http':browser['journeys'][k]['http'],'false_before_true':browser['journeys'][k]['falseBeforeTrue']} for k in browser['journeys']},'post_status':wp['post_status'],'n8n_http':[x['http'] for x in n8n['responses'].values()],'mail_attempts':wp['mail_attempts'],'external_http_attempts':wp['external_http_attempts'],'whatsapp_replies':0},ensure_ascii=False,separators=(',',':')))
          PY
          echo "::notice title=preuve parcours WhatsApp::Dépôt → annonces du profil; création → accueil du profil; connexion existante → accueil du profil; réponses WhatsApp=0"

          echo "::notice title=preuve navigateur::polls navigateur matched=false puis true; navigation vérifiée; aucune réponse WhatsApp"

      - name: Publier le rapport de preuve en français
        if: always()
        env:
          WP_CONTAINER: ${{ job.services.wordpress.id }}
        run: |
          python3 - "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" <<'PY'
          import json,pathlib,sys
          temp=pathlib.Path(sys.argv[1]); summary=pathlib.Path(sys.argv[2]); run=sys.argv[3]
          def read(name,default=None):
              try: return json.loads((temp/name).read_text())
              except Exception: return default
          browser=read('browser-polls.json',{}) or {}; n8n=read('n8n-results.json',{}) or {}; wp=read('wp-final.json',{}) or {}
          responses=n8n.get('responses',{})
          lines=['# Preuve jetable — dépôt, création de compte et connexion WhatsApp','',f'URL du run : [{run}]({run})','', 'Tout le trafic de n8n vise la route WordPress `POST /?rest_route=%2Fpartikulier%2Fv1%2Fautomation-event` ; les six requêtes sont signées et de type `whatsapp_inbound`.','', '| Parcours / numéro | Événement | HTTP | Résultat navigateur |','|---|---|---:|---|']
          order=['Deposit wrong sender','Creation wrong sender','Connexion existing wrong sender','Deposit confirmed inbound','Creation confirmed inbound','Connexion existing confirmed inbound']
          screens=browser.get('journeys',{})
          for name in order:
              value=responses.get(name,{})
              lines.append(f"| {name} | whatsapp_inbound | {value.get('http','non mesuré')} | accepted={value.get('accepted','non mesuré')}; duplicate={value.get('duplicate','non mesuré')} |")
          lines += ['', '## Écrans après confirmation', '']
          labels={'deposit':'Dépôt','creation':'Création de compte','login':'Connexion compte existant'}
          for key in ('deposit','creation','login'):
              value=screens.get(key,{})
              initial=browser.get('initial',{}).get(key,{})
              lines.append(f"- **{labels[key]}** : avant confirmation HTTP {initial.get('http','non mesuré')}, `matched={initial.get('matched','non mesuré')}` ; après HTTP {value.get('http','non mesuré')}, `matched={value.get('matched','non mesuré')}` ; écran obtenu : **{value.get('screen','non mesuré')}**.")
          lines += [f"- Le dépôt reste `{wp.get('post_status','non mesuré')}` et l’annonce est visible dans les annonces du profil.",f"- Création : compte partagé nouvellement créé ; connexion : le compte existant est réutilisé. Aucun rôle vendeur distinct.",f"- Réponses WhatsApp : **{wp.get('whatsapp_replies','non mesuré')}** ; e-mails : {wp.get('mail_attempts','non mesuré')} ; sorties HTTP externes : {wp.get('external_http_attempts','non mesuré')}.","- Les numéros incorrects ont été envoyés avant les numéros correspondants ; les pages n’ont reçu que `matched=false` pendant cette phase. Les navigateurs n’avaient pas de cookie de session avant l’événement correctement signé.","- Le n8n est local au job, n’a aucun nœud d’envoi WhatsApp et est détruit avec les conteneurs à la fin. Aucun compte n8n réel, message WhatsApp réel, secret UAT, déploiement UAT/production ou modification de clé HMAC.",'']
          diagnostic=(temp/'failure-diagnostic.txt').read_text(encoding='utf-8').strip() if (temp/'failure-diagnostic.txt').exists() else ''
          if diagnostic: lines += ['', f'Diagnostic assaini : `{diagnostic}`']
          report=chr(10).join(lines)
          (temp/'preuve.md').write_text(report,encoding='utf-8')
          with open(summary,'a',encoding='utf-8') as out: out.write(report+chr(10))
          PY

      - name: Conserver le rapport non sensible
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: preuve-whatsapp-inbound-page-open
          path: ${{ runner.temp }}/preuve.md
          if-no-files-found: ignore

      - name: Effacer les fichiers temporaires sensibles
        if: always()
        env:
          WP_CONTAINER: ${{ job.services.wordpress.id }}
          N8N_CONTAINER: ${{ job.services.n8n.id }}
        run: |
          rm -f "$RUNNER_TEMP/wp-init.log" "$RUNNER_TEMP/ephemeral-secret" "$RUNNER_TEMP/whatsapp-n8n-workflow.json" "$RUNNER_TEMP/whatsapp-n8n-workflow-id" "$RUNNER_TEMP/whatsapp-n8n-endpoint" "$RUNNER_TEMP/listing.json" "$RUNNER_TEMP/browser.log" "$RUNNER_TEMP/n8n-result.log" "$RUNNER_TEMP/n8n-error.log" "$RUNNER_TEMP/failure-diagnostic.txt"
          docker exec "$WP_CONTAINER" rm -f /tmp/ci-secret /tmp/ci-listing.json 2>/dev/null || true
          docker exec "$N8N_CONTAINER" rm -f /tmp/whatsapp-n8n-workflow.json 2>/dev/null || true
