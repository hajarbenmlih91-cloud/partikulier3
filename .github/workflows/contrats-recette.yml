          # des suites (le serveur HTTP du job l'hérite de l'extension).
          # Le dossier de configuration de PHP appartient a root sur les runners GitHub :
          # une redirection simple echoue (« Permission denied »). `sudo tee` est la voie
          # standard (les runners heberges ont sudo sans mot de passe). Le fichier reste
          # dans le dossier scanne par PHP : le serveur HTTP du job en herite aussi.
          echo 'apc.enable_cli=1' | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-dp9-apcu.ini" >/dev/null
