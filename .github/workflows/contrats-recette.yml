name: Contrats de recette (WordPress)

on:
  push:
    branches: [main, fix/v1-preprod-corrections]
  pull_request:
  workflow_dispatch:

env:
  PK_VERSION: '2.10.10'

permissions:
  contents: read

jobs:
  contrats:
    name: contrats WordPress / PHP 8.3
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: partikulier
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --protocol=tcp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, sqlite3, curl, apcu
      - name: Préparer l'évidence de setup non sensible
        run: mkdir -p "$RUNNER_TEMP/recipe-setup-evidence"
      - name: Charger et valider le verrou des dépendances recette
        run: |
          set -euo pipefail
          python3 - .github/recipe-dependencies.lock.json "$GITHUB_ENV" <<'PY'
          import json, pathlib, re, sys
          lock_path, env_path = map(pathlib.Path, sys.argv[1:])
          lock = json.loads(lock_path.read_text())
          if lock.get('lock_version') != 1:
              raise SystemExit('Unsupported recipe dependency lock version')
          rows = [
              ('WP_CORE_VERSION', lock['wordpress_core']['version'], r'\d+\.\d+\.\d+'),
              ('WP_CORE_SHA256', lock['wordpress_core']['archive_sha256'], r'[0-9a-f]{64}'),
              ('ESTATIK_VERSION', lock['estatik']['version'], r'[0-9A-Za-z.+_-]+'),
              ('ESTATIK_SHA256', lock['estatik']['archive_sha256'], r'[0-9a-f]{64}'),
          ]
          if lock['wordpress_core']['archive_url'] != 'https://downloads.wordpress.org/release/wordpress-' + lock['wordpress_core']['version'] + '.zip':
              raise SystemExit('WordPress archive URL does not match the pinned version')
          if lock['estatik']['slug'] != 'estatik' or lock['estatik']['download_source'] != 'WordPress.org plugin information API exact-version archive':
              raise SystemExit('Estatik lock must use the WordPress.org exact-version archive source')
          with env_path.open('a') as out:
              for key, value, pattern in rows:
                  if not re.fullmatch(pattern, str(value)):
                      raise SystemExit('Invalid lock value: ' + key)
                  out.write(f'{key}={value}\n')
          print('Loaded pinned WordPress and Estatik versions/checksums.')
          PY
      - name: Installer WP-CLI
        run: |
          set -euo pipefail
          bash .github/scripts/recipe-setup-command.sh wp-cli-download -- \
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --retry-delay 2 --retry-max-time 90 --connect-timeout 10 --max-time 180 \
              https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar \
              --output /usr/local/bin/wp
          chmod +x /usr/local/bin/wp
          bash .github/scripts/recipe-setup-command.sh wp-cli-version -- wp --info
      - name: Télécharger WordPress (version et SHA-256 du verrou)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wordpress-${WP_CORE_VERSION}.zip"
          bash .github/scripts/recipe-setup-command.sh wordpress-core-download -- \
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --retry-delay 2 --retry-max-time 120 --connect-timeout 10 --max-time 240 \
              "https://downloads.wordpress.org/release/wordpress-${WP_CORE_VERSION}.zip" \
              --output "$archive"
          printf '%s  %s\n' "$WP_CORE_SHA256" "$archive" > "$RUNNER_TEMP/wordpress-core.sha256"
          bash .github/scripts/recipe-setup-command.sh wordpress-core-archive-sha256 -- \
            sha256sum --check "$RUNNER_TEMP/wordpress-core.sha256"
          python3 - "$RUNNER_TEMP/recipe-setup-evidence/wordpress-core-lock.json" \
            "$WP_CORE_VERSION" "$WP_CORE_SHA256" <<'PY'
          import json, pathlib, sys
          path, version, sha = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
              'version': version, 'archive_sha256': sha, 'verified': True,
              'verification': 'pinned SHA-256 plus wp core verify-checksums',
          }, indent=2) + '\n')
          PY
      - name: Extraire et vérifier les checksums officiels WordPress
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wordpress-${WP_CORE_VERSION}.zip"
          unpack="$RUNNER_TEMP/wordpress-core-unpack"
          mkdir -p "$unpack" wp
          bash .github/scripts/recipe-setup-command.sh wordpress-core-unpack -- \
            unzip -q -o "$archive" -d "$unpack"
          bash .github/scripts/recipe-setup-command.sh wordpress-core-copy -- \
            rsync -a --delete "$unpack/wordpress/" wp/
          bash .github/scripts/recipe-setup-command.sh wordpress-core-checksum -- \
            wp core verify-checksums --version="$WP_CORE_VERSION" --locale=en_US --path=wp
      - name: Créer wp-config.php pour la base jetable
        env:
          WP_DB_NAME: partikulier
          WP_DB_USER: root
          WP_DB_PASSWORD: root
          WP_DB_HOST: 127.0.0.1:3306
        run: |
          set -euo pipefail
          bash .github/scripts/recipe-setup-command.sh wordpress-config -- \
            wp config create --path=wp --dbname="$WP_DB_NAME" --dbuser="$WP_DB_USER" \
              --dbpass="$WP_DB_PASSWORD" --dbhost="$WP_DB_HOST" --skip-check
          bash .github/scripts/recipe-setup-command.sh wordpress-config-env -- \
            wp config set WP_ENVIRONMENT_TYPE local --path=wp
      - name: Installer WordPress sur la base jetable
        run: |
          set -euo pipefail
          bash .github/scripts/recipe-setup-command.sh wordpress-core-install -- \
            wp core install --path=wp --url=http://127.0.0.1:8099 --title=Partikulier \
              --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
      - name: Résoudre puis vérifier l'archive exacte d'Estatik
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/estatik-plugin-info.json"
          archive="$RUNNER_TEMP/recipe-setup-estatik.zip"
          url_file="$RUNNER_TEMP/estatik-download-url"
          bash .github/scripts/recipe-setup-command.sh estatik-metadata-download -- \
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --retry-delay 2 --retry-max-time 90 --connect-timeout 10 --max-time 180 \
              --get 'https://api.wordpress.org/plugins/info/1.2/' \
              --data-urlencode 'action=plugin_information' \
              --data-urlencode 'request[slug]=estatik' \
              --data-urlencode 'request[fields][versions]=true' \
              --output "$meta"
          bash .github/scripts/recipe-setup-command.sh estatik-release-resolve -- \
            python3 .github/scripts/resolve-estatik-download.py "$meta" "$ESTATIK_VERSION" "$url_file"
          ESTATIK_DOWNLOAD_URL="$(cat "$url_file")"
          echo "::notice title=Estatik pin::version=$ESTATIK_VERSION sha256=$ESTATIK_SHA256"
          bash .github/scripts/recipe-setup-command.sh estatik-archive-download -- \
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --retry-delay 2 --retry-max-time 120 --connect-timeout 10 --max-time 240 \
              "$ESTATIK_DOWNLOAD_URL" --output "$archive"
          printf '%s  %s\n' "$ESTATIK_SHA256" "$archive" > "$RUNNER_TEMP/estatik.sha256"
          bash .github/scripts/recipe-setup-command.sh estatik-archive-sha256 -- \
            sha256sum --check "$RUNNER_TEMP/estatik.sha256"
          bash .github/scripts/recipe-setup-command.sh estatik-archive-integrity -- unzip -tq "$archive"
          python3 - "$RUNNER_TEMP/recipe-setup-evidence/estatik-lock-verified.json" \
            "$ESTATIK_VERSION" "$ESTATIK_SHA256" <<'PY'
          import json, pathlib, sys
          path, version, sha = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
              'slug': 'estatik', 'version': version, 'archive_sha256': sha,
              'verified': True, 'source': 'WordPress.org API exact-version archive',
          }, indent=2) + '\n')
          PY
          echo "::notice title=Estatik locked archive verified::version=$ESTATIK_VERSION sha256=$ESTATIK_SHA256"
      - name: Installer Estatik depuis l'archive locale vérifiée
        run: |
          set -euo pipefail
          bash .github/scripts/recipe-setup-command.sh estatik-local-install -- \
            wp plugin install "$RUNNER_TEMP/recipe-setup-estatik.zip" --path=wp
      - name: Vérifier l'identité d'Estatik installé
        run: |
          set -euo pipefail
          bash .github/scripts/recipe-setup-command.sh estatik-installed-version -- \
            php -r 'require "wp/wp-load.php"; $h = get_file_data("wp/wp-content/plugins/estatik/estatik.php", ["Version" => "Version"]); $v = (string) ($h["Version"] ?? ""); if ($v !== getenv("ESTATIK_VERSION")) { fwrite(STDERR, "Installed Estatik version does not match the resolved archive.\n"); exit(1); } echo "Estatik version matches resolved archive: $v\n";'
      - name: Activer Estatik
        run: |
          set -euo pipefail
          bash .github/scripts/recipe-setup-command.sh estatik-activate -- \
            wp plugin activate estatik --path=wp
      - name: Copier le plugin Partikulier Core
        run: |
          set -euo pipefail
          bash .github/scripts/recipe-setup-command.sh copy-core-plugin -- \
            rsync -a --delete --exclude='.git' --exclude='.github' \
              plugin/partikulier-core/ wp/wp-content/plugins/partikulier-core/
      - name: Activer Partikulier Core
        run: |
          set -euo pipefail
          bash .github/scripts/recipe-setup-command.sh activate-core-plugin -- \
            wp plugin activate partikulier-core --path=wp
      - name: Copier et activer le thème Partikulier
        run: |
          set -euo pipefail
          bash .github/scripts/recipe-setup-command.sh copy-theme -- \
            rsync -a --delete --exclude='.git' --exclude='.github' --exclude='node_modules' \
              theme/partikulier/ wp/wp-content/themes/partikulier/
          bash .github/scripts/recipe-setup-command.sh activate-theme -- \
            wp theme activate partikulier --path=wp
      - name: Créer le répertoire de cache jetable
        run: mkdir -p wp/wp-content/uploads/partikulier-cache
      - name: Vérifier la santé du plugin
        run: |
          php -r 'require "wp/wp-load.php"; $response = rest_do_request(new WP_REST_Request("GET", "/partikulier/v1/health")); $d = $response->get_data(); if (($d["status"] ?? "") !== "ok") { fwrite(STDERR, json_encode($d)."\n"); exit(1); } echo "health ok — core ".($d["core_version"] ?? "?")." / schema ".($d["schema_version"] ?? "?")."\n";'
      - name: Amorcer une annonce de contrat
        run: |
          php -r 'require "wp/wp-load.php"; wp_set_current_user(1); $request = new WP_REST_Request("POST", "/partikulier/v1/listings"); $request->set_header("Content-Type", "application/json"); $request->set_body(wp_json_encode(["title" => "CI fixture", "description" => "CI contract fixture", "locale" => "fr", "price" => 100, "area" => 10])); $response = rest_do_request($request); if ($response->get_status() !== 201) { fwrite(STDERR, "fixture listing failed: ".wp_json_encode($response->get_data())."\n"); exit(1); } $id = (int) (($response->get_data()["id"] ?? 0)); global $wpdb; $row = $wpdb->get_row($wpdb->prepare("SELECT external_id FROM {$wpdb->prefix}pk_listings WHERE id = %d", $id), ARRAY_A); $post_id = $row ? (int) substr((string) $row["external_id"], strlen("estatik:")) : 0; if ($post_id < 1) { fwrite(STDERR, "fixture post missing\n"); exit(1); } wp_update_post(["ID" => $post_id, "post_status" => "publish"]); wp_insert_post(["post_type" => "properties", "post_status" => "publish", "post_title" => "CI variant fixture", "post_content" => "CI variant contract fixture", "post_author" => 1]); for ($i = 3; $i <= 30; $i++) { wp_insert_post(["post_type" => "properties", "post_status" => "publish", "post_title" => "CI i18n fixture $i", "post_content" => "CI i18n contract fixture", "post_author" => 1]); } unload_textdomain("partikulier", true); load_theme_textdomain("partikulier", get_template_directory() . "/languages"); load_textdomain("partikulier", WP_PLUGIN_DIR . "/partikulier-core/languages/en_US.mo"); (new \Partikulier\Core\Integration\ListingSynchronizer())->flush(); echo "fixture listings ready: 30 published properties\n";'
      - name: Amorcer les invariants historiques des contrats B2 à B5
        run: |
          php -r 'require "wp/wp-load.php"; global $wpdb; $now = gmdate("Y-m-d H:i:s"); update_option("pk_n8n_settings", ["automation_api_secret" => "ci-contract-secret", "active_key_id" => "N", "hmac_mode" => "off"], false); $leads = $wpdb->prefix . "pk_buyer_leads"; $existing = (int) $wpdb->get_var("SELECT COUNT(*) FROM $leads"); for ($i = $existing; $i < 10; $i++) { $seed = "ci-historical-lead-$i"; $wpdb->insert($leads, ["phone_hash" => hash_hmac("sha256", $seed, wp_salt("auth")), "phone_encrypted" => base64_encode($seed), "first_seen_at" => $now, "last_seen_at" => $now], ["%s", "%s", "%s", "%s"]); } $audit = new \Partikulier\Core\AuditLogger(); $adoptions = (array) $wpdb->get_results("SELECT metadata_json FROM {$wpdb->prefix}pk_audit_log"); foreach ([["B2", "leads"], ["B3", "alerts"], ["B4", "automation"], ["B5", "owner_stats"], ["B6", "translation_variants"]] as [$lot, $domain]) { $found = false; foreach ($adoptions as $row) { $meta = json_decode((string) $row->metadata_json, true); if (($meta["lot"] ?? "") === $lot && ($meta["domain"] ?? "") === $domain) { $found = true; break; } } if (!$found) { $audit->record("domain_adopted", "schema", null, ["lot" => $lot, "domain" => $domain]); } } $events = $wpdb->prefix . "pk_automation_events"; for ($i = 1; $i <= 2; $i++) { $wpdb->insert($events, ["event_id" => "ci-historical-event-$i", "event_type" => "fixture", "source" => "ci", "payload_hash" => hash("sha256", "fixture-$i"), "status" => "received", "received_at" => $now], ["%s", "%s", "%s", "%s", "%s", "%s"]); } $saves = $wpdb->prefix . "pk_property_saves"; for ($i = 1; $i <= 4; $i++) { $wpdb->insert($saves, ["property_id" => $i, "visitor_hash" => hash("sha256", "ci-visitor-$i"), "created_at" => $now, "updated_at" => $now], ["%d", "%s", "%s", "%s"]); } echo "historical fixtures ready: leads=".(int) $wpdb->get_var("SELECT COUNT(*) FROM $leads")." events=".(int) $wpdb->get_var("SELECT COUNT(*) FROM $events")." saves=".(int) $wpdb->get_var("SELECT COUNT(*) FROM $saves")."\n";'
      - name: Exécuter DA-002 / périmètre avant les suites dynamiques
        env:
          PK_WP_DIR: ${{ github.workspace }}/wp
          PK_COMMIT: ${{ github.sha }}
          PK_REPO_DIR: ${{ github.workspace }}
          PK_THEME_DIR: ${{ github.workspace }}/theme/partikulier
        run: |
          set -euo pipefail
          mkdir -p preuves-run/contrats
          cd wp
          output=../preuves-run/contrats/module-perimeter-contract.json
          error=../preuves-run/contrats/module-perimeter-contract.err
          if php wp-content/plugins/partikulier-core/tests/module-perimeter-contract.php > "$output" 2> "$error"; then
            cat "$output"
          else
            cat "$output" 2>/dev/null || true
            cat "$error" 2>/dev/null || true
            exit 1
          fi
      - name: Exécuter les 31 suites dynamiques après le contrat de périmètre (20 + SE-016/017/018/020 + SE-022 + SE-026 + Schéma 2.7.0/E-4303 + SE-024 + SE-048-U + SE-035 + SE-036 + SE-037 + SE-054)
        env:
          PK_WP_DIR: ${{ github.workspace }}/wp
          PK_COMMIT: ${{ github.sha }}
          PK_REPO_DIR: ${{ github.workspace }}
          PK_THEME_DIR: ${{ github.workspace }}/theme/partikulier
        run: |
          set -euo pipefail
          mkdir -p preuves-run/contrats
          : > preuves-run/journal.txt
          cd wp
          for suite in core-contract services-contract load-contract rest-lite-scope \
                       routes-collision sync-contract payments-contract premium-contract \
                       leads-contract leads-domain-contract lead-erase-security-contract \
                       alerts-domain-contract automation-domain-contract \
                       owner-stats-domain-contract \
                       translation-variants-domain-contract i18n-chrome-domain-contract \
                       i18n-content-domain-contract i18n-unified-mechanism-contract \
                       avif-security-contract \
                       vestige-extinction-contract artifact-hygiene-contract \
                       options-sanitizer-contract se022-idempotence-contract \
                       se026-hmac-mode-contract \
                       slug-redirects-domain-contract \
                       se024-i18n-dedup-contract \
                       se048-premium-honesty-contract \
                       se035-catalogs-contract \
                       se036-places-referential-contract \
                       se037-seo-multilingual-contract \
                       se054-closure-contract; do
            if php wp-content/plugins/partikulier-core/tests/$suite.php \
                 > ../preuves-run/contrats/$suite.json \
                 2> ../preuves-run/contrats/$suite.err; then
              echo "PASS  $suite" | tee -a ../preuves-run/journal.txt
            else
              echo "FAIL  $suite" | tee -a ../preuves-run/journal.txt
              python3 - "$suite" "../preuves-run/contrats/$suite.json" <<'PY'
          import json, pathlib, re, sys
          suite, path = sys.argv[1:]
          try:
              data = json.loads(pathlib.Path(path).read_text())
              failures = [str(row.get('test_id', '?')) for row in data.get('results', []) if row.get('status') != 'PASS']
              failures = [re.sub(r'[^A-Za-z0-9._-]', '?', item)[:80] for item in failures]
              summary = ','.join(failures) if failures else 'invalid-or-empty-report'
          except Exception:
              summary = 'invalid-or-missing-report'
          print(f'::error title=PHP contract failed::{suite}: {summary}')
          PY
              exit 1
            fi
          done
      - name: Dépendances Playwright Chromium, Firefox et WebKit
        run: |
          npm --prefix theme/partikulier ci --no-audit --no-fund
          cd theme/partikulier && npx playwright install --with-deps chromium firefox webkit
      - name: Contrat front-assets HTTP (SE-018)
        run: |
          set -euo pipefail
          # permaliens « jolis » : le contrat attaque les vraies URLs (/location/…)
          wp rewrite structure '/%postname%/' --path=wp
          # Sorties dans preuves-run/ à la RACINE du job : cette étape ne fait
          # PAS « cd wp » (contrairement à l'étape des 23 suites) — un préfixe
          # « ../ » s'échapperait du workspace du runner (échec du run
          # 34759770385 : « No such file or directory »).
          php -S 127.0.0.1:8099 -t wp theme/partikulier/tests/router-ci.php > preuves-run/front-assets-server.log 2>&1 &
          SRV=$!
          # Sonde de santé durcie (run 34760865434) : exiger un vrai HTTP 200 sur /
          # — l'ancienne boucle sortait 0 sur le 301 canonique (toute réponse HTTP
          # compte pour curl) et laissait passer un serveur incapable de servir
          # les pages (faux vert).
          sain=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/ || true)
            if [ "$code" = "200" ]; then sain=true; break; fi
            sleep 0.5
          done
          if [ "$sain" != true ]; then
            echo "FAIL  front-assets (sonde HTTP : pas de 200 sur /, code=$code)" | tee -a preuves-run/journal.txt
            kill "$SRV" 2>/dev/null || true
            exit 1
          fi
          PK_BASE=http://127.0.0.1:8099 \
          PK_ESTATIK_FILE=$PWD/wp/wp-content/plugins/estatik/estatik.php \
            node theme/partikulier/tests/front-assets.mjs > preuves-run/contrats/front-assets.json
          echo "PASS  front-assets" | tee -a preuves-run/journal.txt
          kill "$SRV" 2>/dev/null || true
      - name: Contrat SE-022 HTTP réel (E-1609/E-2201/E-2202)
        run: |
          set -euo pipefail
          # Batterie rate-limit sur cycle HTTP complet (rest_post_dispatch /
          # rest_send_allow_header compris — rest_do_request seul y est aveugle).
          # Sorties à la racine du job, même discipline que front-assets (run 34759770385).
          php -S 127.0.0.1:8101 -t wp theme/partikulier/tests/router-ci.php > preuves-run/se022-server.log 2>&1 &
          SRV=$!
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8101/ && break; sleep 0.5; done
          PK_BASE=http://127.0.0.1:8101 \
          PK_WP_DIR=$PWD/wp \
          PK_COMMIT=${{ github.sha }} \
            php plugin/partikulier-core/tests/se022-http-battery.php > preuves-run/contrats/se022-http-battery.json
          echo "PASS  se022-http-battery" | tee -a preuves-run/journal.txt
          kill "$SRV" 2>/dev/null || true
      - name: Contrat SE-043 HTTP réel — routage géo 404/410/301 + jamais de cache des échecs
        run: |
          set -euo pipefail
          # Batterie E-4304 : le routage géo réel (redirect_canonical compris)
          # exige le port de home_url() (8099) — réutilisé séquentiellement après
          # front-assets, comme search-arrays.
          php -S 127.0.0.1:8099 -t wp theme/partikulier/tests/router-ci.php > preuves-run/se043-server.log 2>&1 &
          SRV=$!
          sain=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/ || true)
            if [ "$code" = "200" ]; then sain=true; break; fi
            sleep 0.5
          done
          if [ "$sain" != true ]; then
            echo "FAIL  se043-geo-routing-battery (sonde HTTP : pas de 200 sur /, code=$code)" | tee -a preuves-run/journal.txt
            kill "$SRV" 2>/dev/null || true
            exit 1
          fi
          PK_BASE=http://127.0.0.1:8099 \
          PK_WP_DIR=$PWD/wp \
          PK_COMMIT=${{ github.sha }} \
            php plugin/partikulier-core/tests/se043-geo-routing-battery.php > preuves-run/contrats/se043-geo-routing-battery.json
          echo "PASS  se043-geo-routing-battery" | tee -a preuves-run/journal.txt
          kill "$SRV" 2>/dev/null || true
      - name: Contrat SE-034 HTTP réel — idempotence du canal public de dépôt
        run: |
          set -euo pipefail
          # Batterie E-3403 : double soumission au canal public (admin-ajax
          # pk_submit_listing) — le rejeu ne doit créer aucun doublon.
          php -S 127.0.0.1:8099 -t wp theme/partikulier/tests/router-ci.php > preuves-run/se034-server.log 2>&1 &
          SRV=$!
          sain=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/ || true)
            if [ "$code" = "200" ]; then sain=true; break; fi
            sleep 0.5
          done
          if [ "$sain" != true ]; then
            echo "FAIL  se034-form-idempotency-contract (sonde HTTP : pas de 200 sur /, code=$code)" | tee -a preuves-run/journal.txt
            kill "$SRV" 2>/dev/null || true
            exit 1
          fi
          PK_BASE=http://127.0.0.1:8099 \
          PK_WP_DIR=$PWD/wp \
          PK_COMMIT=${{ github.sha }} \
            php plugin/partikulier-core/tests/se034-form-idempotency-contract.php > preuves-run/contrats/se034-form-idempotency-contract.json
