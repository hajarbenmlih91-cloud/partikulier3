name: Contrats de recette (WordPress)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PK_VERSION: '2.10.8'

permissions:
  contents: read

jobs:
  contrats:
    name: contrats WordPress / PHP 8.3
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: partikulier
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --protocol=tcp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, sqlite3, curl
      - name: Installer WP-CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /usr/local/bin/wp
          chmod +x /usr/local/bin/wp
          wp --info
      - name: Installer WordPress et les livrables
        run: |
          wp core download --version=6.6 --path=wp
          wp config create --path=wp --dbname=partikulier --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          # Identité du site = origine réellement attaquée par le contrat
          # front-assets (échec du run 34760865434) : « partikulier.local » est
          # un hôte fictif SANS port. redirect_canonical (canonical.php :613-616
          # et :726-738) conservait alors l'hôte de la requête mais supprimait
          # son port 8099 → 301 vers http://127.0.0.1/ (port 80, rien n'y
          # écoute) → Node échouait en « fetch failed » (6/7). Même philosophie
          # que le banc de qualification : home == l'origine servie, port inclus.
          wp core install --path=wp --url=http://127.0.0.1:8099 --title=Partikulier \
            --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          wp plugin install estatik --activate --path=wp
          rsync -a --delete --exclude='.git' --exclude='.github' plugin/partikulier-core/ wp/wp-content/plugins/partikulier-core/
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='node_modules' theme/partikulier/ wp/wp-content/themes/partikulier/
          wp plugin activate partikulier-core --path=wp
          wp theme activate partikulier --path=wp
          mkdir -p wp/wp-content/uploads/partikulier-cache
      - name: Vérifier la santé du plugin
        run: |
          php -r 'require "wp/wp-load.php"; $response = rest_do_request(new WP_REST_Request("GET", "/partikulier/v1/health")); $d = $response->get_data(); if (($d["status"] ?? "") !== "ok") { fwrite(STDERR, json_encode($d)."\n"); exit(1); } echo "health ok — core ".($d["core_version"] ?? "?")." / schema ".($d["schema_version"] ?? "?")."\n";'
      - name: Amorcer une annonce de contrat
        run: |
          php -r 'require "wp/wp-load.php"; wp_set_current_user(1); $request = new WP_REST_Request("POST", "/partikulier/v1/listings"); $request->set_header("Content-Type", "application/json"); $request->set_body(wp_json_encode(["title" => "CI fixture", "description" => "CI contract fixture", "locale" => "fr", "price" => 100, "area" => 10])); $response = rest_do_request($request); if ($response->get_status() !== 201) { fwrite(STDERR, "fixture listing failed: ".wp_json_encode($response->get_data())."\n"); exit(1); } $id = (int) (($response->get_data()["id"] ?? 0)); global $wpdb; $row = $wpdb->get_row($wpdb->prepare("SELECT external_id FROM {$wpdb->prefix}pk_listings WHERE id = %d", $id), ARRAY_A); $post_id = $row ? (int) substr((string) $row["external_id"], strlen("estatik:")) : 0; if ($post_id < 1) { fwrite(STDERR, "fixture post missing\n"); exit(1); } wp_update_post(["ID" => $post_id, "post_status" => "publish"]); wp_insert_post(["post_type" => "properties", "post_status" => "publish", "post_title" => "CI variant fixture", "post_content" => "CI variant contract fixture", "post_author" => 1]); for ($i = 3; $i <= 30; $i++) { wp_insert_post(["post_type" => "properties", "post_status" => "publish", "post_title" => "CI i18n fixture $i", "post_content" => "CI i18n contract fixture", "post_author" => 1]); } unload_textdomain("partikulier", true); load_theme_textdomain("partikulier", get_template_directory() . "/languages"); load_textdomain("partikulier", WP_PLUGIN_DIR . "/partikulier-core/languages/en_US.mo"); (new \Partikulier\Core\Integration\ListingSynchronizer())->flush(); echo "fixture listings ready: 30 published properties\n";'
      - name: Amorcer les invariants historiques des contrats B2 à B5
        run: |
          php -r 'require "wp/wp-load.php"; global $wpdb; $now = gmdate("Y-m-d H:i:s"); update_option("pk_n8n_settings", ["automation_api_secret" => "ci-contract-secret", "active_key_id" => "N", "hmac_mode" => "off"], false); $leads = $wpdb->prefix . "pk_buyer_leads"; $existing = (int) $wpdb->get_var("SELECT COUNT(*) FROM $leads"); for ($i = $existing; $i < 10; $i++) { $seed = "ci-historical-lead-$i"; $wpdb->insert($leads, ["phone_hash" => hash_hmac("sha256", $seed, wp_salt("auth")), "phone_encrypted" => base64_encode($seed), "first_seen_at" => $now, "last_seen_at" => $now], ["%s", "%s", "%s", "%s"]); } $audit = new \Partikulier\Core\AuditLogger(); $adoptions = (array) $wpdb->get_results("SELECT metadata_json FROM {$wpdb->prefix}pk_audit_log"); foreach ([["B2", "leads"], ["B3", "alerts"], ["B4", "automation"], ["B5", "owner_stats"], ["B6", "translation_variants"]] as [$lot, $domain]) { $found = false; foreach ($adoptions as $row) { $meta = json_decode((string) $row->metadata_json, true); if (($meta["lot"] ?? "") === $lot && ($meta["domain"] ?? "") === $domain) { $found = true; break; } } if (!$found) { $audit->record("domain_adopted", "schema", null, ["lot" => $lot, "domain" => $domain]); } } $events = $wpdb->prefix . "pk_automation_events"; for ($i = 1; $i <= 2; $i++) { $wpdb->insert($events, ["event_id" => "ci-historical-event-$i", "event_type" => "fixture", "source" => "ci", "payload_hash" => hash("sha256", "fixture-$i"), "status" => "received", "received_at" => $now], ["%s", "%s", "%s", "%s", "%s", "%s"]); } $saves = $wpdb->prefix . "pk_property_saves"; for ($i = 1; $i <= 4; $i++) { $wpdb->insert($saves, ["property_id" => $i, "visitor_hash" => hash("sha256", "ci-visitor-$i"), "created_at" => $now, "updated_at" => $now], ["%d", "%s", "%s", "%s"]); } echo "historical fixtures ready: leads=".(int) $wpdb->get_var("SELECT COUNT(*) FROM $leads")." events=".(int) $wpdb->get_var("SELECT COUNT(*) FROM $events")." saves=".(int) $wpdb->get_var("SELECT COUNT(*) FROM $saves")."\n";'
      - name: Exécuter les 32 suites dynamiques (20 + SE-016/017/018/020 + SE-022 + SE-026 + Schéma 2.7.0/E-4303 + SE-024 + SE-048-U + SE-035 + SE-036 + SE-037 + SE-054)
        env:
          PK_WP_DIR: ${{ github.workspace }}/wp
          PK_COMMIT: ${{ github.sha }}
          PK_REPO_DIR: ${{ github.workspace }}
          PK_THEME_DIR: ${{ github.workspace }}/theme/partikulier
        run: |
          set -euo pipefail
          mkdir -p preuves-run/contrats
          : > preuves-run/journal.txt
          cd wp
          for suite in core-contract services-contract load-contract rest-lite-scope \
                       routes-collision sync-contract payments-contract premium-contract \
                       leads-contract leads-domain-contract lead-erase-security-contract \
                       alerts-domain-contract automation-domain-contract \
                       owner-stats-domain-contract \
                       translation-variants-domain-contract i18n-chrome-domain-contract \
                       i18n-content-domain-contract i18n-unified-mechanism-contract \
                       module-perimeter-contract avif-security-contract \
                       vestige-extinction-contract artifact-hygiene-contract \
                       options-sanitizer-contract se022-idempotence-contract \
                       se026-hmac-mode-contract \
                       slug-redirects-domain-contract \
                       se024-i18n-dedup-contract \
                       se048-premium-honesty-contract \
                       se035-catalogs-contract \
                       se036-places-referential-contract \
                       se037-seo-multilingual-contract \
                       se054-closure-contract; do
            if php wp-content/plugins/partikulier-core/tests/$suite.php \
                 > ../preuves-run/contrats/$suite.json \
                 2> ../preuves-run/contrats/$suite.err; then
              echo "PASS  $suite" | tee -a ../preuves-run/journal.txt
            else
              echo "FAIL  $suite" | tee -a ../preuves-run/journal.txt
              exit 1
            fi
          done
      - name: Contrat front-assets HTTP (SE-018)
        run: |
          set -euo pipefail
          # permaliens « jolis » : le contrat attaque les vraies URLs (/location/…)
          wp rewrite structure '/%postname%/' --path=wp
          # Sorties dans preuves-run/ à la RACINE du job : cette étape ne fait
          # PAS « cd wp » (contrairement à l'étape des 23 suites) — un préfixe
          # « ../ » s'échapperait du workspace du runner (échec du run
          # 34759770385 : « No such file or directory »).
          php -S 127.0.0.1:8099 -t wp theme/partikulier/tests/router-ci.php > preuves-run/front-assets-server.log 2>&1 &
          SRV=$!
          # Sonde de santé durcie (run 34760865434) : exiger un vrai HTTP 200 sur /
          # — l'ancienne boucle sortait 0 sur le 301 canonique (toute réponse HTTP
          # compte pour curl) et laissait passer un serveur incapable de servir
          # les pages (faux vert).
          sain=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/ || true)
            if [ "$code" = "200" ]; then sain=true; break; fi
            sleep 0.5
          done
          if [ "$sain" != true ]; then
            echo "FAIL  front-assets (sonde HTTP : pas de 200 sur /, code=$code)" | tee -a preuves-run/journal.txt
            kill "$SRV" 2>/dev/null || true
            exit 1
          fi
          PK_BASE=http://127.0.0.1:8099 \
          PK_ESTATIK_FILE=$PWD/wp/wp-content/plugins/estatik/estatik.php \
            node theme/partikulier/tests/front-assets.mjs > preuves-run/contrats/front-assets.json
          echo "PASS  front-assets" | tee -a preuves-run/journal.txt
          kill "$SRV" 2>/dev/null || true
      - name: Contrat SE-022 HTTP réel (E-1609/E-2201/E-2202)
        run: |
          set -euo pipefail
          # Batterie rate-limit sur cycle HTTP complet (rest_post_dispatch /
          # rest_send_allow_header compris — rest_do_request seul y est aveugle).
          # Sorties à la racine du job, même discipline que front-assets (run 34759770385).
          php -S 127.0.0.1:8101 -t wp theme/partikulier/tests/router-ci.php > preuves-run/se022-server.log 2>&1 &
          SRV=$!
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8101/ && break; sleep 0.5; done
          PK_BASE=http://127.0.0.1:8101 \
          PK_WP_DIR=$PWD/wp \
          PK_COMMIT=${{ github.sha }} \
            php plugin/partikulier-core/tests/se022-http-battery.php > preuves-run/contrats/se022-http-battery.json
          echo "PASS  se022-http-battery" | tee -a preuves-run/journal.txt
          kill "$SRV" 2>/dev/null || true
      - name: Contrat SE-043 HTTP réel — routage géo 404/410/301 + jamais de cache des échecs
        run: |
          set -euo pipefail
          # Batterie E-4304 : le routage géo réel (redirect_canonical compris)
          # exige le port de home_url() (8099) — réutilisé séquentiellement après
          # front-assets, comme search-arrays.
          php -S 127.0.0.1:8099 -t wp theme/partikulier/tests/router-ci.php > preuves-run/se043-server.log 2>&1 &
          SRV=$!
          sain=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/ || true)
            if [ "$code" = "200" ]; then sain=true; break; fi
            sleep 0.5
          done
          if [ "$sain" != true ]; then
            echo "FAIL  se043-geo-routing-battery (sonde HTTP : pas de 200 sur /, code=$code)" | tee -a preuves-run/journal.txt
            kill "$SRV" 2>/dev/null || true
            exit 1
          fi
          PK_BASE=http://127.0.0.1:8099 \
          PK_WP_DIR=$PWD/wp \
          PK_COMMIT=${{ github.sha }} \
            php plugin/partikulier-core/tests/se043-geo-routing-battery.php > preuves-run/contrats/se043-geo-routing-battery.json
          echo "PASS  se043-geo-routing-battery" | tee -a preuves-run/journal.txt
          kill "$SRV" 2>/dev/null || true
      - name: Contrat SE-034 HTTP réel — idempotence du canal public de dépôt
        run: |
          set -euo pipefail
          # Batterie E-3403 : double soumission au canal public (admin-ajax
          # pk_submit_listing) — le rejeu ne doit créer aucun doublon.
          php -S 127.0.0.1:8099 -t wp theme/partikulier/tests/router-ci.php > preuves-run/se034-server.log 2>&1 &
          SRV=$!
          sain=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/ || true)
            if [ "$code" = "200" ]; then sain=true; break; fi
            sleep 0.5
          done
          if [ "$sain" != true ]; then
            echo "FAIL  se034-form-idempotency-contract (sonde HTTP : pas de 200 sur /, code=$code)" | tee -a preuves-run/journal.txt
            kill "$SRV" 2>/dev/null || true
            exit 1
          fi
          PK_BASE=http://127.0.0.1:8099 \
          PK_WP_DIR=$PWD/wp \
          PK_COMMIT=${{ github.sha }} \
            php plugin/partikulier-core/tests/se034-form-idempotency-contract.php > preuves-run/contrats/se034-form-idempotency-contract.json
          echo "PASS  se034-form-idempotency-contract" | tee -a preuves-run/journal.txt
          kill "$SRV" 2>/dev/null || true
      - name: Contrat E-5105 — paramètres tableau de la recherche (lot sécurité 6.20.6)
        run: |
          set -euo pipefail
          # Serveur front sur l'ORIGINE DU SITE (home == origine attaquée, port
          # 8099 inclus — même philosophie que front-assets, échec du run
          # 34760865434). Un port dédié (8102 ≠ home :8099) faisait 301-redirecter
          # toute page front par redirect_canonical (canonical.php :611-612 impose
          # le port de home, :730-748 le compare à celui de la requête) vers un
          # port où rien n'écoute → curl « Failed to connect to 127.0.0.1 port
          # 8099 » (échec du run 35118723372). SE-022 (8101) y est insensible car
          # les requêtes REST ne passent pas template_redirect/redirect_canonical ;
          # les contrats FRONT, si.
          php -S 127.0.0.1:8099 -t wp theme/partikulier/tests/router-ci.php > preuves-run/search-arrays-server.log 2>&1 &
          SRV=$!
          # Sonde de santé durcie (discipline front-assets) : exiger un vrai
          # HTTP 200 sur / — l'ancienne boucle sortait au premier 301.
          sain=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/ || true)
            if [ "$code" = "200" ]; then sain=true; break; fi
            sleep 0.5
          done
          if [ "$sain" != true ]; then
            echo "FAIL  search-arrays-contract (sonde HTTP : pas de 200 sur /, code=$code)" | tee -a preuves-run/journal.txt
            kill "$SRV" 2>/dev/null || true
            exit 1
          fi
          PK_BASE=http://127.0.0.1:8099 \
          PK_WP_DIR=$PWD/wp \
          PK_COMMIT=${{ github.sha }} \
            php theme/partikulier/tests/search-arrays-contract.php > preuves-run/contrats/search-arrays-contract.json
          echo "PASS  search-arrays-contract" | tee -a preuves-run/journal.txt
          kill "$SRV" 2>/dev/null || true
      - name: Installer Polylang et créer fr/en/ar (SE-025, E-2501)
        run: |
          # Version épinglée = celle de la config de référence (E-2503,
          # docs/INSTALLATION.md) : la montée de version de Polylang est un
          # acte délibéré, jamais une dérive silencieuse du runner.
          wp plugin install polylang --version=3.8.7 --activate --path=wp
          # Phase 1 (contexte WP-CLI, recette validée E-2501) : les trois
          # langues + les réglages de référence. Le contexte CLI est
          # exigé : sans langues définies, Polylang n'instancie aucun
          # contexte front (class-polylang.php::init laisse $class vide)
          # et $GLOBALS['polylang'] n'existe pas en PHP nu — le modèle
          # n'est joignable que par le contexte admin/CLI. Fr créée EN
          # PREMIER : la première langue devient la langue par défaut
          # (Model\Languages::add). Heredoc vers un fichier — discipline
          # FIX1 (run 35358466811) : aucune apostrophe ne doit vivre dans
          # un quoting shell.
          cat > pll-langues.php <<'PLL_LANGUES'
          <?php
          if (!defined("ABSPATH")) { exit("CLI only"); }
          $model = isset($GLOBALS["polylang"]) && $GLOBALS["polylang"] ? $GLOBALS["polylang"]->model : null;
          if (!$model) { WP_CLI::error("Polylang n'est pas actif"); }
          $langues = array(
              array("name" => "Français", "slug" => "fr", "locale" => "fr_FR", "rtl" => 0, "flag" => "fr", "term_group" => 1),
              array("name" => "English", "slug" => "en", "locale" => "en_US", "rtl" => 0, "flag" => "us", "term_group" => 0),
              array("name" => "العربية", "slug" => "ar", "locale" => "ar", "rtl" => 1, "flag" => "ma", "term_group" => 2),
          );
          foreach ($langues as $l) {
              if (!$model->get_language($l["slug"])) {
                  $res = $model->add_language($l);
                  if (is_wp_error($res)) { WP_CLI::error("langue ".$l["slug"]." : ".$res->get_error_message()); }
              }
          }
          // Réglages via l'API sanctionnée PLL()->options->merge() — le
          // chemin des écrans Réglages. JAMAIS update_option() direct :
          // Options::save_all() (hook shutdown) réécrit l'option en
          // fusionnant DB × mémoire, et écraserait la valeur au sortir du
          // processus. merge() marque l'objet modifié : le shutdown
          // persiste NOS valeurs.
          $erreurs = $GLOBALS["polylang"]->options->merge(array(
              "force_lang" => 1,    // langue en répertoire : /fr/ /en/ /ar/
              "hide_default" => 0,  // la langue par défaut garde son préfixe
              "browser" => 0,
              "redirect_lang" => 0,
              "default_lang" => "fr",
              "taxonomies" => array("es_type", "es_status", "es_location", "es_category"),
              "post_types" => array("post", "page", "properties"),
          ));
          if (is_wp_error($erreurs) && $erreurs->has_errors()) {
              WP_CLI::error("réglages polylang : " . $erreurs->get_error_message());
          }
          wp_cache_flush();
          WP_CLI::success("langues fr (défaut) / en / ar (rtl=1) créées, réglages de référence posés");
          PLL_LANGUES
          wp eval-file pll-langues.php --path=wp
          # Phase 2 (processus neuf n°2) : Polylang amorce ses types traduits
          # AU BOOT — les options de la phase 1 ne sont visibles qu'ici. On
          # rejoue l'étape « contenus non traduits » du wizard : assignation
          # en masse du contenu existant (les 30 annonces) à la langue par
          # défaut, sinon /fr/annonces/ serait vide, puis flush des rewrites.
          cat > pll-masse.php <<'PLL_MASSE'
          <?php
          if (!defined("ABSPATH")) { exit("CLI only"); }
          $model = isset($GLOBALS["polylang"]) && $GLOBALS["polylang"] ? $GLOBALS["polylang"]->model : null;
          if (!$model) { WP_CLI::error("Polylang n'est pas actif"); }
          $fr = $model->get_language("fr");
          if (!$fr) { WP_CLI::error("langue fr introuvable"); }
          $model->set_language_in_mass($fr);
          flush_rewrite_rules();
          $sans = 0;
          foreach (get_posts(array("post_type" => "properties", "post_status" => "any", "numberposts" => 100, "fields" => "ids")) as $pid) {
              if (!pll_get_post_language($pid)) { $sans++; }
          }
          if ($sans > 0) { WP_CLI::error("$sans annonces properties restent sans langue"); }
          WP_CLI::success("contenu existant assigné à fr, rewrites flushed");
          PLL_MASSE
          wp eval-file pll-masse.php --path=wp
          wp rewrite flush --path=wp
      - name: Contrat trilingue SE-025 HTTP réel — 9 URLs ×3 langues + RTL + hreflang (E-2502)
        run: |
          set -euo pipefail
          # Serveur sur l'ORIGINE DU SITE (home == origine attaquée, port
          # 8099 inclus — discipline front-assets/search-arrays). Après
          # Polylang (force_lang=1, hide_default=0), la racine / REDIRIGE
          # vers /fr/ : la sonde exige donc un 200 DIRECT sur l'accueil de
          # la langue par défaut.
          php -S 127.0.0.1:8099 -t wp theme/partikulier/tests/router-ci.php > preuves-run/se025-server.log 2>&1 &
          SRV=$!
          sain=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/fr/ || true)
            if [ "$code" = "200" ]; then sain=true; break; fi
            sleep 0.5
          done
          if [ "$sain" != true ]; then
            echo "FAIL  se025-trilingual-routes-contract (sonde HTTP : pas de 200 sur /fr/, code=$code)" | tee -a preuves-run/journal.txt
            kill "$SRV" 2>/dev/null || true
            exit 1
          fi
          PK_BASE=http://127.0.0.1:8099 \
          PK_WP_DIR=$PWD/wp \
          PK_COMMIT=${{ github.sha }} \
            php theme/partikulier/tests/se025-trilingual-routes-contract.php > preuves-run/contrats/se025-trilingual-routes-contract.json
          echo "PASS  se025-trilingual-routes-contract" | tee -a preuves-run/journal.txt
          kill "$SRV" 2>/dev/null || true
      - name: Contrat SE-041 HTTP réel — XML-RPC (E-4101, lot B Phase 1)
        run: |
          set -euo pipefail
          # Après SE-025 (contexte trilingue rétabli), avant l'oracle — même
          # discipline serveur que SE-025 : origine du site, port 8099 inclus.
          # Le filtre xmlrpc_methods vide la table applicative ; IXR ajoute
          # ensuite exactement trois méthodes system.*. Statut ET corps XML
          # contrôlés séparément (démo négative : code original = 5 FAIL / 6).
          php -S 127.0.0.1:8099 -t wp theme/partikulier/tests/router-ci.php > preuves-run/se041-server.log 2>&1 &
          SRV=$!
          sain=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/fr/ || true)
            if [ "$code" = "200" ]; then sain=true; break; fi
            sleep 0.5
          done
          if [ "$sain" != true ]; then
            echo "FAIL  se041-xmlrpc-contract (sonde HTTP : pas de 200 sur /fr/, code=$code)" | tee -a preuves-run/journal.txt
            kill "$SRV" 2>/dev/null || true
            exit 1
          fi
          PK_BASE=http://127.0.0.1:8099 \
          PK_WP_DIR=$PWD/wp \
          PK_COMMIT=${{ github.sha }} \
            php theme/partikulier/tests/se041-xmlrpc-contract.php > preuves-run/contrats/se041-xmlrpc-contract.json
          echo "PASS  se041-xmlrpc-contract" | tee -a preuves-run/journal.txt
          kill "$SRV" 2>/dev/null || true
      - name: Contrat SE-027 HTTP réel — double-préfixation rewrite (E-2701→E-2703, lot C Phase 1)
        run: |
          set -euo pipefail
          # Après SE-041 (contexte trilingue), avant l'oracle. Le contrat pilote
          # lui-même ses processus distincts (branche sans Polylang via PK_WP_CLI,
          # restauration trilingue en finally) et lance le contrat enfant SE-025
          # (12 assertions jamais recomptées dans l'oracle). Serveur sur
          # l'origine du site, discipline SE-025/SE-041.
          php -S 127.0.0.1:8099 -t wp theme/partikulier/tests/router-ci.php > preuves-run/se027-server.log 2>&1 &
          SRV=$!
          sain=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/fr/ || true)
            if [ "$code" = "200" ]; then sain=true; break; fi
            sleep 0.5
          done
          if [ "$sain" != true ]; then
            echo "FAIL  se027-rewrite-prefix-contract (sonde HTTP : pas de 200 sur /fr/, code=$code)" | tee -a preuves-run/journal.txt
            kill "$SRV" 2>/dev/null || true
            exit 1
          fi
          PK_BASE=http://127.0.0.1:8099 \
          PK_WP_DIR=$PWD/wp \
          PK_COMMIT=${{ github.sha }} \
          PK_WP_CLI=wp \
            php theme/partikulier/tests/se027-rewrite-prefix-contract.php > preuves-run/contrats/se027-rewrite-prefix-contract.json
          echo "PASS  se027-rewrite-prefix-contract" | tee -a preuves-run/journal.txt
          kill "$SRV" 2>/dev/null || true
      - name: Vérifier l'oracle 382/382 (durci — schéma, cohérence, unicité, totaux épinglés, results exigé hors suites historiques ; reprise F3 + tests v3 §9.2)
        run: |
          # Validateur durci (reprise du 20/09/2026 F3, durci le 21/09/2026
          # §9.2) : l'ancien validateur additionnait total/passed DECLARES et
          # acceptait un unique faux rapport auto-contradictoire. Le contrôle,
          # pour CHAQUE suite : JSON valide ; status === "PASS" ; total/passed/
          # failed entiers ; passed + failed === total ; failed === 0 ; total
          # === LE total épingle de la suite (table ci-dessous, somme = 382) ;
          # la cle results est EXIGEE pour toute suite hors liste blanche
          # (v3 §9.2 : sa suppression de SE-041/SE-027 restait acceptee en
          # v2) ; SI results est fourni : total === count(results), passed ===
          # nb de PASS REELS, aucun FAIL cache sous status PASS, unicite des
          # test_id. Les 9 suites historiques sans results — core, services,
          # load, rest-lite, routes-collision, sync, payments, premium, leads —
          # sont les seules autorisees a s'en passer (search-arrays EMET
          # results). Cardinalite et ensemble EXACT des 40 suites
          # attendues ; aucun fichier en trop ou manquant ; total global 382/382.
          php <<'ORACLE'
          <?php
          $attendues = array(
                    "alerts-domain-contract.json" => 15,
          "artifact-hygiene-contract.json" => 3,
          "automation-domain-contract.json" => 23,
          "avif-security-contract.json" => 15,
          "core-contract.json" => 8,
          "front-assets.json" => 7,
          "i18n-chrome-domain-contract.json" => 13,
          "i18n-content-domain-contract.json" => 15,
          "i18n-unified-mechanism-contract.json" => 15,
          "lead-erase-security-contract.json" => 13,
          "leads-contract.json" => 7,
          "leads-domain-contract.json" => 16,
          "load-contract.json" => 7,
          "module-perimeter-contract.json" => 11,
          "options-sanitizer-contract.json" => 8,
          "owner-stats-domain-contract.json" => 16,
          "payments-contract.json" => 10,
          "premium-contract.json" => 8,
          "rest-lite-scope.json" => 10,
          "routes-collision.json" => 6,
          "se022-http-battery.json" => 4,
          "se022-idempotence-contract.json" => 9,
          "se024-i18n-dedup-contract.json" => 7,
          "se025-trilingual-routes-contract.json" => 12,
          "se026-hmac-mode-contract.json" => 4,
          "se027-rewrite-prefix-contract.json" => 6,
          "se034-form-idempotency-contract.json" => 6,
          "se035-catalogs-contract.json" => 5,
          "se036-places-referential-contract.json" => 5,
          "se037-seo-multilingual-contract.json" => 5,
          "se041-xmlrpc-contract.json" => 6,
          "se043-geo-routing-battery.json" => 9,
          "se048-premium-honesty-contract.json" => 6,
          "se054-closure-contract.json" => 5,
          "search-arrays-contract.json" => 9,
          "services-contract.json" => 7,
          "slug-redirects-domain-contract.json" => 9,
          "sync-contract.json" => 14,
          "translation-variants-domain-contract.json" => 16,
          "vestige-extinction-contract.json" => 12,
          );
          $sansResultsAutorisees = array(
          "core-contract.json", "services-contract.json", "load-contract.json", "rest-lite-scope.json", "routes-collision.json", "sync-contract.json", "payments-contract.json", "premium-contract.json", "leads-contract.json",
          );
          $fichiers = glob("preuves-run/contrats/*.json");
          $bases = array_map("basename", $fichiers);
          if (count($bases) !== count($attendues)) {
          fwrite(STDERR, "cardinalite inattendue : attendu " . count($attendues) . " suites, obtenu " . count($bases) . "\n");
          exit(1);
          }
          $tot = 0; $pas = 0;
          foreach ($fichiers as $f) {
          $nom = basename($f);
          if (!isset($attendues[$nom])) {
          fwrite(STDERR, $nom . " : suite hors ensemble attendu\n");
          exit(1);
          }
          $d = json_decode((string) file_get_contents($f), true);
          if (!is_array($d)) { fwrite(STDERR, $nom . " : JSON invalide\n"); exit(1); }
          foreach (array("status", "total", "passed", "failed") as $cle) {
          if (!array_key_exists($cle, $d)) { fwrite(STDERR, $nom . " : cle manquante " . $cle . "\n"); exit(1); }
          }
          if (!in_array($d["status"], array("PASS", "FAIL"), true)) { fwrite(STDERR, $nom . " : status invalide\n"); exit(1); }
          if (!is_int($d["total"]) || !is_int($d["passed"]) || !is_int($d["failed"]) || $d["total"] < 0 || $d["passed"] < 0 || $d["failed"] < 0) {
          fwrite(STDERR, $nom . " : compteurs invalides\n"); exit(1);
          }
          if ($d["status"] !== "PASS" || $d["failed"] !== 0) { fwrite(STDERR, $nom . " : status != PASS ou failed != 0\n"); exit(1); }
          if ($d["passed"] + $d["failed"] !== $d["total"] || $d["passed"] !== $d["total"]) {
          fwrite(STDERR, $nom . " : compteurs incoherents (total=" . $d["total"] . ", passed=" . $d["passed"] . ", failed=" . $d["failed"] . ")\n"); exit(1);
          }
          if ($d["total"] !== $attendues[$nom]) {
          fwrite(STDERR, $nom . " : total " . $d["total"] . " != total epingle " . $attendues[$nom] . "\n"); exit(1);
          }
          if (!in_array($nom, $sansResultsAutorisees, true) && !array_key_exists("results", $d)) {
          fwrite(STDERR, $nom . " : cle results ABSENTE (reservee aux " . count($sansResultsAutorisees) . " suites historiques — v3 §9.2)\n"); exit(1);
          }
          if (array_key_exists("results", $d)) {
          if (!is_array($d["results"])) { fwrite(STDERR, $nom . " : results non tableau\n"); exit(1); }
          if (count($d["results"]) !== $d["total"]) { fwrite(STDERR, $nom . " : count(results) != total\n"); exit(1); }
          $ids = array();
          foreach ($d["results"] as $r) {
          if (!is_array($r) || !isset($r["test_id"], $r["status"]) || !is_string($r["test_id"]) || $r["test_id"] === "" || !in_array($r["status"], array("PASS", "FAIL"), true)) {
          fwrite(STDERR, $nom . " : resultat malforme\n"); exit(1);
          }
          if ($r["status"] !== "PASS") { fwrite(STDERR, $nom . " : assertion " . $r["test_id"] . " != PASS sous statut global PASS\n"); exit(1); }
          $ids[] = $r["test_id"];
          }
          if (count($ids) !== count(array_unique($ids))) { fwrite(STDERR, $nom . " : test_id dupliques\n"); exit(1); }
          }
          $tot += $d["total"]; $pas += $d["passed"];
          }
          if ($tot !== 382 || $pas !== 382) { fwrite(STDERR, "oracle inattendu (attendu 382/382 — 40 suites : 370 reference + 6 SE-041 lot B + 6 SE-027 lot C Phase 1)\n"); exit(1); }
          echo "contrats dynamiques : $pas/$tot (" . count($bases) . " suites, schema, coherence, unicitte, totaux epingles, ensemble exact et results exig hors historiques verifies)\n";
          ORACLE
      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrats-recette
          path: preuves-run/
          retention-days: 30
