name: Contrats de recette (WordPress)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PK_VERSION: '2.8.0'

permissions:
  contents: read

jobs:
  contrats:
    name: contrats WordPress / PHP 8.3
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: partikulier
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --protocol=tcp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, sqlite3, curl
      - name: Installer WP-CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /usr/local/bin/wp
          chmod +x /usr/local/bin/wp
          wp --info
      - name: Installer WordPress et les livrables
        run: |
          wp core download --version=6.6 --path=wp
          wp config create --path=wp --dbname=partikulier --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path=wp --url=http://partikulier.local --title=Partikulier \
            --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          wp plugin install estatik --activate --path=wp
          rsync -a --delete --exclude='.git' --exclude='.github' plugin/partikulier-core/ wp/wp-content/plugins/partikulier-core/
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='node_modules' theme/partikulier/ wp/wp-content/themes/partikulier/
          wp plugin activate partikulier-core --path=wp
          wp theme activate partikulier --path=wp
          mkdir -p wp/wp-content/uploads/partikulier-cache
      - name: Vérifier la santé du plugin
        run: |
          php -r 'require "wp/wp-load.php"; $response = rest_do_request(new WP_REST_Request("GET", "/partikulier/v1/health")); $d = $response->get_data(); if (($d["status"] ?? "") !== "ok") { fwrite(STDERR, json_encode($d)."\n"); exit(1); } echo "health ok — core ".($d["core_version"] ?? "?")." / schema ".($d["schema_version"] ?? "?")."\n";'
      - name: Amorcer une annonce de contrat
        run: |
          php -r 'require "wp/wp-load.php"; wp_set_current_user(1); $request = new WP_REST_Request("POST", "/partikulier/v1/listings"); $request->set_header("Content-Type", "application/json"); $request->set_body(wp_json_encode(["title" => "CI fixture", "description" => "CI contract fixture", "locale" => "fr", "price" => 100, "area" => 10])); $response = rest_do_request($request); if ($response->get_status() !== 201) { fwrite(STDERR, "fixture listing failed: ".wp_json_encode($response->get_data())."\n"); exit(1); } $id = (int) (($response->get_data()["id"] ?? 0)); global $wpdb; $row = $wpdb->get_row($wpdb->prepare("SELECT external_id FROM {$wpdb->prefix}pk_listings WHERE id = %d", $id), ARRAY_A); $post_id = $row ? (int) substr((string) $row["external_id"], strlen("estatik:")) : 0; if ($post_id < 1) { fwrite(STDERR, "fixture post missing\n"); exit(1); } wp_update_post(["ID" => $post_id, "post_status" => "publish"]); (new \Partikulier\Core\Integration\ListingSynchronizer())->flush(); echo "fixture listing ready: $post_id\n";'
      - name: Amorcer les invariants historiques des contrats B2 à B5
        run: |
          php -r 'require "wp/wp-load.php"; global $wpdb; $now = gmdate("Y-m-d H:i:s"); $leads = $wpdb->prefix . "pk_buyer_leads"; $existing = (int) $wpdb->get_var("SELECT COUNT(*) FROM $leads"); for ($i = $existing; $i < 10; $i++) { $seed = "ci-historical-lead-$i"; $wpdb->insert($leads, ["phone_hash" => hash_hmac("sha256", $seed, wp_salt("auth")), "phone_encrypted" => base64_encode($seed), "first_seen_at" => $now, "last_seen_at" => $now], ["%s", "%s", "%s", "%s"]); } $audit = new \Partikulier\Core\AuditLogger(); $adoptions = (array) $wpdb->get_results("SELECT metadata_json FROM {$wpdb->prefix}pk_audit_log WHERE action = \'domain_adopted\'"); foreach ([["B2", "leads"], ["B3", "alerts"], ["B4", "automation"], ["B5", "owner_stats"], ["B6", "translation_variants"]] as [$lot, $domain]) { $found = false; foreach ($adoptions as $row) { $meta = json_decode((string) $row->metadata_json, true); if (($meta["lot"] ?? "") === $lot && ($meta["domain"] ?? "") === $domain) { $found = true; break; } } if (!$found) { $audit->record("domain_adopted", "schema", null, ["lot" => $lot, "domain" => $domain]); } } $events = $wpdb->prefix . "pk_automation_events"; for ($i = 1; $i <= 2; $i++) { $wpdb->insert($events, ["event_id" => "ci-historical-event-$i", "event_type" => "fixture", "source" => "ci", "payload_hash" => hash("sha256", "fixture-$i"), "status" => "received", "received_at" => $now], ["%s", "%s", "%s", "%s", "%s", "%s"]); } $saves = $wpdb->prefix . "pk_property_saves"; for ($i = 1; $i <= 4; $i++) { $wpdb->insert($saves, ["property_id" => $i, "visitor_hash" => hash("sha256", "ci-visitor-$i"), "created_at" => $now, "updated_at" => $now], ["%d", "%s", "%s", "%s"]); } echo "historical fixtures ready: leads=".(int) $wpdb->get_var("SELECT COUNT(*) FROM $leads")." events=".(int) $wpdb->get_var("SELECT COUNT(*) FROM $events")." saves=".(int) $wpdb->get_var("SELECT COUNT(*) FROM $saves")."\n";'
      - name: Exécuter les 16 suites dynamiques
        env:
          PK_WP_DIR: ${{ github.workspace }}/wp
          PK_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p preuves-run/contrats
          : > preuves-run/journal.txt
          cd wp
          for suite in core-contract services-contract load-contract rest-lite-scope \
                       routes-collision sync-contract payments-contract premium-contract \
                       leads-contract leads-domain-contract alerts-domain-contract \
                       automation-domain-contract owner-stats-domain-contract \
                       translation-variants-domain-contract i18n-chrome-domain-contract \
                       i18n-content-domain-contract; do
            if php wp-content/plugins/partikulier-core/tests/$suite.php \
                 > ../preuves-run/contrats/$suite.json \
                 2> ../preuves-run/contrats/$suite.err; then
              echo "PASS  $suite" | tee -a ../preuves-run/journal.txt
            else
              echo "FAIL  $suite" | tee -a ../preuves-run/journal.txt
              exit 1
            fi
          done
      - name: Vérifier l’oracle 184/184
        run: |
          php -r '$tot=0; $pas=0; foreach (glob("preuves-run/contrats/*.json") as $f) { $d=json_decode(file_get_contents($f), true); if (($d["status"] ?? "") !== "PASS") { fwrite(STDERR, basename($f).": status != PASS\n"); exit(1); } $tot += (int) $d["total"]; $pas += (int) $d["passed"]; } echo "contrats dynamiques : $pas/$tot\n"; if ($tot !== 184 || $pas !== 184) { fwrite(STDERR, "oracle inattendu (attendu 184/184)\n"); exit(1); }'
      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrats-recette
          path: preuves-run/
          retention-days: 30
