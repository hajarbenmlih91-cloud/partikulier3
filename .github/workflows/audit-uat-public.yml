name: Audit public du staging UAT

# Réutilisable sans secrets/environnement protégé : audit HTTP public, charge,
# navigateur et Lighthouse. Les parcours authentifiés appartiennent au workflow
# audit-uat.yml et restent soumis à la policy de branche UAT.
on:
  workflow_call:
    inputs:
      load_test:
        description: Exécuter la sonde 10 rps puis 100 rps si elle tient
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  public-audit:
    name: Tests publics UAT (sans secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SITE_URL: https://darkcyan-yak-151002.hostingersite.com
      AUDIT_OUT_DIR: ${{ github.workspace }}/uat-audit-public-artifacts
    defaults:
      run:
        shell: bash
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirmer la cible (staging uniquement)
        run: |
          set -euo pipefail
          test "$SITE_URL" = 'https://darkcyan-yak-151002.hostingersite.com'
          mkdir -p "$AUDIT_OUT_DIR"
          printf '# Audit public UAT\n\nCible : %s\nCommit : `%s`\n\nAucun secret utilisé; aucun formulaire valide soumis.\n' "$SITE_URL" "$GITHUB_SHA" > "$AUDIT_OUT_DIR/README.md"

      - name: Installer PHP CLI et cURL
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          coverage: none

      - name: Installer Node, Playwright et Chromium
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          if ! getent ahostsv4 azure.archive.ubuntu.com >/dev/null 2>&1; then
            printf 'Acquire::ForceIPv4 "true";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99runner-net >/dev/null
            if getent ahostsv4 archive.ubuntu.com >/dev/null 2>&1; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            elif getent ahostsv4 mirrors.edge.kernel.org >/dev/null 2>&1; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            fi
          fi
          cd theme/partikulier
          npm ci
          npm install --no-save axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Sécurité live publique (POST anonymes, endpoints, en-têtes)
        id: security
        continue-on-error: true
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-securite.php "$SITE_URL" 2>&1 | tee "$AUDIT_OUT_DIR/security.txt"

      - name: Rate-limit HMAC et limite du payload (requêtes bornées sans secret)
        id: bounds
        continue-on-error: true
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-bornes.php "$SITE_URL" 2>&1 | tee "$AUDIT_OUT_DIR/bounds.txt"

      - name: Cache, en-têtes et TTFB extérieur
        id: cache
        continue-on-error: true
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-cache.php "$SITE_URL" /fr/annonces/ 20 2>&1 | tee "$AUDIT_OUT_DIR/cache-ttfb.txt"

      - name: Sondage prudent (10 req/s pendant 10 s)
        id: load_smoke
        if: ${{ inputs.load_test }}
        continue-on-error: true
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-charge.php "$SITE_URL" 10 10 /fr/annonces/ /fr/ /fr/annonces/?es_city=casablanca 2>&1 | tee "$AUDIT_OUT_DIR/load-smoke.txt"

      - name: Charge complète (100 req/s pendant 30 s si la sonde tient)
        id: load_full
        if: ${{ inputs.load_test && steps.load_smoke.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-charge.php "$SITE_URL" 100 30 /fr/annonces/ /fr/ /fr/annonces/?es_city=casablanca 2>&1 | tee "$AUDIT_OUT_DIR/load-full.txt"

      - name: Responsive, SEO, Axe et XSS réfléchi avec Chromium
        id: browser_audit
        continue-on-error: true
        working-directory: theme/partikulier
        env:
          PK_BASE: https://darkcyan-yak-151002.hostingersite.com
        run: |
          set -euo pipefail
          node tests/audit-uat.mjs 2>&1 | tee "$AUDIT_OUT_DIR/browser-audit.txt"

      - name: Frontière d'authentification et formulaire de connexion (sans identifiants)
        id: auth_boundary
        continue-on-error: true
        working-directory: theme/partikulier
        env:
          PK_BASE: https://darkcyan-yak-151002.hostingersite.com
        run: |
          set -euo pipefail
          node tests/audit-uat-login.mjs 2>&1 | tee "$AUDIT_OUT_DIR/auth-boundary.txt"

      - name: Interactions JavaScript, captures mobile, LCP, CLS et INP laboratoire
        id: interactions
        continue-on-error: true
        working-directory: theme/partikulier
        env:
          PK_BASE: https://darkcyan-yak-151002.hostingersite.com
        run: |
          set -euo pipefail
          node tests/audit-uat-interactions.mjs 2>&1 | tee "$AUDIT_OUT_DIR/interactions-vitals.txt"

      - name: Lighthouse (mobile FR/EN/AR, archive FR et desktop)
        id: lighthouse
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install --global lighthouse@12.8.2
          chrome_path="$(cd theme/partikulier && node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          run_lh() {
            local label="$1" url="$2" form="$3"
            local emulation=()
            if [[ "$form" == desktop ]]; then
              emulation=(--preset=desktop)
            else
              emulation=(--form-factor=mobile)
            fi
            lighthouse "$url" \
              --chrome-path="$chrome_path" \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo \
              "${emulation[@]}" \
              --output=json \
              --output-path="$AUDIT_OUT_DIR/lighthouse-$label.json" \
              --quiet 2>&1 | tee "$AUDIT_OUT_DIR/lighthouse-$label.txt"
          }
          run_lh fr-home-mobile "$SITE_URL/fr/" mobile
          run_lh en-home-mobile "$SITE_URL/en/" mobile
          run_lh ar-home-mobile "$SITE_URL/ar/" mobile
          run_lh fr-listings-mobile "$SITE_URL/fr/annonces/" mobile
          run_lh fr-home-desktop "$SITE_URL/fr/" desktop
          python - "$AUDIT_OUT_DIR" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          lines = ['## Lighthouse scores et métriques', '', '| Page | Perf | A11y | Best practices | SEO | LCP ms | INP ms | CLS | TBT ms |', '|---|---:|---:|---:|---:|---:|---:|---:|---:|']
          for f in sorted(root.glob('lighthouse-*.json')):
              data = json.loads(f.read_text())
              cats = data.get('categories', {})
              audits = data.get('audits', {})
              score = lambda name: round((cats.get(name, {}).get('score') or 0) * 100)
              def metric(*ids):
                  for audit_id in ids:
                      value = audits.get(audit_id, {}).get('numericValue')
                      if value is not None:
                          return round(value)
                  return 'n/a'
              lines.append(f"| {f.stem.removeprefix('lighthouse-')} | {score('performance')} | {score('accessibility')} | {score('best-practices')} | {score('seo')} | {metric('largest-contentful-paint')} | {metric('interaction-to-next-paint', 'experimental-interaction-to-next-paint')} | {metric('cumulative-layout-shift')} | {metric('total-blocking-time')} |")
          lines.extend(['', 'Note : INP peut être n/a en Lighthouse navigation; le fichier interaction-web-vitals.json contient le proxy INP laboratoire des interactions Playwright.'])
          (root / 'lighthouse-summary.md').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Ajouter le résultat des suites au rapport
        if: always()
        env:
          SECURITY_RESULT: ${{ steps.security.outcome }}
          BOUNDS_RESULT: ${{ steps.bounds.outcome }}
          CACHE_RESULT: ${{ steps.cache.outcome }}
          SMOKE_RESULT: ${{ steps.load_smoke.outcome }}
          FULL_LOAD_RESULT: ${{ steps.load_full.outcome }}
          BROWSER_RESULT: ${{ steps.browser_audit.outcome }}
          LIGHTHOUSE_RESULT: ${{ steps.lighthouse.outcome }}
          AUTH_RESULT: ${{ steps.auth_boundary.outcome }}
          INTERACTIONS_RESULT: ${{ steps.interactions.outcome }}
        run: |
          {
            echo ''
            echo '## Résultat des suites publiques'
            echo ''
            echo '| Suite | Résultat |'
            echo '|---|---|'
            echo "| Sécurité publique | ${SECURITY_RESULT:-skipped} |"
            echo "| Rate-limit/payload | ${BOUNDS_RESULT:-skipped} |"
            echo "| Cache/TTFB | ${CACHE_RESULT:-skipped} |"
            echo "| Charge 10 rps | ${SMOKE_RESULT:-skipped} |"
            echo "| Charge 100 rps | ${FULL_LOAD_RESULT:-skipped} |"
            echo "| Chromium/Axe | ${BROWSER_RESULT:-skipped} |"
            echo "| Auth anonyme + formulaire de connexion | ${AUTH_RESULT:-skipped} |"
            echo "| Interactions JavaScript + LCP/INP | ${INTERACTIONS_RESULT:-skipped} |"
            echo "| Lighthouse | ${LIGHTHOUSE_RESULT:-skipped} |"
          } | tee -a "$AUDIT_OUT_DIR/README.md"
          for summary in "$AUDIT_OUT_DIR/interaction-web-vitals.md" "$AUDIT_OUT_DIR/lighthouse-summary.md"; do
            if [ -f "$summary" ]; then cat "$summary" | tee -a "$GITHUB_STEP_SUMMARY" "$AUDIT_OUT_DIR/README.md"; fi
          done

      - name: Publier les rapports et captures UAT
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-uat-public-${{ github.run_number }}
          path: ${{ github.workspace }}/uat-audit-public-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Verdict final
        if: always()
        env:
          SECURITY_RESULT: ${{ steps.security.outcome }}
          BOUNDS_RESULT: ${{ steps.bounds.outcome }}
          CACHE_RESULT: ${{ steps.cache.outcome }}
          SMOKE_RESULT: ${{ steps.load_smoke.outcome }}
          FULL_LOAD_RESULT: ${{ steps.load_full.outcome }}
          BROWSER_RESULT: ${{ steps.browser_audit.outcome }}
          LIGHTHOUSE_RESULT: ${{ steps.lighthouse.outcome }}
          AUTH_RESULT: ${{ steps.auth_boundary.outcome }}
          INTERACTIONS_RESULT: ${{ steps.interactions.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## Verdict des suites'
            echo ''
            echo '| Suite | Résultat |'
            echo '|---|---|'
            echo "| Sécurité publique | ${SECURITY_RESULT:-skipped} |"
            echo "| Rate-limit/payload | ${BOUNDS_RESULT:-skipped} |"
            echo "| Cache/TTFB | ${CACHE_RESULT:-skipped} |"
            echo "| Responsive/SEO/Axe/XSS | ${BROWSER_RESULT:-skipped} |"
            echo "| Auth anonyme/formulaire | ${AUTH_RESULT:-skipped} |"
            echo "| Interactions JavaScript + LCP/INP | ${INTERACTIONS_RESULT:-skipped} |"
            echo "| Lighthouse | ${LIGHTHOUSE_RESULT:-skipped} |"
            echo "| Charge 10 rps | ${SMOKE_RESULT:-skipped} |"
            echo "| Charge 100 rps | ${FULL_LOAD_RESULT:-skipped} |"
          } | tee -a "$GITHUB_STEP_SUMMARY" "$AUDIT_OUT_DIR/README.md"
          echo "::notice title=UAT audit outcomes::security=$SECURITY_RESULT; bounds=$BOUNDS_RESULT; cache=$CACHE_RESULT; browser=$BROWSER_RESULT; auth=$AUTH_RESULT; interactions=$INTERACTIONS_RESULT; lighthouse=$LIGHTHOUSE_RESULT; load10=$SMOKE_RESULT; load100=$FULL_LOAD_RESULT"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['AUDIT_OUT_DIR'])
          def annotation(title, text):
              text = ' '.join(str(text).splitlines())[:500]
              print(f'::notice title={title}::{text or "no findings recorded"}')
          bounds = root / 'bounds.txt'
          if bounds.exists():
              annotation('UAT rate-limit/payload', ' | '.join(x.strip() for x in bounds.read_text(errors='replace').splitlines() if x.strip()) or 'no result lines')
          security = root / 'security.txt'
          if security.exists():
              failures = [line.strip() for line in security.read_text(errors='replace').splitlines() if line.lstrip().startswith('KO')]
              annotation('UAT security checks', ' | '.join(failures[:5]) if failures else 'no KO results')
          for filename, title in [('browser-audit.json', 'UAT browser checks'), ('interaction-web-vitals.json', 'UAT interaction checks')]:
              path = root / filename
              if path.exists():
                  data = json.loads(path.read_text())
                  rows = data.get('results', data.get('checks', []))
                  error_rows = [row for row in rows if row.get('status') == 'FAIL' and row.get('severity', 'error') == 'error']
                  warning_rows = [row for row in rows if row.get('status') == 'FAIL' and row.get('severity') == 'warning']
                  annotation(title, f"status={data.get('status')}; errors={len(error_rows)}; warnings={len(warning_rows)}")
                  for index, row in enumerate(error_rows[:10], 1):
                      annotation(f'UAT detail {index}', f"{row.get('check', '?')}: {row.get('detail', '')}")
              else:
                  log = root / ('interactions-vitals.txt' if filename == 'interaction-web-vitals.json' else 'browser-audit.txt')
                  log_lines = log.read_text(errors='replace').splitlines() if log.exists() else []
                  failed_lines = [line.strip() for line in log_lines if line.lstrip().startswith(('FAIL', 'Error', 'error:', 'node:'))]
                  if failed_lines and failed_lines[0].startswith('node:internal/'):
                      details = [line.strip() for line in log_lines[-15:] if line.strip()]
                  else:
                      details = failed_lines[:5] or [line.strip() for line in log_lines[-5:] if line.strip()]
                  annotation(title, 'report missing; ' + (' | '.join(details) if details else 'no failure detail captured'))
          expected_lighthouse = ['fr-home-mobile', 'en-home-mobile', 'ar-home-mobile', 'fr-listings-mobile', 'fr-home-desktop']
          produced = {path.stem.removeprefix('lighthouse-') for path in root.glob('lighthouse-*.json')}
          missing_lighthouse = [name for name in expected_lighthouse if name not in produced]
          lighthouse_errors = []
          for name in missing_lighthouse:
              log = root / f'lighthouse-{name}.txt'
              if log.exists(): lighthouse_errors.extend(line.strip() for line in log.read_text(errors='replace').splitlines()[-10:] if line.strip())
          annotation('UAT Lighthouse files', f'{len(produced)} of 5 produced; missing={",".join(missing_lighthouse) or "none"}; ' + (' | '.join(lighthouse_errors[-8:]) if lighthouse_errors else 'no per-page error logs'))
          for label, filename in [('10 rps', 'load-smoke.txt'), ('100 rps', 'load-full.txt')]:
              log = root / filename
              if log.exists():
                  lines = [line.strip() for line in log.read_text(errors='replace').splitlines()[-8:] if line.strip()]
                  annotation(f'UAT load {label}', ' | '.join(lines))
          PY

          for result in "$SECURITY_RESULT" "$BOUNDS_RESULT" "$CACHE_RESULT" "$BROWSER_RESULT" "$LIGHTHOUSE_RESULT" "$AUTH_RESULT" "$INTERACTIONS_RESULT"; do
            if [ "$result" != success ]; then
              echo "Audit public incomplet ou en échec; consulter l'artefact audit-uat-public-${GITHUB_RUN_NUMBER}."
              exit 1
            fi
          done
          if [ "${{ inputs.load_test }}" = true ]; then
            for result in "$SMOKE_RESULT" "$FULL_LOAD_RESULT"; do
              if [ "$result" != success ]; then
                echo "Test de charge incomplet ou en échec; consulter l'artefact audit-uat-public-${GITHUB_RUN_NUMBER}."
                exit 1
              fi
            done
          fi
