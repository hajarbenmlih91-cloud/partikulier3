name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
      - name: Lint PHP and project files
        run: bash scripts/lint.sh
      - name: Build packages
        run: bash scripts/package.sh dist
      - name: Upload packages
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: partikulier-release
          path: |
            dist/*.zip
            dist/SHA256SUMS

  contrats-statiques:
    name: contrats-statiques (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
      - name: Contrat statique routes (S-ROUTE-004/005)
        env:
          PK_PLUGIN_DIR: ${{ github.workspace }}/plugin/partikulier-core
          PK_THEME_DIR: ${{ github.workspace }}/theme/partikulier
        run: |
          set -euo pipefail
          php plugin/partikulier-core/tests/routes-static.php > routes-static.json
          php -r '$d=json_decode(file_get_contents("routes-static.json"),true); if (($d["status"] ?? "") !== "PASS") { fwrite(STDERR, "routes-static: FAIL\n"); exit(1); } echo "routes-static: PASS ".$d["passed"]."/".$d["total"]."\n";'
      - name: Publier la preuve statique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrat-statique-php-${{ matrix.php }}
          path: routes-static.json

  integrite-catalogues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lot C4 - etat final i18n (zero copie de kit cote theme)
        run: |
          set -e
          # 1. Kit canonique COMPLET cote plugin
          for f in partikulier.pot ar.po ar.mo en_US.po en_US.mo; do
            test -f "plugin/partikulier-core/languages/$f" \
              || { echo "MANQUANT: plugin/partikulier-core/languages/$f"; exit 1; }
          done
          # 2. ZERO fichier de kit cote theme (seule la source vivante "es" demeure)
          for f in partikulier.pot ar.po ar.mo en_US.po en_US.mo; do
            test ! -e "theme/partikulier/languages/$f" \
              || { echo "COPIE INTERDITE PRESENTE: theme/partikulier/languages/$f"; exit 1; }
          done
          test -f theme/partikulier/languages/estatik/es-ar.mo
          test -f theme/partikulier/languages/estatik/es-ar.po
          # 3. Chargeur unique : present plugin, zero appel de textdomain cote theme
          test -f plugin/partikulier-core/src/Domain/I18n/I18nDomainLoader.php
          if grep -rnE "load_(theme_|plugin_)?textdomain" --include="*.php" theme/partikulier/ ; then
            echo "ERREUR : le theme appelle encore un chargeur de textdomain"; exit 1
          fi
          echo "integrite-catalogues (adapte lot C4) : OK"

  manifeste-preuves:
    name: manifeste-preuves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les preuves B1 à B6
        run: bash scripts/check-evidence.sh
