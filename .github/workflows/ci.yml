name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
      - name: Lint PHP and project files
        run: bash scripts/lint.sh
      - name: Build packages
        run: bash scripts/package.sh dist
      - name: Upload packages
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: partikulier-release
          path: |
            dist/*.zip
            dist/SHA256SUMS
