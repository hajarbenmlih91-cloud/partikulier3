name: Aperçu espace (page de test temporaire)

# Outil JETABLE de validation : crée (ou supprime) une page « Espace test »
# sur le site WordPress UAT, utilisant le template « Mes annonces » du code
# déployé. Déclenché par le fichier marqueur .apercu-test/action.txt
# (contenu : create ou delete), poussé sur la branche test/espace-apercu.
# À supprimer avec la branche une fois la validation terminée.

on:
  push:
    branches: ["test/espace-apercu"]
    paths: [".apercu-test/action.txt"]

permissions:
  contents: read

concurrency:
  group: apercu-espace-test
  cancel-in-progress: false

jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: uat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lire l'action demandée
        run: |
          ACTION=$(tr -d '[:space:]' < .apercu-test/action.txt)
          echo "ACTION=$ACTION" >> "$GITHUB_ENV"
          case "$ACTION" in create|delete) ;; *) echo "::error::Action inconnue : $ACTION"; exit 1 ;; esac

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::Le secret SSH_KNOWN_HOSTS ne correspond pas à SSH_HOST (dev)."
            exit 1
          fi

      - name: Créer la page de test
        if: env.ACTION == 'create'
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT || '65002' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o PasswordAuthentication=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<REMOTE
          set -euo pipefail

          WP_PATH="$DEPLOY_PATH"
          cd "$WP_PATH"

          SLUG="espace-test"
          EXISTANT=$(wp post list --post_type=page --name="$SLUG" --field=ID --format=csv 2>/dev/null | head -1 || true)
          if [ -n "$EXISTANT" ]; then
            echo "Page déjà présente (id $EXISTANT), réutilisation."
            ID="$EXISTANT"
          else
            ID=$(wp post create --post_type=page --post_status=publish \
              --post_title="Espace test" --post_name="$SLUG" --porcelain)
            echo "Page créée (id $ID)."
          fi

          wp post meta update "$ID" _wp_page_template "templates/page-mes-annonces.php"
          wp eval "pll_set_post_language($ID, 'fr');" 2>/dev/null || echo "Polylang : langue non définie (facultatif)."

          echo "URL de test :"
          wp eval "echo get_permalink($ID), PHP_EOL;"
          REMOTE

      - name: Supprimer la page de test
        if: env.ACTION == 'delete'
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT || '65002' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o PasswordAuthentication=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<REMOTE
          set -euo pipefail
          cd "$DEPLOY_PATH"

          SLUG="espace-test"
          ID=$(wp post list --post_type=page --name="$SLUG" --field=ID --format=csv 2>/dev/null | head -1 || true)
          if [ -n "$ID" ]; then
            wp post delete "$ID" --force
            echo "Page de test supprimée (id $ID)."
          else
            echo "Aucune page de test à supprimer."
          fi
          REMOTE
