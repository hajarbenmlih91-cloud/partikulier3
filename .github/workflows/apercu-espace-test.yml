name: Aperçu espace (page de test temporaire)

# Outil JETABLE de validation sur le site WordPress UAT. Déclenché par un
# tag pre-release-* (seuls ces tags sont autorisés par la politique de
# l'environnement uat) ; l'action est lue dans le fichier marqueur
# .apercu-test/action.txt du commit tagué :
#   create : crée la page « Espace test » (template Mes annonces)
#   delete : supprime cette page
#   seed   : prépare le compte de test (nom affiché + 3 annonces du site
#            affectées à ce compte, pour voir l'espace rempli)
# À supprimer avec la branche test/espace-apercu après validation.

on:
  push:
    tags: ["pre-release-*"]

permissions:
  contents: read

concurrency:
  group: apercu-espace-test
  cancel-in-progress: false

jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: uat

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lire l'action demandée
        run: |
          ACTION=$(tr -d '[:space:]' < .apercu-test/action.txt)
          echo "ACTION=$ACTION" >> "$GITHUB_ENV"
          case "$ACTION" in create|delete|seed) ;; *) echo "::error::Action inconnue : $ACTION"; exit 1 ;; esac

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?secret SSH_HOST manquant}"
          : "${SSH_PORT:?secret SSH_PORT manquant}"
          : "${SSH_USER:?secret SSH_USER manquant}"
          : "${SSH_PRIVATE_KEY:?secret SSH_PRIVATE_KEY manquant}"
          : "${SSH_KNOWN_HOSTS:?secret SSH_KNOWN_HOSTS manquant}"
          : "${WP_PATH:?secret WP_PATH manquant}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          {
            echo "Host partikulier-hostinger"
            echo "  HostName $SSH_HOST"
            echo "  Port $SSH_PORT"
            echo "  User $SSH_USER"
            echo "  IdentityFile $HOME/.ssh/id_ed25519"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  ConnectionAttempts 4"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 15"
            echo "  ServerAliveCountMax 3"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Créer la page de test
        if: env.ACTION == 'create'
        env:
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          ssh partikulier-hostinger 'bash -s' -- "$WP_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"

          SLUG="espace-test"
          # Un plugin de cache écrit « Success: Purged... » sur stdout pendant
          # les écritures : ne garder que les lignes purement numériques.
          EXISTANT=$(wp post list --post_type=page --name="$SLUG" --field=ID --format=csv 2>/dev/null | grep -E '^[0-9]+$' | head -1 || true)
          if [ -n "$EXISTANT" ]; then
            echo "Page déjà présente (id $EXISTANT), réutilisation."
            ID="$EXISTANT"
          else
            ID=$(wp post create --post_type=page --post_status=publish \
              --post_title="Espace test" --post_name="$SLUG" --porcelain | grep -E '^[0-9]+$' | tail -1)
            if [ -z "$ID" ]; then
              ID=$(wp post list --post_type=page --name="$SLUG" --field=ID --format=csv 2>/dev/null | grep -E '^[0-9]+$' | head -1 || true)
            fi
            [ -n "$ID" ] || { echo "::error::ID de la page créée introuvable."; exit 1; }
            echo "Page créée (id $ID)."
          fi

          wp post meta update "$ID" _wp_page_template "templates/page-mes-annonces.php"
          wp eval "pll_set_post_language($ID, 'fr');" 2>/dev/null || echo "Polylang : langue non définie (facultatif)."

          echo "URL de test :"
          wp eval "echo get_permalink($ID), PHP_EOL;"
          REMOTE

      - name: Supprimer la page de test
        if: env.ACTION == 'delete'
        env:
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          ssh partikulier-hostinger 'bash -s' -- "$WP_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"

          SLUG="espace-test"
          ID=$(wp post list --post_type=page --name="$SLUG" --field=ID --format=csv 2>/dev/null | grep -E '^[0-9]+$' | head -1 || true)
          if [ -n "$ID" ]; then
            wp post delete "$ID" --force
            echo "Page de test supprimée (id $ID)."
          else
            echo "Aucune page de test à supprimer."
          fi
          REMOTE

      - name: Préparer le compte de test (nom + 3 annonces)
        if: env.ACTION == 'seed'
        env:
          WP_PATH: ${{ secrets.WP_PATH }}
        run: |
          set -euo pipefail
          ssh partikulier-hostinger 'bash -s' -- "$WP_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"

          COMPTE="dashboard.test@pep.ma"
          UID_TEST=$(wp user get "$COMPTE" --field=ID 2>/dev/null | grep -E '^[0-9]+$' | head -1 || true)
          [ -n "$UID_TEST" ] || { echo "::error::Compte de test introuvable."; exit 1; }
          echo "Compte de test : id $UID_TEST"

          # Nom affichable : le badge de l'espace montre le premier mot du nom.
          wp user update "$UID_TEST" --display_name="Compte test" >/dev/null
          wp user meta update "$UID_TEST" first_name "Compte" >/dev/null
          wp user meta update "$UID_TEST" last_name "test" >/dev/null

          # 3 annonces publiées avec photo, affectées à ce compte.
          CHOISIES=""
          CANDIDATES=$(wp post list --post_type=properties --post_status=publish --posts_per_page=40 --field=ID --format=csv 2>/dev/null | grep -E '^[0-9]+$' || true)
          for ID in $CANDIDATES; do
            PHOTO=$(wp post meta get "$ID" _thumbnail_id 2>/dev/null | grep -E '^[0-9]+$' | head -1 || true)
            [ -n "$PHOTO" ] || continue
            DEJA=$(wp post get "$ID" --field=post_author 2>/dev/null | grep -E '^[0-9]+$' | head -1 || true)
            if [ "$DEJA" != "$UID_TEST" ]; then
              wp post update "$ID" --post_author="$UID_TEST" >/dev/null
            fi
            echo "Annonce $ID : $(wp post get "$ID" --field=post_title 2>/dev/null | head -1)"
            CHOISIES="$CHOISIES $ID"
            [ "$(echo $CHOISIES | wc -w)" -ge 3 ] && break
          done
          [ "$(echo $CHOISIES | wc -w)" -ge 1 ] || { echo "::error::Aucune annonce candidate trouvée."; exit 1; }
          echo "Annonces affectées au compte de test :$CHOISIES"
          REMOTE
