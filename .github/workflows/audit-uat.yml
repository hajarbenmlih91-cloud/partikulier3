name: Audit réel du staging UAT

# Audit déclenché manuellement uniquement : aucune installation ni aucun déploiement.
# Le job lit le staging, sauf création puis suppression d'un compte propriétaire
# temporaire pour vérifier réellement la connexion et le tableau de bord.
on:
  workflow_dispatch:
    inputs:
      load_test:
        description: Exécuter le test de charge complet (sonde 10 rps puis 100 rps si la sonde tient)
        required: true
        default: false
        type: boolean
      run_prompts:
        description: Exécuter uniquement les 10 scénarios UAT ciblés (sans HMAC ni charge)
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      load_test:
        description: Exécuter le test de charge complet (sonde 10 rps puis 100 rps si la sonde tient)
        required: false
        default: false
        type: boolean
      run_prompts:
        description: Exécuter uniquement les 10 scénarios UAT ciblés (sans HMAC ni charge)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: audit-uat-partikulier
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.run_prompts != true }}
    name: SEO, sécurité, navigateur, authentification et performance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: uat
      url: https://darkcyan-yak-151002.hostingersite.com
    env:
      PK_SECRET: ${{ secrets.PARTIKULIER_N8N_SECRET }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      WP_PATH: ${{ secrets.WP_PATH }}
      AUDIT_OUT_DIR: ${{ github.workspace }}/uat-audit-artifacts
    defaults:
      run:
        shell: bash

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vérifier la cible UAT (interdit de viser la production)
        run: |
          set -euo pipefail
          SITE_URL='https://darkcyan-yak-151002.hostingersite.com'
          export SITE_URL
          printf 'SITE_URL=%s\n' "$SITE_URL" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          site = os.environ['SITE_URL'].rstrip('/')
          parsed = urlparse(site)
          expected = 'darkcyan-yak-151002.hostingersite.com'
          if parsed.scheme != 'https' or parsed.hostname != expected:
              raise SystemExit(f"Cible refusée : {site!r}; UAT attendue https://{expected}")
          print(f"Cible UAT validée : {site}")
          PY
          mkdir -p "$AUDIT_OUT_DIR"
          printf '# Audit UAT — %s\n\nCommit testé : `%s`\n\n' "$SITE_URL" "$GITHUB_SHA" > "$AUDIT_OUT_DIR/README.md"

      - name: Installer PHP CLI et cURL
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          coverage: none

      - name: Installer Node, Playwright et Chromium
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          cd theme/partikulier
          npm ci
          npm install --no-save axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Configurer SSH strict vers l'environnement UAT
        id: ssh
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Secret SSH_HOST absent}"
          : "${SSH_PORT:?Secret SSH_PORT absent}"
          : "${SSH_USER:?Secret SSH_USER absent}"
          : "${SSH_PRIVATE_KEY:?Secret SSH_PRIVATE_KEY absent}"
          : "${SSH_KNOWN_HOSTS:?Secret SSH_KNOWN_HOSTS absent}"
          : "${WP_PATH:?Secret WP_PATH absent}"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo 'SSH_HOST refusé par la validation stricte' >&2; exit 2; }
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SSH_USER refusé par la validation stricte' >&2; exit 2; }
          [[ "$SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( SSH_PORT <= 65535 )) || { echo 'SSH_PORT doit être numérique (1..65535, sans zéro initial)' >&2; exit 2; }
          [[ "$WP_PATH" == /* && "$WP_PATH" != *$'\n'* ]] || { echo 'WP_PATH doit être un chemin absolu sur une ligne' >&2; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          {
            echo "Host partikulier-uat"
            echo "  HostName $SSH_HOST"
            echo "  Port $SSH_PORT"
            echo "  User $SSH_USER"
            echo "  IdentityFile $HOME/.ssh/id_ed25519"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  ConnectionAttempts 4"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 15"
            echo "  ServerAliveCountMax 3"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          key_id="$(ssh -F "$HOME/.ssh/config" partikulier-uat 'bash -s' -- "$WP_PATH" <<'REMOTE'
          set -euo pipefail
          wp_path="$1"
          test -f "$wp_path/wp-config.php" || { echo 'wp-config.php absent' >&2; exit 1; }
          cd "$wp_path"
          command -v wp >/dev/null 2>&1 || { echo 'WP-CLI absent sur la cible SSH' >&2; exit 1; }
          expected='darkcyan-yak-151002.hostingersite.com'
          home="$(wp option get home --quiet)"
          siteurl="$(wp option get siteurl --quiet)"
          case "${home%/}" in "https://$expected") ;; *) echo 'WordPress home ne correspond pas à la cible UAT autorisée' >&2; exit 1 ;; esac
          case "${siteurl%/}" in "https://$expected"|"https://$expected/"*) ;; *) echo 'WordPress siteurl ne correspond pas à la cible UAT autorisée' >&2; exit 1 ;; esac
          key_id="$(wp eval 'echo array_key_first(\Partikulier\Core\Domain\Automation\AutomationService::secret_keys());' --quiet)"
          [[ "$key_id" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo 'Aucune clé HMAC active exploitable; arrêt avant création de compte.' >&2; exit 1; }
          printf '%s\n' "$key_id"
          REMOTE
          )"
          [[ "$key_id" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo 'Réponse SSH inattendue; arrêt sûr.' >&2; exit 1; }
          echo "hmac_key_id=$key_id" >> "$GITHUB_OUTPUT"
          echo "SSH et origine WordPress UAT vérifiés; identifiant HMAC actif=$key_id (aucun secret exposé)."

      - name: Créer un compte propriétaire jetable pour le parcours connecté
        id: seed
        if: steps.ssh.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          login="pk_audit_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          email="${login}@example.invalid"
          marker="$(openssl rand -hex 24)"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          {
            echo "login=$login"
            echo "email=$email"
            echo "marker=$marker"
          } >> "$GITHUB_OUTPUT"
          user_id="$(ssh -F "$HOME/.ssh/config" partikulier-uat 'bash -s' -- "$WP_PATH" "$login" "$email" "$password" "$marker" <<'REMOTE'
          set -euo pipefail
          wp_path="$1"; login="$2"; email="$3"; password="$4"; marker="$5"
          cd "$wp_path"
          command -v wp >/dev/null 2>&1 || { echo 'WP-CLI absent' >&2; exit 1; }
          if wp user get "$login" --field=ID >/dev/null 2>&1; then
            echo "Le compte jetable existe déjà; arrêt sans toucher au compte." >&2
            exit 1
          fi
          meta_input="{\"_pk_uat_audit_marker\":\"$marker\"}"
          wp user create "$login" "$email" --role=contributor --user_pass="$password" --meta_input="$meta_input" --porcelain
          REMOTE
          )"
          [[ "$user_id" =~ ^[0-9]+$ ]] || { echo "WP-CLI n'a pas renvoyé un ID utilisateur" >&2; exit 1; }
          {
            echo "user_id=$user_id"
            echo "password=$password"
          } >> "$GITHUB_OUTPUT"
          echo "Compte temporaire contributor créé (ID $user_id); aucune annonce n'est créée."

      - name: Contrats sécurité live (GET et POST négatifs/HMAC)
        id: security
        continue-on-error: true
        env:
          PK_KEY_ID: ${{ steps.ssh.outputs.hmac_key_id }}
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-securite.php "$SITE_URL" 2>&1 | tee "$AUDIT_OUT_DIR/security.txt"

      - name: Contrat cache et TTFB extérieur
        id: cache
        continue-on-error: true
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-cache.php "$SITE_URL" /fr/annonces/ 20 2>&1 | tee "$AUDIT_OUT_DIR/cache-ttfb.txt"

      - name: Sondage de charge prudent (10 req/s pendant 10 s)
        id: load_smoke
        if: ${{ inputs.load_test }}
        continue-on-error: true
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-charge.php "$SITE_URL" 10 10 /fr/annonces/ /fr/ /fr/annonces/?es_city=casablanca 2>&1 | tee "$AUDIT_OUT_DIR/load-smoke.txt"

      - name: Charge complète (100 req/s pendant 30 s; uniquement si la sonde tient)
        id: load_full
        if: ${{ inputs.load_test && steps.load_smoke.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-charge.php "$SITE_URL" 100 30 /fr/annonces/ /fr/ /fr/annonces/?es_city=casablanca 2>&1 | tee "$AUDIT_OUT_DIR/load-full.txt"

      - name: Audit réel des pages en Chromium (3 langues, 4 largeurs, Axe, XSS réfléchi)
        id: browser_audit
        continue-on-error: true
        working-directory: theme/partikulier
        env:
          PK_BASE: https://darkcyan-yak-151002.hostingersite.com
        run: |
          set -euo pipefail
          node tests/audit-uat.mjs 2>&1 | tee "$AUDIT_OUT_DIR/browser-audit.txt"

      - name: Interactions JavaScript, captures mobile et Web Vitals laboratoire
        id: interactions
        continue-on-error: true
        working-directory: theme/partikulier
        env:
          PK_BASE: https://darkcyan-yak-151002.hostingersite.com
        run: |
          set -euo pipefail
          node tests/audit-uat-interactions.mjs 2>&1 | tee "$AUDIT_OUT_DIR/interactions-vitals.txt"

      - name: Parcours connecté du propriétaire temporaire
        id: owner_journey
        if: steps.seed.outcome == 'success'
        continue-on-error: true
        working-directory: theme/partikulier
        env:
          PK_BASE: https://darkcyan-yak-151002.hostingersite.com
          AUDIT_LOGIN_EMAIL: ${{ steps.seed.outputs.email }}
          AUDIT_LOGIN_PASSWORD: ${{ steps.seed.outputs.password }}
        run: |
          set -euo pipefail
          node tests/audit-uat-login.mjs 2>&1 | tee "$AUDIT_OUT_DIR/owner-journey.txt"

      - name: Supprimer le compte de test UAT (même après échec)
        id: cleanup
        if: always() && steps.ssh.outcome == 'success' && steps.seed.outputs.login != ''
        continue-on-error: true
        env:
          AUDIT_LOGIN: ${{ steps.seed.outputs.login }}
          AUDIT_EMAIL: ${{ steps.seed.outputs.email }}
          AUDIT_MARKER: ${{ steps.seed.outputs.marker }}
        run: |
          set -euo pipefail
          ssh -F "$HOME/.ssh/config" partikulier-uat 'bash -s' -- "$WP_PATH" "$AUDIT_LOGIN" "$AUDIT_EMAIL" "$AUDIT_MARKER" <<'REMOTE'
          set -euo pipefail
          wp_path="$1"; login="$2"; expected_email="$3"; expected_marker="$4"
          cd "$wp_path"
          user_id="$(wp user get "$login" --field=ID 2>/dev/null || true)"
          if [[ -z "$user_id" ]]; then echo 'Compte temporaire absent; aucun nettoyage requis.'; exit 0; fi
          [[ "$user_id" =~ ^[0-9]+$ ]] || { echo 'ID utilisateur non numérique; arrêt sûr.' >&2; exit 1; }
          email="$(wp user get "$user_id" --field=user_email)"
          role="$(wp user get "$user_id" --field=roles)"
          marker="$(wp user meta get "$user_id" _pk_uat_audit_marker 2>/dev/null || true)"
          [[ "$email" == "$expected_email" && "$role" == 'contributor' && "$marker" == "$expected_marker" ]] || {
            echo 'Compte trouvé mais identité/marker hors contrat; aucune suppression effectuée.' >&2
            exit 1
          }
          admin_id="$(wp user list --role=administrator --field=ID --format=ids | awk '{print $1}')"
          [[ "$admin_id" =~ ^[0-9]+$ ]] || { echo 'Aucun administrateur de réaffectation sûr; compte conservé.' >&2; exit 1; }
          wp user delete "$user_id" --yes --reassign="$admin_id"
          REMOTE
          echo "Compte temporaire supprimé et contenu réaffecté à un administrateur si nécessaire."

      - name: Lighthouse mobile et desktop (Performance, Accessibilité, SEO, Best Practices)
        id: lighthouse
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install --global lighthouse@12.8.2
          chrome_path="$(cd theme/partikulier && node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          run_lh() {
            local label="$1" url="$2" form="$3"
            echo "Lighthouse $label — $url ($form)"
            lighthouse "$url" \
              --chrome-path="$chrome_path" \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo \
              --form-factor="$form" \
              --output=json \
              --output-path="$AUDIT_OUT_DIR/lighthouse-$label.json" \
              --quiet
          }
          run_lh fr-home-mobile "$SITE_URL/fr/" mobile
          run_lh en-home-mobile "$SITE_URL/en/" mobile
          run_lh ar-home-mobile "$SITE_URL/ar/" mobile
          run_lh fr-listings-mobile "$SITE_URL/fr/annonces/" mobile
          run_lh fr-home-desktop "$SITE_URL/fr/" desktop
          python - "$AUDIT_OUT_DIR" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          lines = ['## Lighthouse scores et métriques', '', '| Page | Perf | A11y | Best practices | SEO | LCP ms | INP ms | CLS | TBT ms |', '|---|---:|---:|---:|---:|---:|---:|---:|---:|']
          for f in sorted(root.glob('lighthouse-*.json')):
              data = json.loads(f.read_text())
              cats = data.get('categories', {})
              audits = data.get('audits', {})
              score = lambda name: round((cats.get(name, {}).get('score') or 0) * 100)
              def metric(*ids):
                  for audit_id in ids:
                      value = audits.get(audit_id, {}).get('numericValue')
                      if value is not None:
                          return round(value)
                  return 'n/a'
              lines.append(f"| {f.stem.removeprefix('lighthouse-')} | {score('performance')} | {score('accessibility')} | {score('best-practices')} | {score('seo')} | {metric('largest-contentful-paint')} | {metric('interaction-to-next-paint', 'experimental-interaction-to-next-paint')} | {metric('cumulative-layout-shift')} | {metric('total-blocking-time')} |")
          lines.extend(['', 'Note : INP peut être n/a en Lighthouse navigation; interaction-web-vitals.json contient le proxy INP laboratoire des interactions Playwright.'])
          (root / 'lighthouse-summary.md').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Résumé des contrôles et nettoyage des clés SSH
        if: always()
        env:
          SSH_RESULT: ${{ steps.ssh.outcome }}
          SEED_RESULT: ${{ steps.seed.outcome }}
          CLEANUP_RESULT: ${{ steps.cleanup.outcome }}
          SECURITY_RESULT: ${{ steps.security.outcome }}
          CACHE_RESULT: ${{ steps.cache.outcome }}
          SMOKE_RESULT: ${{ steps.load_smoke.outcome }}
          FULL_LOAD_RESULT: ${{ steps.load_full.outcome }}
          BROWSER_RESULT: ${{ steps.browser_audit.outcome }}
          OWNER_RESULT: ${{ steps.owner_journey.outcome }}
          LIGHTHOUSE_RESULT: ${{ steps.lighthouse.outcome }}
          INTERACTIONS_RESULT: ${{ steps.interactions.outcome }}
        run: |
          set -u
          {
            echo ''
            echo '## Résultat des suites UAT'
            echo ''
            echo '| Suite | Résultat |'
            echo '|---|---|'
            echo "| SSH UAT | ${SSH_RESULT:-skipped} |"
            echo "| Compte temporaire | ${SEED_RESULT:-skipped} |"
            echo "| Nettoyage du compte temporaire | ${CLEANUP_RESULT:-skipped} |"
            echo "| Sécurité live | ${SECURITY_RESULT:-skipped} |"
            echo "| Cache/TTFB | ${CACHE_RESULT:-skipped} |"
            echo "| Charge 10 rps | ${SMOKE_RESULT:-skipped} |"
            echo "| Charge 100 rps | ${FULL_LOAD_RESULT:-skipped} |"
            echo "| Chromium/Axe | ${BROWSER_RESULT:-skipped} |"
            echo "| Connexion propriétaire | ${OWNER_RESULT:-skipped} |"
            echo "| Interactions JavaScript + LCP/INP | ${INTERACTIONS_RESULT:-skipped} |"
            echo "| Lighthouse | ${LIGHTHOUSE_RESULT:-skipped} |"
          } | tee -a "$AUDIT_OUT_DIR/README.md" || true
          for summary in "$AUDIT_OUT_DIR/interaction-web-vitals.md" "$AUDIT_OUT_DIR/lighthouse-summary.md"; do
            if [ -f "$summary" ]; then cat "$summary" | tee -a "$GITHUB_STEP_SUMMARY" "$AUDIT_OUT_DIR/README.md"; fi
          done
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Publier le rapport et les captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-uat-${{ github.run_number }}
          path: ${{ github.workspace }}/uat-audit-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Verdict final (échec visible si une suite échoue)
        if: always()
        env:
          SSH_RESULT: ${{ steps.ssh.outcome }}
          SEED_RESULT: ${{ steps.seed.outcome }}
          CLEANUP_RESULT: ${{ steps.cleanup.outcome }}
          SECURITY_RESULT: ${{ steps.security.outcome }}
          CACHE_RESULT: ${{ steps.cache.outcome }}
          SMOKE_RESULT: ${{ steps.load_smoke.outcome }}
          FULL_LOAD_RESULT: ${{ steps.load_full.outcome }}
          BROWSER_RESULT: ${{ steps.browser_audit.outcome }}
          OWNER_RESULT: ${{ steps.owner_journey.outcome }}
          LIGHTHOUSE_RESULT: ${{ steps.lighthouse.outcome }}
          INTERACTIONS_RESULT: ${{ steps.interactions.outcome }}
        run: |
          set -euo pipefail
          for result in "$SSH_RESULT" "$SEED_RESULT" "$CLEANUP_RESULT" "$SECURITY_RESULT" "$CACHE_RESULT" "$BROWSER_RESULT" "$OWNER_RESULT" "$LIGHTHOUSE_RESULT" "$INTERACTIONS_RESULT"; do
            if [ "$result" != success ]; then
              echo "Audit incomplet ou en échec; consulter l'artefact audit-uat-${GITHUB_RUN_NUMBER}."
              exit 1
            fi
          done
          if [ "${{ inputs.load_test }}" = true ]; then
            for result in "$SMOKE_RESULT" "$FULL_LOAD_RESULT"; do
              if [ "$result" != success ]; then
                echo "Test de charge incomplet ou en échec; consulter l'artefact audit-uat-${GITHUB_RUN_NUMBER}."
                exit 1
              fi
            done
          fi
          echo "Toutes les suites sélectionnées ont terminé sans échec de commande. Lire l'artefact pour les scores et constats non bloquants."
  prompts:
    if: ${{ inputs.run_prompts == true }}
    name: Scénarios UAT ciblés (sans HMAC ni charge)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: uat
      url: https://darkcyan-yak-151002.hostingersite.com
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      WP_PATH: ${{ secrets.WP_PATH }}
      AUDIT_OUT_DIR: ${{ github.workspace }}/uat-prompt-artifacts
    defaults:
      run:
        shell: bash
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Valider exclusivement la cible UAT
        run: |
          set -euo pipefail
          SITE_URL='https://darkcyan-yak-151002.hostingersite.com'
          [[ "$SITE_URL" == 'https://darkcyan-yak-151002.hostingersite.com' ]]
          printf 'SITE_URL=%s\n' "$SITE_URL" >> "$GITHUB_ENV"
          mkdir -p "$AUDIT_OUT_DIR"
          printf '# 10 scénarios UAT\n\nCible : %s\nCommit : `%s`\nAucun HMAC, dépôt public ou test de charge.\n' "$SITE_URL" "$GITHUB_SHA" > "$AUDIT_OUT_DIR/README.md"

      - name: Installer PHP CLI et cURL
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          coverage: none
      - name: Vérifier la syntaxe du helper avant toute connexion UAT
        run: php -l .github/scripts/uat-prompts-fixture.php

      - name: Installer Node et Playwright Chromium
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          cd theme/partikulier
          npm ci
          npx playwright install --with-deps chromium
          ln -s "$GITHUB_WORKSPACE/theme/partikulier/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Configurer SSH strict vers l’UAT
        id: ssh
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Secret SSH_HOST absent}"
          : "${SSH_PORT:?Secret SSH_PORT absent}"
          : "${SSH_USER:?Secret SSH_USER absent}"
          : "${SSH_PRIVATE_KEY:?Secret SSH_PRIVATE_KEY absent}"
          : "${SSH_KNOWN_HOSTS:?Secret SSH_KNOWN_HOSTS absent}"
          : "${WP_PATH:?Secret WP_PATH absent}"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( SSH_PORT <= 65535 ))
          [[ "$WP_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          {
            echo 'Host partikulier-uat'
            echo "  HostName $SSH_HOST"
            echo "  Port $SSH_PORT"
            echo "  User $SSH_USER"
            echo "  IdentityFile $HOME/.ssh/id_ed25519"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo '  StrictHostKeyChecking yes'
            echo '  IdentitiesOnly yes'
            echo '  BatchMode yes'
            echo '  ConnectTimeout 15'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          echo "SSH strict configuré pour le contrôle UAT."

      - name: Préparer les identifiants uniques du run
        id: fixture_vars
        run: |
          set -euo pipefail
          run="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          login="pk_prompt_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          email="${login}@example.invalid"
          display="UAT Prompt ${GITHUB_RUN_ID}"
          marker="$(openssl rand -hex 24)"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          env_local="$RUNNER_TEMP/pk-uat-prompts-${run}.env"
          env_remote="/tmp/pk-uat-prompts-${run}.env"
          fixture_remote="/tmp/pk-uat-prompts-${run}.php"
          {
            printf 'PK_PROMPT_RUN=%q\n' "$run"
            printf 'PK_PROMPT_LOGIN=%q\n' "$login"
            printf 'PK_PROMPT_EMAIL=%q\n' "$email"
            printf 'PK_PROMPT_NAME=%q\n' "$display"
            printf 'PK_PROMPT_MARKER=%q\n' "$marker"
            printf 'PK_PROMPT_PASSWORD=%q\n' "$password"
          } > "$env_local"
          chmod 600 "$env_local"
          printf 'PROMPT_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          {
            echo "run=$run"
            echo "login=$login"
            echo "email=$email"
            echo "display=$display"
            echo "marker=$marker"
            echo "env_local=$env_local"
            echo "env_remote=$env_remote"
            echo "fixture_remote=$fixture_remote"
          } >> "$GITHUB_OUTPUT"

      - name: Copier le helper CLI temporaire vers /tmp sur l’UAT
        id: upload_fixture
        run: |
          set -euo pipefail
          scp -F "$HOME/.ssh/config" .github/scripts/uat-prompts-fixture.php "partikulier-uat:${{ steps.fixture_vars.outputs.fixture_remote }}"
          scp -F "$HOME/.ssh/config" "${{ steps.fixture_vars.outputs.env_local }}" "partikulier-uat:${{ steps.fixture_vars.outputs.env_remote }}"
          echo 'Helper et variables de fixture transmis via SSH strict; aucun contenu secret affiché.'

      - name: Créer le compte et l’annonce temporaire marqués
        id: seed
        continue-on-error: true
        run: |
          set -euo pipefail
          result="$(ssh -F "$HOME/.ssh/config" partikulier-uat 'bash -s' -- "$WP_PATH" "${{ steps.fixture_vars.outputs.fixture_remote }}" "${{ steps.fixture_vars.outputs.env_remote }}" <<'REMOTE'
          set -euo pipefail
          wp_path="$1"; fixture="$2"; env_file="$3"
          set -a
          source "$env_file"
          set +a
          cd "$wp_path"
          PK_PROMPT_MODE=seed wp eval-file "$fixture"
          REMOTE
          )"
          printf '%s\n' "$result" > "$AUDIT_OUT_DIR/fixture-seed.json"
          seed_values="$(python - "$AUDIT_OUT_DIR/fixture-seed.json" <<'PY'
          import json, sys
          from urllib.parse import urlsplit, urlunsplit
          expected = 'darkcyan-yak-151002.hostingersite.com'
          value = None
          with open(sys.argv[1], encoding='utf-8') as stream:
              for line in stream:
                  try:
                      candidate = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(candidate, dict) and 'listing_id' in candidate and 'listing_url' in candidate:
                      value = candidate
                      break
          if value is None:
              raise SystemExit('WP-CLI did not return a fixture JSON object')
          listing_id = int(value['listing_id'])
          parsed = urlsplit(value['listing_url'])
          if parsed.hostname != expected or parsed.scheme not in ('http', 'https') or parsed.username or parsed.password:
              raise SystemExit('Fixture permalink failed the strict UAT-host guard')
          listing_url = urlunsplit(('https', expected, parsed.path or '/', parsed.query, parsed.fragment))
          print(listing_id)
          print(listing_url)
          PY
          )"
          mapfile -t seed_values_array <<< "$seed_values"
          listing_id="${seed_values_array[0]}"
          listing_url="${seed_values_array[1]}"
          [[ "$listing_id" =~ ^[0-9]+$ && "$listing_url" == https://darkcyan-yak-151002.hostingersite.com/* ]]
          { echo "listing_id=$listing_id"; echo "listing_url=$listing_url"; } >> "$GITHUB_OUTPUT"
          { echo "PROMPT_LISTING_ID=$listing_id"; echo "PROMPT_LISTING_URL=$listing_url"; echo "PROMPT_EMAIL=${{ steps.fixture_vars.outputs.email }}"; echo "PROMPT_DISPLAY_NAME=${{ steps.fixture_vars.outputs.display }}"; } >> "$GITHUB_ENV"
          echo "Compte et fixture créés via WP-CLI; titre à marqueur de run, aucune annonce de démo touchée."

      - name: Exécuter les dix scénarios dans le navigateur
        id: prompt_tests
        if: steps.seed.outcome == 'success'
        continue-on-error: true
        env:
          PK_BASE: https://darkcyan-yak-151002.hostingersite.com
        run: |
          set -euo pipefail
          node .github/scripts/uat-prompts.mjs 2>&1 | tee "$AUDIT_OUT_DIR/prompts-console.txt"

      - name: Nettoyer uniquement les fixtures du run et vérifier leur absence
        id: cleanup_fixtures
        if: always() && steps.ssh.outcome == 'success' && steps.fixture_vars.outputs.login != '' && steps.upload_fixture.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh -F "$HOME/.ssh/config" partikulier-uat 'bash -s' -- "$WP_PATH" "${{ steps.fixture_vars.outputs.fixture_remote }}" "${{ steps.fixture_vars.outputs.env_remote }}" "${{ steps.seed.outputs.listing_id }}" <<'REMOTE'
          set -euo pipefail
          wp_path="$1"; fixture="$2"; env_file="$3"; listing_id="${4:-}"
          set -a
          source "$env_file"
          set +a
          trap 'rm -f "$fixture" "$env_file"' EXIT
          cd "$wp_path"
          PK_PROMPT_LISTING_ID="$listing_id" PK_PROMPT_MODE=cleanup wp eval-file "$fixture" cleanup
          REMOTE
          echo 'Nettoyage distant vérifié.'

      - name: Nettoyer les clés SSH locales
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
          rm -f "${{ steps.fixture_vars.outputs.env_local }}"

      - name: Publier les résultats (sans secrets)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uat-prompts-${{ github.run_number }}
          path: ${{ github.workspace }}/uat-prompt-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Verdict final (scénarios et nettoyage)
        if: always()
        env:
          SEED_RESULT: ${{ steps.seed.outcome }}
          PROMPTS_RESULT: ${{ steps.prompt_tests.outcome }}
          CLEANUP_RESULT: ${{ steps.cleanup_fixtures.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SEED_RESULT" != success || "$PROMPTS_RESULT" != success || "$CLEANUP_RESULT" != success ]]; then
            echo "Scénarios UAT incomplets ou nettoyage non vérifié; consulter l’artefact uat-prompts-${GITHUB_RUN_NUMBER}."
            exit 1
          fi
          echo 'Scénarios ciblés exécutés et fixtures nettoyées.'
