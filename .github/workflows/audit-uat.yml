name: Audit réel du staging UAT

# Audit déclenché manuellement uniquement : aucune installation ni aucun déploiement.
# Le job lit le staging, sauf création puis suppression d'un compte propriétaire
# temporaire pour vérifier réellement la connexion et le tableau de bord.
on:
  workflow_dispatch:
    inputs:
      load_test:
        description: Exécuter le test de charge complet (sonde 10 rps puis 100 rps si la sonde tient)
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      load_test:
        description: Exécuter le test de charge complet (sonde 10 rps puis 100 rps si la sonde tient)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: audit-uat-partikulier
  cancel-in-progress: false

jobs:
  audit:
    name: SEO, sécurité, navigateur, authentification et performance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: uat
      url: https://darkcyan-yak-151002.hostingersite.com
    env:
      PK_SECRET: ${{ secrets.PARTIKULIER_N8N_SECRET }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      WP_PATH: ${{ secrets.WP_PATH }}
      AUDIT_OUT_DIR: ${{ github.workspace }}/uat-audit-artifacts
    defaults:
      run:
        shell: bash

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Contrat de nettoyage du compte temporaire
        run: |
          set -euo pipefail
          bash theme/partikulier/tests/uat-audit-account-cleanup-contract.sh

      - name: Vérifier la cible UAT (interdit de viser la production)
        run: |
          set -euo pipefail
          SITE_URL='https://darkcyan-yak-151002.hostingersite.com'
          export SITE_URL
          printf 'SITE_URL=%s\n' "$SITE_URL" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          site = os.environ['SITE_URL'].rstrip('/')
          parsed = urlparse(site)
          expected = 'darkcyan-yak-151002.hostingersite.com'
          if parsed.scheme != 'https' or parsed.hostname != expected:
              raise SystemExit(f"Cible refusée : {site!r}; UAT attendue https://{expected}")
          print(f"Cible UAT validée : {site}")
          PY
          mkdir -p "$AUDIT_OUT_DIR"
          printf '# Audit UAT — %s\n\nCommit testé : `%s`\n\n' "$SITE_URL" "$GITHUB_SHA" > "$AUDIT_OUT_DIR/README.md"

      - name: Installer PHP CLI et cURL
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          coverage: none

      - name: Installer Node, Playwright et Chromium
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          cd theme/partikulier
          npm ci
          npm install --no-save axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Configurer SSH strict vers l'environnement UAT
        id: ssh
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Secret SSH_HOST absent}"
          : "${SSH_PORT:?Secret SSH_PORT absent}"
          : "${SSH_USER:?Secret SSH_USER absent}"
          : "${SSH_PRIVATE_KEY:?Secret SSH_PRIVATE_KEY absent}"
          : "${SSH_KNOWN_HOSTS:?Secret SSH_KNOWN_HOSTS absent}"
          : "${WP_PATH:?Secret WP_PATH absent}"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo 'SSH_HOST refusé par la validation stricte' >&2; exit 2; }
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'SSH_USER refusé par la validation stricte' >&2; exit 2; }
          [[ "$SSH_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( SSH_PORT <= 65535 )) || { echo 'SSH_PORT doit être numérique (1..65535, sans zéro initial)' >&2; exit 2; }
          [[ "$WP_PATH" == /* && "$WP_PATH" != *$'\n'* ]] || { echo 'WP_PATH doit être un chemin absolu sur une ligne' >&2; exit 2; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          {
            echo "Host partikulier-uat"
            echo "  HostName $SSH_HOST"
            echo "  Port $SSH_PORT"
            echo "  User $SSH_USER"
            echo "  IdentityFile $HOME/.ssh/id_ed25519"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  ConnectionAttempts 4"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 15"
            echo "  ServerAliveCountMax 3"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          key_id="$(ssh -F "$HOME/.ssh/config" partikulier-uat 'bash -s' -- "$WP_PATH" <<'REMOTE'
          set -euo pipefail
          wp_path="$1"
          test -f "$wp_path/wp-config.php" || { echo 'wp-config.php absent' >&2; exit 1; }
          cd "$wp_path"
          command -v wp >/dev/null 2>&1 || { echo 'WP-CLI absent sur la cible SSH' >&2; exit 1; }
          expected='darkcyan-yak-151002.hostingersite.com'
          home="$(wp option get home --quiet)"
          siteurl="$(wp option get siteurl --quiet)"
          case "${home%/}" in "https://$expected") ;; *) echo 'WordPress home ne correspond pas à la cible UAT autorisée' >&2; exit 1 ;; esac
          case "${siteurl%/}" in "https://$expected"|"https://$expected/"*) ;; *) echo 'WordPress siteurl ne correspond pas à la cible UAT autorisée' >&2; exit 1 ;; esac
          key_id="$(wp eval 'echo array_key_first(\Partikulier\Core\Domain\Automation\AutomationService::secret_keys());' --quiet)"
          [[ "$key_id" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo 'Aucune clé HMAC active exploitable; arrêt avant création de compte.' >&2; exit 1; }
          printf '%s\n' "$key_id"
          REMOTE
          )"
          [[ "$key_id" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo 'Réponse SSH inattendue; arrêt sûr.' >&2; exit 1; }
          echo "hmac_key_id=$key_id" >> "$GITHUB_OUTPUT"
          echo "SSH et origine WordPress UAT vérifiés; identifiant HMAC actif=$key_id (aucun secret exposé)."

      - name: Créer un compte propriétaire jetable pour le parcours connecté
        id: seed
        if: steps.ssh.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          login="pk_audit_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          email="${login}@example.invalid"
          marker="$(openssl rand -hex 24)"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          {
            echo "login=$login"
            echo "email=$email"
            echo "marker=$marker"
          } >> "$GITHUB_OUTPUT"
          user_id="$(ssh -F "$HOME/.ssh/config" partikulier-uat 'bash -s' -- "$WP_PATH" "$login" "$email" "$password" "$marker" <<'REMOTE'
          set -euo pipefail
          wp_path="$1"; login="$2"; email="$3"; password="$4"; marker="$5"
          cd "$wp_path"
          command -v wp >/dev/null 2>&1 || { echo 'WP-CLI absent' >&2; exit 1; }
          if wp user get "$login" --field=ID >/dev/null 2>&1; then
            echo "Le compte jetable existe déjà; arrêt sans toucher au compte." >&2
            exit 1
          fi
          delete_created() {
            local id="$1"
            local now_email now_role admin_id
            now_email="$(wp user get "$id" --field=user_email)"
            now_role="$(wp user get "$id" --field=roles)"
            [[ "$now_email" == "$email" && "$now_role" == contributor ]] || {
              echo 'Compte créé mais identité hors contrat; aucune suppression effectuée.' >&2
              exit 1
            }
            admin_id="$(wp user list --role=administrator --field=ID --format=ids | awk '{print $1}')"
            [[ "$admin_id" =~ ^[0-9]+$ ]] || {
              echo 'Aucun administrateur de réaffectation sûr; compte conservé.' >&2
              exit 1
            }
            wp user delete "$id" --yes --reassign="$admin_id"
            echo 'Compte temporaire supprimé après échec du marqueur.' >&2
          }
          user_id="$(wp user create "$login" "$email" --role=contributor --user_pass="$password" --porcelain)"
          [[ "$user_id" =~ ^[0-9]+$ ]] || { echo 'WP-CLI n a pas renvoyé un ID utilisateur' >&2; exit 1; }
          if ! wp user meta add "$user_id" _pk_uat_audit_marker "$marker" >/dev/null; then
            delete_created "$user_id"
            exit 1
          fi
          stored="$(wp user meta get "$user_id" _pk_uat_audit_marker 2>/dev/null || true)"
          if [[ "$stored" != "$marker" ]]; then
            delete_created "$user_id"
            echo 'Marqueur absent après écriture.' >&2
            exit 1
          fi
          printf '%s\n' "$user_id"
          REMOTE
          )"
          [[ "$user_id" =~ ^[0-9]+$ ]] || { echo "WP-CLI n'a pas renvoyé un ID utilisateur" >&2; exit 1; }
          {
            echo "user_id=$user_id"
            echo "password=$password"
          } >> "$GITHUB_OUTPUT"
          echo "Compte temporaire contributor créé (ID $user_id); aucune annonce n'est créée."

      - name: Contrats sécurité live (GET et POST négatifs/HMAC)
        id: security
        continue-on-error: true
        env:
          PK_KEY_ID: ${{ steps.ssh.outputs.hmac_key_id }}
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-securite.php "$SITE_URL" 2>&1 | tee "$AUDIT_OUT_DIR/security.txt"

      - name: Contrat cache et TTFB extérieur
        id: cache
        continue-on-error: true
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-cache.php "$SITE_URL" /fr/annonces/ 20 2>&1 | tee "$AUDIT_OUT_DIR/cache-ttfb.txt"

      - name: Sondage de charge prudent (10 req/s pendant 10 s)
        id: load_smoke
        if: ${{ inputs.load_test }}
        continue-on-error: true
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-charge.php "$SITE_URL" 10 10 /fr/annonces/ /fr/ /fr/annonces/?es_city=casablanca 2>&1 | tee "$AUDIT_OUT_DIR/load-smoke.txt"

      - name: Charge complète (100 req/s pendant 30 s; uniquement si la sonde tient)
        id: load_full
        if: ${{ inputs.load_test && steps.load_smoke.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          php theme/partikulier/tests/staging-charge.php "$SITE_URL" 100 30 /fr/annonces/ /fr/ /fr/annonces/?es_city=casablanca 2>&1 | tee "$AUDIT_OUT_DIR/load-full.txt"

      - name: Audit réel des pages en Chromium (3 langues, 4 largeurs, Axe, XSS réfléchi)
        id: browser_audit
        continue-on-error: true
        working-directory: theme/partikulier
        env:
          PK_BASE: https://darkcyan-yak-151002.hostingersite.com
        run: |
          set -euo pipefail
          node tests/audit-uat.mjs 2>&1 | tee "$AUDIT_OUT_DIR/browser-audit.txt"

      - name: Interactions JavaScript, captures mobile et Web Vitals laboratoire
        id: interactions
        continue-on-error: true
        working-directory: theme/partikulier
        env:
          PK_BASE: https://darkcyan-yak-151002.hostingersite.com
        run: |
          set -euo pipefail
          node tests/audit-uat-interactions.mjs 2>&1 | tee "$AUDIT_OUT_DIR/interactions-vitals.txt"

      - name: Parcours connecté du propriétaire temporaire
        id: owner_journey
        if: steps.seed.outcome == 'success'
        continue-on-error: true
        working-directory: theme/partikulier
        env:
          PK_BASE: https://darkcyan-yak-151002.hostingersite.com
          AUDIT_LOGIN_EMAIL: ${{ steps.seed.outputs.email }}
          AUDIT_LOGIN_PASSWORD: ${{ steps.seed.outputs.password }}
        run: |
          set -euo pipefail
          node tests/audit-uat-login.mjs 2>&1 | tee "$AUDIT_OUT_DIR/owner-journey.txt"

      - name: Supprimer le compte de test UAT (même après échec)
        id: cleanup
        if: always() && steps.ssh.outcome == 'success' && steps.seed.outputs.login != ''
        continue-on-error: true
        env:
          AUDIT_LOGIN: ${{ steps.seed.outputs.login }}
          AUDIT_EMAIL: ${{ steps.seed.outputs.email }}
          AUDIT_MARKER: ${{ steps.seed.outputs.marker }}
        run: |
          set -euo pipefail
          expected_login="pk_audit_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          [[ "$AUDIT_LOGIN" == "$expected_login" ]] || { echo 'Identifiant de run hors contrat; arrêt.' >&2; exit 1; }
          [[ "$AUDIT_EMAIL" == "${expected_login}@example.invalid" ]] || { echo 'Adresse hors contrat; arrêt.' >&2; exit 1; }
          [[ "$AUDIT_MARKER" =~ ^[0-9a-f]{48}$ ]] || { echo 'Marqueur attendu hors contrat; arrêt.' >&2; exit 1; }
          ssh -F "$HOME/.ssh/config" partikulier-uat 'bash -s' -- "$WP_PATH" "$AUDIT_LOGIN" "$AUDIT_EMAIL" "$AUDIT_MARKER" < theme/partikulier/tests/uat-audit-account-cleanup.sh

      - name: Lighthouse mobile et desktop (Performance, Accessibilité, SEO, Best Practices)
        id: lighthouse
        run: |
          set -euo pipefail
          npm install --global lighthouse@12.8.2
          chrome_path="$(cd theme/partikulier && node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          lh_failed=0
          run_lh() {
            local label="$1" url="$2" form="$3"
            local -a screen=()
            echo "Lighthouse $label — $url ($form)"
            if [[ "$form" == desktop ]]; then
              screen=(
                --screenEmulation.mobile=false
                --screenEmulation.width=1350
                --screenEmulation.height=940
                --screenEmulation.deviceScaleFactor=1
                --throttling.rttMs=40
                --throttling.throughputKbps=10240
                --throttling.cpuSlowdownMultiplier=1
              )
            else
              screen=(--screenEmulation.mobile=true)
            fi
            if ! lighthouse "$url" \
              --chrome-path="$chrome_path" \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo \
              --form-factor="$form" \
              "${screen[@]}" \
              --output=json \
              --output-path="$AUDIT_OUT_DIR/lighthouse-$label.json" \
              --quiet; then
              echo "Lighthouse $label en échec; les autres mesures continuent." >&2
              lh_failed=1
            fi
          }
          run_lh fr-home-mobile "$SITE_URL/fr/" mobile
          run_lh en-home-mobile "$SITE_URL/en/" mobile
          run_lh ar-home-mobile "$SITE_URL/ar/" mobile
          run_lh fr-listings-mobile "$SITE_URL/fr/annonces/" mobile
          run_lh fr-home-desktop "$SITE_URL/fr/" desktop
          python - "$AUDIT_OUT_DIR" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          lines = ['## Lighthouse scores et métriques', '', '| Page | Perf | A11y | Best practices | SEO | LCP ms | INP ms | CLS | TBT ms |', '|---|---:|---:|---:|---:|---:|---:|---:|---:|']
          for f in sorted(root.glob('lighthouse-*.json')):
              data = json.loads(f.read_text())
              cats = data.get('categories', {})
              audits = data.get('audits', {})
              score = lambda name: round((cats.get(name, {}).get('score') or 0) * 100)
              def metric(*ids):
                  for audit_id in ids:
                      value = audits.get(audit_id, {}).get('numericValue')
                      if value is not None:
                          return round(value)
                  return 'n/a'
              lines.append(f"| {f.stem.removeprefix('lighthouse-')} | {score('performance')} | {score('accessibility')} | {score('best-practices')} | {score('seo')} | {metric('largest-contentful-paint')} | {metric('interaction-to-next-paint', 'experimental-interaction-to-next-paint')} | {metric('cumulative-layout-shift')} | {metric('total-blocking-time')} |")
          lines.extend(['', 'Note : INP peut être n/a en Lighthouse navigation; interaction-web-vitals.json contient le proxy INP laboratoire des interactions Playwright.'])
          (root / 'lighthouse-summary.md').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
          if [[ "${lh_failed}" -ne 0 ]]; then
            echo 'Au moins un profil Lighthouse a échoué.' >&2
            exit 1
          fi

      - name: Résumé des contrôles et nettoyage des clés SSH
        if: always()
        env:
          SSH_RESULT: ${{ steps.ssh.outcome }}
          SEED_RESULT: ${{ steps.seed.outcome }}
          CLEANUP_RESULT: ${{ steps.cleanup.outcome }}
          SECURITY_RESULT: ${{ steps.security.outcome }}
          CACHE_RESULT: ${{ steps.cache.outcome }}
          SMOKE_RESULT: ${{ steps.load_smoke.outcome }}
          FULL_LOAD_RESULT: ${{ steps.load_full.outcome }}
          BROWSER_RESULT: ${{ steps.browser_audit.outcome }}
          OWNER_RESULT: ${{ steps.owner_journey.outcome }}
          LIGHTHOUSE_RESULT: ${{ steps.lighthouse.outcome }}
          INTERACTIONS_RESULT: ${{ steps.interactions.outcome }}
        run: |
          set -u
          {
            echo ''
            echo '## Résultat des suites UAT'
            echo ''
            echo '| Suite | Résultat |'
            echo '|---|---|'
            echo "| SSH UAT | ${SSH_RESULT:-skipped} |"
            echo "| Compte temporaire | ${SEED_RESULT:-skipped} |"
            echo "| Nettoyage du compte temporaire | ${CLEANUP_RESULT:-skipped} |"
            echo "| Sécurité live | ${SECURITY_RESULT:-skipped} |"
            echo "| Cache/TTFB | ${CACHE_RESULT:-skipped} |"
            echo "| Charge 10 rps | ${SMOKE_RESULT:-skipped} |"
            echo "| Charge 100 rps | ${FULL_LOAD_RESULT:-skipped} |"
            echo "| Chromium/Axe | ${BROWSER_RESULT:-skipped} |"
            echo "| Connexion propriétaire | ${OWNER_RESULT:-skipped} |"
            echo "| Interactions JavaScript + LCP/INP | ${INTERACTIONS_RESULT:-skipped} |"
            echo "| Lighthouse | ${LIGHTHOUSE_RESULT:-skipped} |"
          } | tee -a "$AUDIT_OUT_DIR/README.md" || true
          for summary in "$AUDIT_OUT_DIR/interaction-web-vitals.md" "$AUDIT_OUT_DIR/lighthouse-summary.md"; do
            if [ -f "$summary" ]; then cat "$summary" | tee -a "$GITHUB_STEP_SUMMARY" "$AUDIT_OUT_DIR/README.md"; fi
          done
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Publier le rapport et les captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-uat-${{ github.run_number }}
          path: ${{ github.workspace }}/uat-audit-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Verdict final (échec visible si une suite échoue)
        if: always()
        env:
          SSH_RESULT: ${{ steps.ssh.outcome }}
          SEED_RESULT: ${{ steps.seed.outcome }}
          CLEANUP_RESULT: ${{ steps.cleanup.outcome }}
          SECURITY_RESULT: ${{ steps.security.outcome }}
          CACHE_RESULT: ${{ steps.cache.outcome }}
          SMOKE_RESULT: ${{ steps.load_smoke.outcome }}
          FULL_LOAD_RESULT: ${{ steps.load_full.outcome }}
          BROWSER_RESULT: ${{ steps.browser_audit.outcome }}
          OWNER_RESULT: ${{ steps.owner_journey.outcome }}
          LIGHTHOUSE_RESULT: ${{ steps.lighthouse.outcome }}
          INTERACTIONS_RESULT: ${{ steps.interactions.outcome }}
        run: |
          set -euo pipefail
          for result in "$SSH_RESULT" "$SEED_RESULT" "$CLEANUP_RESULT" "$SECURITY_RESULT" "$CACHE_RESULT" "$BROWSER_RESULT" "$OWNER_RESULT" "$LIGHTHOUSE_RESULT" "$INTERACTIONS_RESULT"; do
            if [ "$result" != success ]; then
              echo "Audit incomplet ou en échec; consulter l'artefact audit-uat-${GITHUB_RUN_NUMBER}."
              exit 1
            fi
          done
          if [ "${{ inputs.load_test }}" = true ]; then
            for result in "$SMOKE_RESULT" "$FULL_LOAD_RESULT"; do
              if [ "$result" != success ]; then
                echo "Test de charge incomplet ou en échec; consulter l'artefact audit-uat-${GITHUB_RUN_NUMBER}."
                exit 1
              fi
            done
          fi
          echo "Toutes les suites sélectionnées ont terminé sans échec de commande. Lire l'artefact pour les scores et constats non bloquants."
